<!doctype html>
<!-- Before and after for the last room's spot-the-difference.
       http://localhost:8765/tools/before-after.html
     BEFORE is BUILD 116, shot from a throwaway copy of that commit with one line added so a
     scene could be aimed at -- it picked one of six at random and a comparison needs both
     sides showing the same tableau. AFTER is whatever shots/spot holds now.
     Click a pair to swap it; press A to hold every pair on AFTER, B on BEFORE.

     shots/ is not in git, so the images are local. To regenerate either side:

       AFTER   for sc in line vault banquet ticker contract smog; do
                 SHOOT_PAGE=tools/spot-shot.html tools/shoot.sh shots/spot "sheet-$sc" "scene=$sc&shot"
                 tools/shoot.sh shots/spot "room-$sc" "finale&phase=search&crew=100&scene=$sc&st=3.1&shot"
                 tools/shoot.sh shots/spot "dark-$sc" "finale&phase=search&crew=12&scene=$sc&st=3.1&shot"
               done   (with a server of your own on SHOOT_PORT)

       BEFORE  the same, from a temp checkout of the old commit with tools/spot-shot.html and
               tools/shoot.sh copied in, output moved to shots/spot/before/. The old build has
               no &scene= flag, so pickFinaleScene needs one line adding in the THROWAWAY copy
               or the two sides show different tableaux and the comparison means nothing. -->
<html><head><meta charset="utf-8"><title>Last room, before and after</title>
<style>
  :root { --bg:#0d0f16; --ink:#cfd6e4; --dim:#7a8296; --gold:#d4a84b; }
  html,body { margin:0; background:var(--bg); color:var(--ink);
              font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:20px 16px 4px; max-width:1000px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 6px; color:var(--gold); font-weight:600; letter-spacing:.02em; }
  p  { margin:0 0 4px; color:var(--dim); font-size:12.5px; max-width:74ch; }
  .keys { color:var(--ink); }
  nav { max-width:1000px; margin:12px auto 0; padding:0 16px; display:flex; flex-wrap:wrap; gap:8px; }
  nav button { background:#181c27; color:var(--ink); border:1px solid #2a3040; border-radius:6px;
               padding:5px 11px; font:inherit; font-size:12px; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--gold); color:#14161d; border-color:var(--gold); }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  figure { margin:0 0 26px; }
  .frame { position:relative; border:1px solid #232838; border-radius:8px; overflow:hidden;
           background:#000; cursor:pointer; aspect-ratio:1280/720; }
  .frame img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .frame img.b { opacity:0; transition:opacity .12s; }
  .frame.showB img.b { opacity:1; }
  .tag { position:absolute; left:10px; top:10px; z-index:2; padding:3px 9px; border-radius:20px;
         font-size:11px; letter-spacing:.06em; background:rgba(12,14,20,.82); border:1px solid #333b4e; }
  .frame.showB .tag { color:#e8b4a0; } .frame .tag { color:#9ee8b8; }
  figcaption { color:var(--dim); font-size:12px; padding:7px 2px 0; }
  figcaption b { color:var(--ink); font-weight:600; }
  @media (max-width:720px){ nav{gap:6px} nav button{font-size:11px;padding:4px 8px} }
</style></head><body>
<header>
  <h1>The last room — before and after</h1>
  <p><b class="keys">Click any frame</b> to swap it between the two builds. <b class="keys">A</b> holds every
     frame on AFTER, <b class="keys">B</b> on BEFORE — tapping between them is the quickest way to see what moved.</p>
  <p>BEFORE is BUILD 116, the build you were playing. AFTER is BUILD 126.</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const SCENES = [
  ['line',     'THE LINE NEVER STOPS'],
  ['vault',    'WAGES VS VAULT'],
  ['banquet',  'THEIR TABLE, YOUR FLOOR'],
  ['ticker',   'NUMBERS EAT BODIES'],
  ['contract', 'SIGN HERE FOREVER'],
  ['smog',     'PROGRESS HAS A SMELL'],
];
const VIEWS = [
  ['sheet', 'both paintings, no lamp over them — the differences themselves'],
  ['room',  'the room as played, full crew of 100'],
  ['dark',  'a crew of 12, where the lamp is small — this is where marks used to be findable without it'],
];
let view = 'sheet';
const main = document.getElementById('main'), nav = document.getElementById('nav');
for (const [v, why] of VIEWS) {
  const b = document.createElement('button');
  b.textContent = v; b.onclick = () => { view = v; render(); };
  b.dataset.v = v; nav.appendChild(b);
}
function render() {
  for (const b of nav.children) b.setAttribute('aria-pressed', b.dataset.v === view);
  const why = VIEWS.find(x => x[0] === view)[1];
  main.innerHTML = '';
  for (const [id, title] of SCENES) {
    const fig = document.createElement('figure');
    fig.innerHTML =
      '<div class="frame"><span class="tag">AFTER</span>' +
      '<img class="a" src="../shots/spot/' + view + '-' + id + '.png" alt="">' +
      '<img class="b" src="../shots/spot/before/' + view + '-' + id + '.png" alt=""></div>' +
      '<figcaption><b>' + title + '</b> — ' + why + '</figcaption>';
    const f = fig.querySelector('.frame');
    f.onclick = () => { f.classList.toggle('showB'); f.querySelector('.tag').textContent = f.classList.contains('showB') ? 'BEFORE' : 'AFTER'; };
    main.appendChild(fig);
  }
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k !== 'a' && k !== 'b') return;
  for (const f of document.querySelectorAll('.frame')) {
    f.classList.toggle('showB', k === 'b');
    f.querySelector('.tag').textContent = k === 'b' ? 'BEFORE' : 'AFTER';
  }
});
render();
</script></body></html>
