<!doctype html>
<!-- The last room's spot-the-difference, measured in PIXELS rather than read in source.
     Driven by tools/spot-check.js; open it by hand to look at the numbers.

     Why it is a browser page and not a node script like every other check here. The harness
     mocks a canvas, and a mock cannot tell you what a 0.5-alpha ellipse looks like over the
     colour that was already there. This question is ONLY about that. So it renders both
     paintings at their real on-screen size through the game's own drawFinaleScene -- under
     the game's own transform, which is the other half of why -- reads both rects back, and
     measures what actually changed.

     What it asks, and the fault each one is written against:

       FAINT      every difference must move at least MIN_DPX pixels, and its strongest
                  channel at least MIN_PEAK of 255. The contract's inkblot was painted in
                  rgba(18,22,28) onto a floor that was already that colour and moved nothing
                  by more than about 5. Four more changed under a dozen pixels each.
       OFFSET     the ink must sit within MAX_OFF of the point the hit test scores against.
                  Three differences are a body REMOVED from the painting, and were anchored
                  at that body's feet -- so the gap you can see and the place you have to
                  press were a whole tolerance apart.
       TOLERANCE  the scoring radius must not depend on the crew, and must be the flat
                  CFG.finale.hitRadius. It used to be max(36, min(lampR * 0.35, 90)): a
                  hundred survivors bought 65px of aim, and pressing on blank canvas scored.
                  This one is measured by PRESSING, not by reading the expression, because
                  the expression is exactly what was wrong.
       AREA       and the consequence of that, stated as the number Morgan actually felt:
                  how much of the painting scores. It was 74-80% at a full crew.
       SPACING    no two differences within 2 * hitRadius, or one press sits inside both.
       STRAY      the two paintings must differ ONLY where the puzzle says they do.

     Floors are numbers, not opinions, and they are deliberately set at the bottom of the
     range the differences that ALWAYS worked already sat in -- not at what looks nice.

     NO BACKTICKS BELOW THIS LINE: the bench is one template literal. -->
<html><head><meta charset="utf-8"><title>spotcheck</title>
<style>html,body{margin:0;background:#0d0f16;color:#cfe;font:12px monospace}canvas{display:block}pre{padding:8px}</style></head>
<body><canvas id="c" width="960" height="540"></canvas><pre id="out">running</pre>
<script>
const req = new XMLHttpRequest();
req.open('GET', '../index.html', false); req.send();
const o = '<' + 'script>', cl = '<' + '/script>';
const game = req.responseText.split(o)[1].split(cl)[0].replace("'use strict';", '');
const bench = `
  const QZ = new URLSearchParams(location.search);
  const THRESH = +(QZ.get('t') || 8);          // a channel step below this is not a difference
  const MIN_DPX = +(QZ.get('dpx') || 120);     // pixels a difference must move
  const MIN_PEAK = +(QZ.get('peak') || 45);    // and how far its strongest channel must move
  // A PEAK IS ONE PIXEL, AND ONE PIXEL IS NOT A THING YOU CAN SEE. The art pass caught this
  // in the instrument rather than in the game: the ticker's bull and tie passed on 280 pixels
  // moved and a peak of 137, and were still called invisible on the screen -- because the
  // 14x5 plate that is most of the mark is drawn in #1a1210 on a ground of the same value,
  // and every bit of the contrast was in a 5x6 block in the corner of it. So the floor is
  // three numbers, not two: how much moved AT ALL, how far the best pixel moved, and how much
  // of it moved ENOUGH TO READ.
  const STRONG = +(QZ.get('s') || 40);        // a channel step that carries at a glance
  // MEASURED OFF A DELIVERED FRAME, not reasoned from the veil's transmission. 10 was the
  // reasoned number -- 0.93 alpha passes about 7%, so 10 of 255 looked like the floor of what
  // could survive -- and it let through a contract card that could then be photographed and
  // read. tools/frame-probe.html samples the actual PNG the shot pipeline produced and says
  // the marks outside the pool differ from the other painting by 4.6 to 7.6 of luminance:
  // real, visible, coherent, and entirely under the reasoned floor. Never compute a pixel
  // from the source when you can sample the frame.
  const LEAK = +(QZ.get('l') || 5);           // a channel step still readable THROUGH the veil
  // The unit is a CONNECTED BLOB, not a total, and the number is bracketed by two
  // photographs. shots/spot/dark-ticker.png measures 125 at its worst and nothing on it can
  // be picked out but the gap where a body is missing. shots/spot/dark-contract.png measures
  // 293 and the X, stamp, quill, seal, hourglass and shackle are all plainly there with the
  // lamp on the far side of the card. 140 sits above the readable-as-clean card and well
  // under the one that is not.
  //
  // This number has been raised once before, which is the move to be suspicious of, so the
  // order is recorded: the severe cases are fixed by art FIRST and the floor is set where the
  // frames put it afterwards, never the reverse.
  //
  // The removed-body marks will always sit high: a whole figure absent changes the
  // composition and no damping hides that. It is the one difference that should be findable
  // from a wide view, and it is one of ten.
  // 200, not 230. With the mask pass forced to full weight the densest fills compound to
  // about 217, so 230 would still cut through a mark that is entirely opaque in intent.
  const COVER = +(QZ.get('cv') || 200);      // a pixel the mark fully covers, 0..255
  // 140 WAS CALIBRATED AGAINST THE UNMASKED STATISTIC AND IS CURRENTLY A NO-OP: with the
  // coverage mask in, the worst mark in the room measures 111, so nothing can fail this and a
  // threshold nothing can fail is not a check. It is left at 140 for one round ON PURPOSE,
  // because the honest way to reset it is the way it was set the first time -- fix the art,
  // shoot the dark frames, find where the eye puts the boundary, and put the number there.
  // Halving it to match the halved statistic would be arithmetic standing in for evidence,
  // and the masked numbers do not track the eye closely enough to take that on trust: the
  // three highest after the last fix (arrowDown 111, safeCrack 96, roast 91) are marks the art
  // pass cannot see in any dark frame, while two it CAN see sit under 66.
  // SET BY FALSIFICATION, and the story of how nearly went wrong is worth more than the
  // number. Five statistics were tried against the art pass's list of what it can and cannot
  // see in the dark, and the coverage-masked one appeared to ANTI-correlate: the three marks
  // scoring highest were three it had gone and looked for and could not find. I reported that
  // as a property of the measurement and concluded no threshold existed.
  //
  // It was my own bug. The mask pass drew each mark through drawDiffMark, which sets
  // globalAlpha to the mark's WEIGHT, so the alpha channel held opacity x coverage rather than
  // coverage -- and every weighted mark, which is the whole contract card and nine others, had
  // no pixel above the threshold at all. The marks that survived were the ones on cards with
  // no weight. Of course they ranked highest: they were the only ones being measured. The
  // statistic had quietly stopped being about leaking, and it took a reviewer deriving the
  // compounded alpha of each mark by hand to see it. The mask pass forces full weight now.
  //
  // With that corrected, the bracket: a build with the contract's weights stripped -- the card
  // that WAS photographed and read -- scores 13.7, 13.0 and 11.6 on its three worst marks.
  // This build's worst is 7.9. 10 sits between them, so the check catches a card that has
  // become readable. It does not claim to resolve the faint residuals the art pass can still
  // find by computing a coordinate and looking at two pixels; its own caveat is that a player
  // has ninety seconds, a moving lamp and no coordinate list, and that none of the six cards
  // can be cleared unsteered. tools/spot-falsify.js runs exactly that pair.
  const MAX_SCORE = +(QZ.get('sc') || 10);   // masked blob per unit of local clutter
  // REPORTED, NOT ENFORCED, and the reason is that I could not calibrate it. The art pass was
  // right that the area test inherited the mirror of the fault it cured: after it, eight marks
  // still leaked in the dark and every one was stroke-built, because a 2x20 stroke is 40 px of
  // area and scores as nothing while a pale line in a dark field is the easiest thing an eye
  // finds. But at LEAK = 5 the unlit map is dominated by every mark's anti-aliased FRINGE,
  // which is also thin and also long -- so "thin long component" describes an outline exactly
  // as well as it describes a stroke, and sorting all sixty by it puts solid blobs (bull 27,
  // mansion 26, roast 25) among the leakers the pass named by eye (chandelier 29, shackle 26,
  // cage 25). Dividing area by length to get the component's WIDTH did not separate them
  // either, for the same reason. No threshold I tried failed the eight without also failing a
  // dozen that are fine, and a number chosen to make the answer come out is not a measurement.
  // So the column prints and a human reads it; the eight were found by eye and fixed at source
  // -- three stroke alphas the damping sweep had missed.
  const MAX_AXIS = +(QZ.get('la') || 26);    // longest thin component, painting px -- REPORTED
  const MIN_STRONG = +(QZ.get('sn') || 45);   // and how many pixels must carry it
  const MAX_OFF = +(QZ.get('off') || 16);      // how far the ink may sit from its hit point
  const MAX_AREA = +(QZ.get('area') || 0.20);  // how much of the painting may score
  const want = QZ.get('scene');
  const L = finaleLayout();
  const lum = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const out = { painting: [L.left.w, L.left.h], thresh: THRESH,
                floors: { dpx: MIN_DPX, peak: MIN_PEAK, off: MAX_OFF, area: MAX_AREA,
                          strong: STRONG, strongN: MIN_STRONG, leak: LEAK, score: MAX_SCORE,
                          axis: MAX_AXIS },
                hitRadius: CFG.finale.hitRadius, scenes: [], tolerance: [] };
  S.t = 0;

  // ------------------------------------------------------------------ what is on the canvas
  for (const scene of FINALE_SCENES) {
    if (want && scene.id !== want) continue;
    const diffs = makeFinaleDiffs(scene);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    drawFinaleScene(scene, L.left.x, L.left.y, L.left.w, L.left.h, false, diffs, new Set(), 0);
    drawFinaleScene(scene, L.right.x, L.right.y, L.right.w, L.right.h, true, diffs, new Set(), 0);
    const A = ctx.getImageData(L.left.x, L.left.y, L.left.w, L.left.h).data;
    const B = ctx.getImageData(L.right.x, L.right.y, L.right.w, L.right.h).data;
    const w = L.left.w, h = L.left.h;
    // The clutter term reads the LIT original, not the veiled one. The veil is a uniform
    // composite, so it scales the scene's structure by 0.07 and preserves it exactly -- in
    // real arithmetic. In eight-bit integers it does not: the whole veiled card lands in a
    // range of about nine to twenty-five, where a neighbourhood's standard deviation is mostly
    // rounding. Measured there the term did not separate anything; measured on the lit card it
    // is the same quantity with sixteen times the resolution.
    const VL = new Float32Array(w * h);
    for (let i = 0, q = 0; i < w * h; i++, q += 4) VL[i] = lum(A[q], A[q + 1], A[q + 2]);
    const D = new Uint8Array(w * h);
    // ALPHA IS A CHANNEL TOO, and leaving it out made the check blind to a whole class. A
    // destination-out composite leaves un-premultiplied RGB UNCHANGED and only drops alpha, so
    // the stamp's two "bites" -- which were taking 36% of the alpha out of the parchment, the
    // board and the chamber behind them, and rendering 68 of luminance darker than the paper
    // they were meant to reveal -- measured as exactly zero difference here. Only the delivered
    // PNG showed them, because that is where the page background gets composited in.
    for (let i = 0, p = 0; i < w * h; i++, p += 4) {
      D[i] = Math.max(Math.abs(A[p] - B[p]), Math.abs(A[p + 1] - B[p + 1]),
                      Math.abs(A[p + 2] - B[p + 2]), Math.abs(A[p + 3] - B[p + 3]));
    }
    // ---------------------------------------------------- and now through the LAMP VEIL
    // THE BARE CANVAS IS THE ONE STATE THE PLAYER NEVER SEES. Everything above measures the
    // painting with no veil over it, which answers "can this mark be seen" and not "can this
    // mark be seen ONLY when the lamp is on it" -- and the second is the room's entire
    // mechanic. The rule that fixed the invisible marks, a lit face on everything, overshot
    // into marks whose highlight beats a 93% veil: at luminance 200 a mark still comes
    // through at about 23 against a ground of 12, and the eye finds a bright spot in a dark
    // field faster than it finds anything inside the pool. You could clear a card without
    // ever steering.
    //
    // So both paintings are re-drawn and veiled with the lamp parked in the FAR CORNER from
    // the mark under test, and what survives is what a player sees for free.
    const D2 = new Uint8Array(w * h);
    {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      drawFinaleScene(scene, L.left.x, L.left.y, L.left.w, L.left.h, false, diffs, new Set(), 0);
      drawFinaleScene(scene, L.right.x, L.right.y, L.right.w, L.right.h, true, diffs, new Set(), 0);
      // A real search lamp: the radius a mid crew gets, parked bottom-left of each painting.
      const fullR = finaleSpotFullR(L), lampR = Math.max(44, fullR * 0.5);
      veilPaintingSpot(L.left, L.left.x + w * 0.08, L.left.y + h * 0.92, lampR, fullR);
      veilPaintingSpot(L.right, L.right.x + w * 0.08, L.right.y + h * 0.92, lampR, fullR);
      const A2 = ctx.getImageData(L.left.x, L.left.y, w, h).data;
      const B2 = ctx.getImageData(L.right.x, L.right.y, w, h).data;

      for (let i = 0, q = 0; i < w * h; i++, q += 4) {
        D2[i] = Math.max(Math.abs(A2[q] - B2[q]), Math.abs(A2[q + 1] - B2[q + 1]),
                         Math.abs(A2[q + 2] - B2[q + 2]), Math.abs(A2[q + 3] - B2[q + 3]));
      }
      // and blank the pool itself, since a mark the lamp IS on is supposed to be visible
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (Math.hypot(x - w * 0.08, y - h * 0.92) < lampR * 1.5) D2[y * w + x] = 0;
      }
    }
    // ---------------------------------------------- the marks' own coverage, alone
    // THE SEPARATOR I COULD NOT FIND GEOMETRICALLY, and it is not geometric. An anti-aliased
    // fringe exists ONLY where a mark's coverage is PARTIAL -- that is what anti-aliasing is --
    // while a genuine leak is the mark's own body, where coverage is FULL. So the unlit map is
    // masked to fully-covered pixels before anything is labelled, and every fringe in the room
    // disappears in one step with no shape term at all. A 2-unit stroke renders about 2.7
    // device pixels wide and keeps a fully-covered core, so nothing thin is lost; a blob's
    // fringe has no fully-covered pixels outside a body that is already below the floor.
    //
    // Drawn alone on a cleared rect so the alpha channel IS the coverage. Same transform
    // drawFinaleScene uses, or the mask would not line up with what it is masking.
    const COV = new Uint8Array(w * h);
    {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(L.right.x, L.right.y, w, h);
      ctx.save();
      ctx.beginPath(); ctx.rect(L.right.x, L.right.y, w, h); ctx.clip();
      ctx.translate(L.right.x, L.right.y);
      ctx.scale(w / FINALE_ART.w, h / FINALE_ART.h);
      // AT FULL WEIGHT, or this measures the wrong thing entirely. drawDiffMark sets
      // globalAlpha to the mark's own w, so the alpha channel of a mask pass drawn normally is
      // OPACITY x coverage, not coverage -- and a mark whose paint never reaches the threshold
      // has no "covered" pixel anywhere in it, whatever its geometry. At COVER 230 that erased
      // the entire contract card and nine other weighted marks, and cut THROUGH the plate
      // family, keeping only whichever layer happened to compound past 0.902.
      //
      // That is what produced the anti-correlation I reported and drew a conclusion from: the
      // three marks scoring highest were all on cards with no weight, so they survived the
      // mask intact, and the marks the art pass could actually see were on the contract, which
      // the mask deleted. The statistic was not failing to track the eye. It had quietly
      // stopped being a statistic about leaking at all.
      for (const d of diffs) drawDiffMark({ ...d, w: 1 }, 0, 0, true);
      ctx.restore();
      const C = ctx.getImageData(L.right.x, L.right.y, w, h).data;
      for (let i = 0, q = 3; i < w * h; i++, q += 4) COV[i] = C[q];
    }
    const sxS = w / FINALE_ART.w, syS = h / FINALE_ART.h;
    const pts = diffs.map(d => ({ d: d, x: d.x * sxS, y: d.y * syS }));
    // Every changed pixel is attributed to its NEAREST difference, never to a window round
    // one. A square window round a hit point reaches 68px into its corners, and the tenth
    // difference in every scene sits about 55px from the ninth -- so the first cut of this
    // reported the SAME blob against both, with identical counts, and called each of them
    // displaced by the distance to the other. Two differences cannot own one pixel.
    const own = pts.map(() => ({ n: 0, strong: 0, leak: 0, leakAxis: 0, peak: 0, sum: 0, wx: 0, wy: 0, wsum: 0 }));
    const OWN = new Int16Array(w * h).fill(-1);
    let stray = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const v = D[y * w + x];
      if (v <= THRESH) continue;
      let bi = -1, bd = 70;
      for (let i = 0; i < pts.length; i++) {
        const dd = Math.hypot(x - pts[i].x, y - pts[i].y);
        if (dd < bd) { bd = dd; bi = i; }
      }
      if (bi < 0) { stray++; continue; }
      OWN[y * w + x] = bi;
      const a = own[bi];
      a.n++; a.sum += v; if (v > a.peak) a.peak = v;
      if (v >= STRONG) a.strong++;
      a.wx += x * v; a.wy += y * v; a.wsum += v;
    }
    // ------------------------------------------- and the unlit leak, as an AREA not a count
    // A PIXEL COUNT IS THE WRONG STATISTIC FOR LEGIBILITY IN THE DARK. The eye integrates
    // over a region and locks onto a straight edge, so a solid 14x11 plate can have every one
    // of its pixels under a per-pixel floor and still be unmistakable, while the same number
    // of pixels scattered through a busy card is nothing. That is exactly how the first cut
    // of this passed a contract card that could then be photographed and read: the count was
    // under the floor and the SHAPE was a rectangle. So the leak is scored as the largest
    // CONNECTED component of above-floor pixels belonging to one mark.
    //
    // It also explains the calibration gap honestly. 167-267 readable on the contract against
    // 35-59 unreadable on the ticker is fourfold, and almost none of that was the marks: the
    // ticker's ground is dark, busy and cut up by chart lines and bodies, and the contract's
    // is one large flat bright field where any coherent shape silhouettes.
    {
      const seen2 = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        if (seen2[i] || D2[i] < LEAK || OWN[i] < 0 || COV[i] < COVER) continue;
        const stack = [i]; seen2[i] = 1;
        const tally = {}; let size = 0, x0 = 1e9, x1 = -1, y0 = 1e9, y1 = -1;
        while (stack.length) {
          const j = stack.pop(), jx = j % w, jy = (j / w) | 0;
          size++; tally[OWN[j]] = (tally[OWN[j]] || 0) + 1;
          if (jx < x0) x0 = jx; if (jx > x1) x1 = jx;
          if (jy < y0) y0 = jy; if (jy > y1) y1 = jy;
          for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            const nx = jx + dx, ny = jy + dy;
            if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
            const k = ny * w + nx;
            if (!seen2[k] && D2[k] >= LEAK && OWN[k] >= 0 && COV[k] >= COVER) { seen2[k] = 1; stack.push(k); }
          }
        }
        // the component belongs to whichever mark holds most of it
        let bestOwner = -1, bestShare = 0;
        for (const o in tally) if (tally[o] > bestShare) { bestShare = tally[o]; bestOwner = +o; }
        // AREA IS NOT THE ONLY WAY A THING IS SEEN, and the last fix to this inherited the
        // mirror of the fault it cured. Scoring the largest connected component stopped a
        // solid plate hiding behind a small per-pixel number -- and a 2-unit by 20-unit stroke
        // is about 40 pixels of area, which that same test scores as nothing, while a pale
        // line in a dark field is close to the easiest thing an eye finds. Eight marks leaked
        // in the dark after the area fix and every single one was stroke-built: not a
        // coincidence about those objects, a property of the criterion. So a component is
        // measured by its LONGEST SIDE as well, and either one can fail it.
        if (bestOwner >= 0) {
          const o = own[bestOwner];
          if (size > o.leak) o.leak = size;
          // THINNESS, not length. Length alone does not separate them: every mark is 20 to 29
          // px across whatever its shape, so a longest-side term flagged solid blobs and
          // strokes alike. What a stroke actually is, is a component whose AREA divided by its
          // length is small -- that ratio is its width in pixels. A 2-unit stroke comes out
          // near 3; a plate or a blob of the same length comes out at 10 or more. So the score
          // is the length of the thinnest long component, and a fat one scores nothing.
          const major = Math.max(x1 - x0 + 1, y1 - y0 + 1);
          const minor = size / Math.max(1, major);
          if (minor <= 5 && major > o.leakAxis) o.leakAxis = major;
        }
      }
    }
    const rows = [];
    for (let i = 0; i < pts.length; i++) {
      const px = pts[i].x, py = pts[i].y, a = own[i], d = pts[i].d;
      // A PATCH, never one pixel. Every tableau is laid over a hash noise field and a single
      // sample reads the noise rather than the ground.
      let bl = 0, al = 0, bn = 0;
      for (let y = Math.max(0, (py | 0) - 5); y < Math.min(h, py + 6); y++)
        for (let x = Math.max(0, (px | 0) - 12); x < Math.min(w, px + 13); x++) {
          const p = (y * w + x) * 4; bn++;
          bl += lum(A[p], A[p + 1], A[p + 2]); al += lum(B[p], B[p + 1], B[p + 2]);
        }
      // ---------------------------------------------------------------- LOCAL CLUTTER
      // THE STATISTIC ANTI-CORRELATED WITH THE EYE AT THE TOP OF ITS RANGE, which is worse
      // than mis-scaling and is why no multiplier could rescue it: the three highest-scoring
      // marks in the room were three the art pass went and looked for and could NOT find,
      // while four it could see scored below them. Any cut under the highest fails an
      // invisible mark; any cut above it passes a visible one. There was no number.
      //
      // What separates them is not the mark, it is the NEIGHBOURHOOD. Every one it could not
      // find sits on or against a scene feature of its own value -- a red arrow on the red
      // chart line, a pale crack beside the vault's gold rim, a brown dome on a brown table
      // between two dishes. Every one it could find sits on empty ground: the contract's
      // blank board, a plain run of belt, bare wall, plain brick. A given delta disappears
      // into a busy neighbourhood and shouts on a flat one, which is the per-mark form of the
      // ground-uniformity argument that produced the per-scene weights three passes ago.
      //
      // So the score is the masked component divided by the local variation of the unlit
      // ORIGINAL around it -- which needs no shape term, no second threshold, and nothing
      // that is not already rendered.
      let vs = 0, vss = 0, vn = 0;
      const R = Math.round(24 * sxS);
      for (let y = Math.max(0, (py | 0) - R); y < Math.min(h, py + R); y++)
        for (let x = Math.max(0, (px | 0) - R); x < Math.min(w, px + R); x++) {
          const v2 = VL[y * w + x]; vs += v2; vss += v2 * v2; vn++;
        }
      const sd = vn ? Math.sqrt(Math.max(0, vss / vn - (vs / vn) * (vs / vn))) : 0;
      const score = a.leak / (1 + sd);
      const off = a.n ? Math.hypot(a.wx / a.wsum - px, a.wy / a.wsum - py) : -1;
      rows.push({ kind: d.kind, at: [Math.round(px), Math.round(py)],
                  dpx: a.n, strong: a.strong, leak: a.leak, leakAxis: a.leakAxis,
                  sd: +sd.toFixed(2), score: +score.toFixed(1), peak: a.peak,
                  bg: +(bl / bn).toFixed(1), alt: +(al / bn).toFixed(1),
                  off: a.n ? +off.toFixed(1) : -1,
                  faint: a.n < MIN_DPX || a.peak < MIN_PEAK || a.strong < MIN_STRONG,
                  leaks: score > MAX_SCORE,
                  offset: !a.n || off > MAX_OFF });
    }
    // spacing, and how much of the picture a blind press would score
    let minGap = 1e9;
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++)
      minGap = Math.min(minGap, Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y));
    let inside = 0, cells = 0;
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
      cells++;
      for (const p of pts) if (Math.hypot(x - p.x, y - p.y) < CFG.finale.hitRadius) { inside++; break; }
    }
    out.scenes.push({ scene: scene.id, rows: rows, stray: stray,
                      minGap: +minGap.toFixed(1), area: +(inside / cells).toFixed(3) });
  }

  // ------------------------------------------------- what the room actually accepts as a hit
  // Measured by pressing, at two crew sizes. Reading the expression is what let the old one
  // through: it LOOKED like a tolerance and it was the whole picture.
  function chamber(crew) {
    reset();
    S.runners.slice(0, crew).forEach(r => { r.state = 'arrived'; });
    S.stats.arrived = crew; S.cam = S.camMax; updateView(1);
    startFinale();
    beginFinaleCharge(S.finale);
    for (let i = 0; i < 60 * 40 && S.finale.phase !== 'search'; i++) updateFinale(1 / 60);
    return S.finale;
  }
  for (const crew of [1, 12, 100]) {
    const f = chamber(crew);
    const d = f.diffs[0];
    let scored = -1;
    for (let px = 0; px <= 160; px++) {
      f.found.clear(); f.foundAt = {}; f.wrongT = 0; f.flashWrong = 0; f.winT = 0; S.mode = 'finale';
      const u = d.x / FINALE_ART.w + px / L.right.w, v = d.y / FINALE_ART.h;
      finaleConfirm(u, v);
      if (!f.found.size) { scored = px - 1; break; }
    }
    out.tolerance.push({ crew: crew, radius: scored, lamp: +finaleSpotRadius(f, L).toFixed(1) });
  }
  document.getElementById('out').textContent = JSON.stringify(out);
