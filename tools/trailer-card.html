<!doctype html>
<html><head><meta charset="utf-8"><title>card</title>
<style>html,body{margin:0;background:#07080c;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// A trailer title card, drawn to canvas as a function of time so the same t always gives the
// same frame. trailer.js drives it over CDP: navigate once, then renderCard(spec, t) and
// screenshot, frame by frame, which is deterministic where a CSS animation and a screencast
// are not -- no dropped frames, no timing drift, and a re-run is byte-identical.
//
// It borrows the GAME's visual language rather than inventing one: the same hash() the game
// seeds its procedural detail with, the same grain field laid over everything in `overlay`,
// the ember colour off the mill's furnaces, and the typewriter reveal with a block cursor
// that the proprietor's dialogue already uses. A card in a different idiom reads as a
// different product, which is the note the first pass got right by accident.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 1920, H = 1080;
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);

// the grain field, built once: a one-pixel getImageData of this is noise, which is the point
let grainCv = null;
function grain() {
  if (grainCv) return grainCv;
  grainCv = document.createElement('canvas');
  grainCv.width = 320; grainCv.height = 180;
  const g = grainCv.getContext('2d'), d = g.createImageData(320, 180);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 120 + Math.floor(hash(i * 0.37) * 135);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  return grainCv;
}

// ---------------------------------------------------------------- the look, per card kind
const LOOKS = {
  // calm, warm, ominous: embers off a furnace, drifting up
  title:  { bg: ['#12100e', '#08080b'], motes: 'ember', n: 70, vig: 0.72, accent: '#f0b44a' },
  // the heaviest: more soot, faster, and the word lands rather than types
  beat:   { bg: ['#17110d', '#08070a'], motes: 'ember', n: 110, vig: 0.80, accent: '#ff8a4a' },
  // ASH FALLING, not embers rising, and the colour goes out of it. The one morbid card.
  count:  { bg: ['#0c0c10', '#07070a'], motes: 'ash', n: 190, vig: 0.88, accent: '#ff6b6b' },
  // the title again, breathing
  end:    { bg: ['#101018', '#07080c'], motes: 'ember', n: 60, vig: 0.70, accent: '#f0b44a' },
  // THE TURN. Cool and quiet -- the palette steps off the furnace and onto the game's own UI
  // cyan, because this is the line where the trailer stops being about the mill and starts
  // being about the player. Fewer motes: the room goes still before the good news.
  turn:   { bg: ['#0b1016', '#07080c'], motes: 'ember', n: 34, vig: 0.78, accent: '#7fe3ff',
            bloom: '90,170,220', mote: '150,210,240' },
  // ...and the pay-off, which is the only card in the set that is allowed to be bright.
  hope:   { bg: ['#181309', '#08080b'], motes: 'ember', n: 95, vig: 0.62, accent: '#ffd479' },
};

function background(L, t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.bg[0]); g.addColorStop(1, L.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // a slow warm bloom low down, like something burning off screen
  if (L.motes === 'ember') {
    const r = ctx.createRadialGradient(W * 0.5, H * 1.02, 40, W * 0.5, H * 1.02, H * 0.9);
    const b = L.bloom || '255,140,50';
    r.addColorStop(0, `rgba(${b},${0.16 + 0.03 * Math.sin(t * 1.1)})`);
    r.addColorStop(1, `rgba(${b},0)`);
    ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
  }
}

function motes(L, t) {
  const up = L.motes === 'ember';
  for (let i = 0; i < L.n; i++) {
    const life = 5 + hash(i + 200) * 6;
    const tt = (t + hash(i + 300) * life) % life;
    const k = tt / life;
    const speed = (up ? 62 : 46) + hash(i + 100) * 70;
    const x = hash(i) * W + Math.sin(t * 0.5 + i * 1.7) * (14 + hash(i + 500) * 26);
    const y = up ? H + 30 - tt * speed : -30 + tt * speed;
    if (y < -40 || y > H + 40) continue;
    // in at the start, out at the end, and a flicker on top for the embers
    let a = Math.min(1, k / 0.14) * Math.min(1, (1 - k) / 0.3);
    if (up) a *= 0.55 + 0.45 * Math.sin(t * (5 + hash(i + 700) * 7) + i);
    const s = (up ? 1.1 : 0.9) + hash(i + 400) * (up ? 2.4 : 1.5);
    ctx.globalAlpha = a * (up ? 0.85 : 0.62);
    ctx.fillStyle = up
      ? (L.mote ? `rgb(${L.mote})`
               : `rgb(255,${Math.round(120 + hash(i + 600) * 90)},${Math.round(40 + hash(i + 800) * 40)})`)
      : `rgb(${Math.round(150 + hash(i + 600) * 60)},${Math.round(150 + hash(i + 600) * 60)},${Math.round(160 + hash(i + 600) * 55)})`;
    if (up) { ctx.beginPath(); ctx.arc(x, y, s, 0, 6.28); ctx.fill(); }
    // ash falls, so it STREAKS. Drawn as points it read as a starfield -- stars being roughly
    // the opposite of the feeling this card is carrying.
    else ctx.fillRect(x - s / 2, y, s, s * (3.2 + hash(i + 900) * 3.4));
  }
  ctx.globalAlpha = 1;
}

function vignette(strength) {
  const r = ctx.createRadialGradient(W / 2, H / 2, H * 0.22, W / 2, H / 2, H * 0.92);
  r.addColorStop(0, 'rgba(0,0,0,0)');
  r.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = r; ctx.fillRect(0, 0, W, H);
}

// Typed one character at a time, with the block cursor the game's own dialogue uses. `hold`
// is how long the cursor keeps blinking after the last character lands.
// Shrink until it fits. A card is written as a sentence, not as a measured width, and
// "BUT IF YOU KNOW HOW TO PLAY THEIR GAME..." at the title size is 2400px on a 1920 card --
// it would have run off both ends, which is the one failure a still of the card at t=0 does
// not show because at t=0 two characters have been typed.
function fitFont(text, px, maxW, weight, spacing) {
  for (;;) {
    ctx.font = `${weight} ${px}px ui-monospace, Menlo, monospace`;
    ctx.letterSpacing = `${spacing}px`;
    if (px <= 22 || ctx.measureText(text).width <= maxW) return px;
    px -= 2;
  }
}
function typed(text, cps, t, delay) {
  const el = Math.max(0, t - delay);
  const n = Math.min(text.length, Math.floor(el * cps));
  return { s: text.slice(0, n), done: n >= text.length, caret: el > 0 };
}

function drawCaret(x, y, h, t, on) {
  if (!on || Math.sin(t * 9) < -0.2) return;
  ctx.fillStyle = 'rgba(240,235,225,0.75)';
  ctx.fillRect(x + 3, y - h * 0.74, h * 0.48, h * 0.74);
}

// ---------------------------------------------------------------- the card
function renderCard(spec, t) {
  const L = LOOKS[spec.kind] || LOOKS.title;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  background(L, t);
  motes(L, t);

  // a very slow push in, so even a still card is moving
  ctx.save();
  const push = 1 + 0.018 * easeOut(clamp01(t / (spec.for || 3)));
  ctx.translate(W / 2, H / 2); ctx.scale(push, push); ctx.translate(-W / 2, -H / 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const cy = H / 2;

  if (spec.kind === 'beat') {
    // kicker types in, then the word LANDS: it arrives big and settles, with a shockwave of
    // soot. Typing "GRINDING" would undercut it -- the pause is the kicker, the word is a hit.
    const k = typed(spec.kicker || '', 17, t, 0.25);
    ctx.font = '600 38px ui-monospace, Menlo, monospace';
    ctx.fillStyle = '#9aa2b2';
    ctx.letterSpacing = '11px';
    ctx.fillText(k.s, W / 2, cy - 62);
    ctx.letterSpacing = '0px';
    const hitAt = 0.28 + (spec.kicker || '').length / 17 + 0.24;
    const h = clamp01((t - hitAt) / 0.42);
    if (h > 0) {
      const sc = 1.55 - 0.55 * easeOut(h);
      const a = Math.min(1, h * 3.4);
      ctx.save();
      ctx.translate(W / 2, cy + 60); ctx.scale(sc, sc);
      ctx.globalAlpha = a;
      ctx.font = '700 104px ui-monospace, Menlo, monospace';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillText(spec.text, 4, 6);
      ctx.fillStyle = '#f4efe6';
      ctx.fillText(spec.text, 0, 0);
      ctx.restore();
      // the rule under it wipes out from the centre on the same beat
      const wv = easeOut(clamp01((t - hitAt - 0.1) / 0.5)) * 300;
      ctx.globalAlpha = 0.75 * a;
      ctx.fillStyle = L.accent;
      ctx.fillRect(W / 2 - wv, cy + 96, wv * 2, 3);
      ctx.globalAlpha = 1;
    }
  } else if (spec.kind === 'count') {
    // two lines: the first plain, the second in the game's own death red, arriving late and
    // heavy so the sentence turns on it
    const a1 = clamp01((t - 0.2) / 0.5);
    ctx.globalAlpha = a1;
    ctx.font = '700 92px ui-monospace, Menlo, monospace';
    ctx.fillStyle = '#e8e4dc';
    ctx.letterSpacing = '6px';
    ctx.fillText(spec.text, W / 2, cy - 34);
    const a2 = clamp01((t - 0.95) / 0.45);
    ctx.globalAlpha = a2;
    const sc = 1.14 - 0.14 * easeOut(a2);
    ctx.save();
    ctx.translate(W / 2, cy + 86); ctx.scale(sc, sc);
    ctx.font = '700 110px ui-monospace, Menlo, monospace';
    ctx.shadowColor = 'rgba(255,60,60,0.55)'; ctx.shadowBlur = 38;
    ctx.fillStyle = L.accent;
    ctx.fillText(spec.sub || '', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();
    ctx.letterSpacing = '0px';
    ctx.globalAlpha = 1;
  } else if (spec.kind === 'end') {
    // the title, breathing, with the sub typed under it
    const a1 = clamp01(t / 0.7);
    const glow = 26 + 12 * Math.sin(t * 1.6);
    ctx.globalAlpha = a1;
    ctx.font = '700 120px ui-monospace, Menlo, monospace';
    ctx.letterSpacing = '12px';
    ctx.shadowColor = 'rgba(240,180,90,0.45)'; ctx.shadowBlur = glow;
    ctx.fillStyle = '#f6f2e9';
    ctx.fillText(spec.text, W / 2, cy - 14);
    ctx.shadowBlur = 0;
    ctx.letterSpacing = '0px';
    const subs = spec.sub == null ? [] : (Array.isArray(spec.sub) ? spec.sub : [spec.sub]);
    if (subs.length) {
      // typed as ONE string across the lines, so a two-line question reads as a sentence
      // being asked rather than as two captions arriving
      const whole = subs.join(' ');
      const s = typed(whole, spec.cps || 21, t, 0.9);
      let n = s.s.length;
      ctx.fillStyle = '#9aa2b2';
      subs.forEach((line, i) => {
        const take = Math.max(0, Math.min(line.length, n));
        n -= line.length + 1;
        if (take <= 0) return;
        const shown = line.slice(0, take);
        fitFont(line, 34, 1500, 600, 9);
        ctx.fillText(shown, W / 2, cy + 66 + i * 50);
        if (take < line.length) {
          const w2 = ctx.measureText(shown).width;
          drawCaret(W / 2 + w2 / 2, cy + 66 + i * 50, 34, t, true);
        }
      });
      ctx.letterSpacing = '0px';
    }
    ctx.globalAlpha = 1;
  } else {
    // `title`: the line types in, the sub follows, and the accent word is coloured
    const cps = spec.cps || 19;
    const s = typed(spec.text, cps, t, 0.3);
    // A long line loses its tracking before it loses its size: "BUT IF YOU KNOW HOW TO PLAY
    // THEIR GAME..." at 8px letter-spacing shrank to 43px, which is smaller than the sub on
    // the card before it and read as a caption rather than as the turn of the trailer.
    const px = fitFont(spec.text, 84, 1700, 700, spec.text.length > 26 ? 3 : 8);
    ctx.fillStyle = '#f2eee6';
    ctx.fillText(s.s, W / 2, cy - 14);
    const w = ctx.measureText(s.s).width;
    drawCaret(W / 2 + w / 2, cy - 14, px, t, s.caret && !s.done);
    ctx.letterSpacing = '0px';
    const subs = spec.sub == null ? [] : (Array.isArray(spec.sub) ? spec.sub : [spec.sub]);
    if (subs.length) {
      const a = clamp01((t - (0.35 + spec.text.length / cps)) / 0.6);
      ctx.globalAlpha = a;
      ctx.fillStyle = L.accent;
      subs.forEach((line, i) => {
        // 46, not 36: "GO TO WORK" is the second half of the opening line, not a caption on it
        fitFont(line, 46, 1500, 600, 12);
        ctx.fillText(line, W / 2, cy + 70 + i * 58);
      });
      ctx.letterSpacing = '0px';
      ctx.globalAlpha = 1;
    }
  }
  ctx.restore();

  // grain over everything, exactly as the game lays it, then the vignette closes the frame
  ctx.globalAlpha = 0.14; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(grain(), 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  vignette(L.vig);

  // the whole card fades in and out, so trailer.js does not have to
  const f = Math.min(clamp01(t / 0.3), clamp01(((spec.for || 3) - t) / 0.4));
  if (f < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - f})`; ctx.fillRect(0, 0, W, H); }
}
window.renderCard = renderCard;
// a hash like #{"kind":"beat",...}|1.4 renders one frame on load, for eyeballing in a browser
if (location.hash.length > 1) {
  const [j, t] = decodeURIComponent(location.hash.slice(1)).split('|');
  renderCard(JSON.parse(j), +t || 0);
}
</script></body></html>
