function makeSeq(n) {

function finaleLightLevel(f) {
  if (f.phase === 'search') return 1;
  if (f.phase === 'blackout') {
    const t = f.blackoutT;
    // Three readable beats: cut -> ghost pulse -> dying stutter -> black
    if (t < 0.28) return 0.05 + Math.sin(t * 40) * 0.04;
    if (t < 0.55) return 0.42 + Math.sin((t - 0.28) * 22) * 0.12;
    if (t < 0.95) return 0.12 + (Math.sin(t * 55) > 0.3 ? 0.18 : 0);
    return 0.03 + Math.sin(t * 30) * 0.02;
  }
  const progress = clamp01(f.chargeT / f.chargeNeed);
  const flicker = Math.sin(S.t * 14) * 0.045 + Math.sin(S.t * 29) * 0.025;
  return 0.07 + progress * 0.62 + flicker * (0.35 + progress);
}

function finaleConfirm() {
  const f = S.finale;
  if (f.phase !== 'search') return;
  const layout = finaleLayout();
  const targets = [];
  for (const side of [layout.left, layout.right]) {
    for (const d of f.diffs) {
      if (f.found.has(d.id)) continue;
      targets.push({ d, x: side.x + d.x, y: side.y + d.y });
    }
  }
  let hit = null, best = CFG.finale.hitRadius;
  for (const t of targets) {
    const dist = Math.hypot(f.cursor.x - t.x, f.cursor.y - t.y);
    if (dist < best) { best = dist; hit = t.d; }
  }
  if (hit) {
    f.found.add(hit.id); AU.tick(f.found.size / CFG.finale.findCount);
    S.floaters.push({ sx: f.cursor.x, sy: f.cursor.y - 18, txt: 'FOUND', life: 0.7, color: '#2ecc71' });

  ctx.restore();

  ctx.strokeStyle = '#120e10'; ctx.lineWidth = 8; ctx.strokeRect(x - 5, y - 5, w + 10, h + 10);
  ctx.strokeStyle = '#b8963e'; ctx.lineWidth = 1.8; ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
  ctx.strokeStyle = 'rgba(212,175,55,0.22)'; ctx.lineWidth = 1; ctx.strokeRect(x + 5, y + 5, w - 10, h - 10);
  // corner bosses
  for (const [cx, cy] of [[x - 2, y - 2], [x + w + 2, y - 2], [x - 2, y + h + 2], [x + w + 2, y + h + 2]]) {
    inkFill('#d4a84b', cx - 4, cy - 4, 8, 8, 2);

}
function updateFinale(dt) {
  const f = S.finale;
  const L = finaleLayout();
  f.flashWrong = Math.max(0, f.flashWrong - dt);
  f.genPulse = Math.max(0, f.genPulse - dt);

  // screen-space FX
  for (const p of f.fx) { p.life -= dt; p.vy += (p.k === 'drop' ? 520 : 40) * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  f.fx = f.fx.filter(p => p.life > 0);
  for (const r of f.ripples) { r.r += 38 * dt; r.life -= dt; }
  f.ripples = f.ripples.filter(r => r.life > 0);

  // falling bodies into the whirlpool
  for (const fall of f.falling) {
    fall.t += dt; fall.vy += 520 * dt; fall.x += fall.vx * dt; fall.y += fall.vy * dt; fall.rot += dt * 4;
    if (!fall.splashed && fall.y >= L.water.y + 8) {
      fall.splashed = true;
      finaleFx(f, 'drop', fall.x, L.water.y + 10, { n: 14, sx: 8, vx: [-140, 140], vy: [-280, -90], life: [0.4, 0.95], c: '#bfe6ff' });
      finaleFx(f, 'smoke', fall.x, L.water.y + 6, { n: 4, sx: 10, vx: [-30, 30], vy: [-40, -10], life: [0.5, 1], c: 'rgba(180,220,255,0.35)' });
      f.ripples.push({ x: fall.x, y: L.water.y + 14, r: 4, life: 0.95 });
      AU.thud();
    }
  }
  f.falling = f.falling.filter(fall => fall.t < 2.2);

  // deck runners: enter, then keep RUNNING along the belt (loop)
  const trackW = Math.max(40, L.deck.w - 40);
  for (let i = 0; i < f.deck.length; i++) {
    const d = f.deck[i];
    d.enter += dt;
    if (d.enter < 0) {
      d.x = L.deck.x - 50;
      d.arrived = false;
      d.track = (i / Math.max(1, f.deck.length)) * trackW;
      continue;
    }
    if (!d.arrived) {
      const u = clamp01(d.enter / 0.35);
      const ease = 1 - Math.pow(1 - u, 3);
      const slot = (i / Math.max(1, f.deck.length)) * trackW;
      d.x = (L.deck.x - 50) + ((L.deck.x + 20 + slot) - (L.deck.x - 50)) * ease;
      d.track = slot;
      d.arrived = u >= 1;
      d.speed = 110 + hash(i * 1.7) * 55;
    } else if (f.phase !== 'blackout') {
      d.speed = d.speed || 120;
      d.track = (d.track + d.speed * dt) % trackW;
      d.x = L.deck.x + 20 + d.track;
      // foot dust while sprinting
      if (Math.random() < 0.35) {
        finaleFx(f, 'smoke', d.x - 4, L.deck.y + L.deck.h - 2, {
          n: 1, sx: 3, vx: [-40, -10], vy: [-25, -5], life: [0.2, 0.45], c: 'rgba(180,160,140,0.45)', r: 1.5,
        });
      }
    }
  }

  // cursor
  let mx = 0, my = 0;
  if (HELD.ARROWLEFT || HELD.A) mx -= 1;
  if (HELD.ARROWRIGHT || HELD.D) mx += 1;
  if (HELD.ARROWUP || HELD.W) my -= 1;
  if (HELD.ARROWDOWN || HELD.S) my += 1;
  if (mx || my) {
    const len = Math.hypot(mx, my) || 1;
    f.cursor.x += (mx / len) * CFG.finale.cursorSpeed * dt;
    f.cursor.y += (my / len) * CFG.finale.cursorSpeed * dt;
    f.cursor.x = Math.max(L.px + 20, Math.min(L.px + L.pw - 20, f.cursor.x));
    f.cursor.y = Math.max(L.py + 50, Math.min(L.left.y + L.left.h + 8, f.cursor.y));
  }

  if (f.phase === 'blackout') {
    f.blackoutT += dt;
    f.light = finaleLightLevel(f);
    if (f.blackoutT >= FINALE_BLACKOUT) beginFinaleCharge(f);
  } else if (f.phase === 'charge') {
    f.chargeT += dt;
    f.light = finaleLightLevel(f);
    // generator sparks
    if (Math.random() < dt * 8) {
      finaleFx(f, 'spark', L.gen.x + 44, L.gen.y + 18, {
        n: 2, sx: 10, sy: 6, vx: [-80, 80], vy: [-160, -40], life: [0.2, 0.45], c: pick(['#ffe0a0', '#7fdbff', '#fff']),
      });
      f.genPulse = 0.2;
    }
    if (f.chargeT >= f.chargeNeed) {
      f.phase = 'search'; f.light = 1; f.genPulse = 0.5; AU.thud();
      finaleFx(f, 'spark', L.gen.x + 44, L.gen.y + 10, { n: 16, sx: 20, vx: [-120, 120], vy: [-200, -40], life: [0.3, 0.7], c: '#ffe0a0' });
    }
  } else if (f.phase === 'search') {
    f.light = 1;
    f.searchT -= dt;
    if (f.searchT <= 0) S.mode = 'lose';
  }
}

// ================================================================ view: camera anchor, zoom, world <-> screen

const V = { left: 0, zoom: 1, vw: W };
function updateView(dt) {
  V.vw = W / V.zoom;

  let top = 0;

    if (LANE_SPANS[k].some(([a, b]) => b > V.left - 100 && a < V.left + V.vw + 250)) top = k;
  }
  const minY = laneY(top) - CFG.tunnelH - 60;
  const target = Math.min(1, (H - 46) / (CFG.worldBottom - minY));
  V.zoom += (target - V.zoom) * Math.min(1, dt * 1.6);
}

// ================================================================ mini-game verbs

// ================================================================ sound (all synthesised in code, no audio files)
const AU = {
  ctx: null, master: null, muted: false, rumble: null, white: null,
  bedGain: null, bedFilter: null, stepBus: null, tail: null, grainT: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.5; this.master.connect(c.destination);
    this.white = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = this.white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // deep rumble inside the mountain
    const brown = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), bd = brown.getChannelData(0);
    let last = 0; for (let i = 0; i < bd.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
    const src = c.createBufferSource(); src.buffer = brown; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 90;
    this.rumble = c.createGain(); this.rumble.gain.value = 0;
    src.connect(lp); lp.connect(this.rumble); this.rumble.connect(this.master); src.start();
    // Footsteps are two layers. Most of a hundred people is too far away and too
    // overlapped to pick apart, so that is a bed of filtered noise; only the nearest
    // few land as separate scuffs, and those are scheduled at random intervals.
    const bedSrc = c.createBufferSource(); bedSrc.buffer = this.white; bedSrc.loop = true;
    const bedBp = c.createBiquadFilter(); bedBp.type = 'bandpass'; bedBp.frequency.value = 300; bedBp.Q.value = 0.5;
    this.bedFilter = c.createBiquadFilter(); this.bedFilter.type = 'lowpass'; this.bedFilter.frequency.value = 800;
    this.bedGain = c.createGain(); this.bedGain.gain.value = 0;
    bedSrc.connect(bedBp); bedBp.connect(this.bedFilter); this.bedFilter.connect(this.bedGain);
    this.bedGain.connect(this.master); bedSrc.start();
    // the scuffs run through a short stone tail so the tunnels sound like tunnels
    this.stepBus = c.createGain(); this.stepBus.gain.value = 1; this.stepBus.connect(this.master);
    const dly = c.createDelay(0.5); dly.delayTime.value = 0.085;
    const fb = c.createGain(); fb.gain.value = 0.3;
    const tailLp = c.createBiquadFilter(); tailLp.type = 'lowpass'; tailLp.frequency.value = 650;
    this.tail = c.createGain(); this.tail.gain.value = 0;
    this.stepBus.connect(dly); dly.connect(tailLp); tailLp.connect(fb); fb.connect(dly);
    tailLp.connect(this.tail); this.tail.connect(this.master);
  },
  tone(type, f0, f1, dur, gain = 0.2, delay = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, gain = 0.2, filt = null, delay = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + delay, src = c.createBufferSource(), g = c.createGain();
    src.buffer = this.white;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    let node = src;
    if (filt) { const f = c.createBiquadFilter(); f.type = filt[0]; f.frequency.value = filt[1]; f.Q.value = filt[2] || 1; src.connect(f); node = f; }

  },
  // one pair of feet: a short scuff, pitched and panned differently every time so
  // no two land alike and the ear never finds a pulse to lock onto
  step(gain, pan, near) {
    if (!this.ctx || this.muted) return;
    // land it somewhere inside the coming frame, so scuffs are not pinned to a 60 Hz grid
    const c = this.ctx, t = c.currentTime + Math.random() * 0.016;
    const src = c.createBufferSource(); src.buffer = this.white;
    src.playbackRate.value = 0.65 + Math.random() * 0.7;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 170 + Math.random() * 430 * near;   // distance takes the top off
    bp.Q.value = 0.8 + Math.random() * 0.9;
    const g = c.createGain();
    const dur = 0.02 + Math.random() * 0.032;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);

    let node = bp;
    if (c.createStereoPanner) { const pn = c.createStereoPanner(); pn.pan.value = pan; bp.connect(pn); node = pn; }
    node.connect(g); g.connect(this.stepBus);

  },
  arm() { this.tone('sawtooth', 660, 880, 0.12, 0.1); this.tone('sawtooth', 880, 660, 0.14, 0.08, 0.12); },
  tick(p) { const f = 480 + p * 420; this.tone('square', f, f, 0.06, 0.07); },
  wrong() { this.tone('sawtooth', 140, 90, 0.18, 0.14); },
  thud() { this.tone('sine', 70, 40, 0.35, 0.5); this.noise(0.15, 0.2, ['lowpass', 400]); },
  clank() { this.tone('square', 240, 180, 0.1, 0.12); this.noise(0.12, 0.2, ['highpass', 2000]); },
  splash() { this.noise(0.35, 0.22, ['bandpass', 1800, 0.8]); },
  scream() { this.tone('sawtooth', 900 + Math.random() * 300, 380, 0.3, 0.045); },
  boom() { this.tone('sine', 50, 28, 0.9, 0.7); this.noise(0.5, 0.35, ['lowpass', 250]); },
  millBeat() {
    if (!this.ctx || this.muted) return;
    this.tone('square', 92, 58, 0.09, 0.035);
    this.noise(0.06, 0.035, ['bandpass', 1500, 1.6]);
    this.tone('sine', 44, 30, 0.16, 0.06, 0.05);
  },
  cheer(n) { for (let i = 0; i < 3; i++) { const f = 440 * Math.pow(1.26, i) * (1 + Math.min(n, 8) * 0.06); this.tone('triangle', f, f * 1.5, 0.35, 0.08, i * 0.06); } },
  fail() { this.tone('sawtooth', 200, 60, 0.5, 0.22); },
  ambient(inside, moving, dt) {
    if (!this.ctx) return;
    if (this.muted) { this.rumble.gain.value = 0; this.bedGain.gain.value = 0; this.tail.gain.value = 0; return; }
    this.rumble.gain.value += ((inside ? 0.35 : 0.05) - this.rumble.gain.value) * Math.min(1, dt * 1.5);

    const crowd = Math.min(1, moving / 70);
    const near = clamp01(V.zoom);            // zoomed out is further away, so duller and quieter
    // three wobbles whose periods do not divide into each other, so the bed never
    // settles into a beat the way a single rectified sine did
    const w = 0.62 + 0.2 * Math.sin(S.t * 5.7) + 0.12 * Math.sin(S.t * 9.31 + 1.7) + 0.1 * Math.sin(S.t * 14.13 + 4.1);
    const bed = crowd * 0.19 * w * (inside ? 1 : 0.55) * (0.45 + 0.55 * near);
    this.bedGain.gain.value += (bed - this.bedGain.gain.value) * Math.min(1, dt * 12);
    this.bedFilter.frequency.value = 360 + 640 * near;
    this.tail.gain.value += ((inside ? 0.45 : 0.06) - this.tail.gain.value) * Math.min(1, dt * 2);

    // and the handful close enough to hear as individual feet
    const rate = 3 + 17 * crowd * (0.4 + 0.6 * near);
    this.grainT -= dt;
    let guard = 0;
    while (this.grainT <= 0 && guard++ < 6) {
      this.grainT += Math.max(0.012, (0.45 + Math.random() * 1.3) / rate);
      if (crowd <= 0) break;
      this.step((0.05 + Math.random() * 0.11) * (inside ? 1 : 0.6) * (0.4 + 0.6 * near),
                (Math.random() * 2 - 1) * 0.8, 0.35 + 0.65 * near);
      // every so often the weight of the pack rather than the scuff of it
      if (Math.random() < 0.2) this.tone('sine', 60 + Math.random() * 24, 40, 0.07, 0.1 * crowd * near);
    }
  },
};

const PCAP = 420;

      vx: rand(vx[0], vx[1]), vy: rand(vy[0], vy[1]),

    });

// an expanding ring: shockwaves at armed rooms, light bursts when one is solved, splash crowns
function ring(x, y, r1, life, c, w = 4, sq = 1) {
  S.rings.push({ x, y, r0: 4, r1, life, max: life, c, w, sq });
}
function solveBurst(room) {
  const cx = room.x + CFG.gapWidth / 2, y = laneY(room.lane);
  ring(cx, y - 24, 96, 0.38, '#ffd27a', 3, 0.42);
  emit('spark', 11, cx, y - 6, { sx: CFG.gapWidth / 2, vx: [-60, 60], vy: [-200, -70], life: [0.35, 0.8], c: '#ffe0a0' });
  emit('dust', 6, cx, y - 2, { sx: CFG.gapWidth / 2, vx: [-30, 30], vy: [-30, -6], life: [0.5, 0.9], c: 'rgba(160,140,112,0.45)' });

}
// idle life in the tunnels: embers off the lanterns, dust motes turning in the light
// the mill runs to a beat; the cave does not
let millBeatT = 0;
function ambient(dt) {
  const camX = S.cam + CFG.packFront;
  if (inMill(camX)) {
    millBeatT -= dt;
    if (millBeatT <= 0) { millBeatT = 0.82; AU.millBeat(); }
  }
  if (V.zoom < 0.3) return;
  S.ambT -= dt;
  if (S.ambT > 0) return;
  S.ambT = 0.06;
  const lit = [];
  for (let wx = Math.ceil((V.left - 100) / 240) * 240; wx < V.left + V.vw + 100; wx += 240) {
    for (let k = 0; k < CFG.laneCount; k++) {
      const lx = wx + k * 40;
      if (laneAt(k, lx) && Math.abs(lx - CFG.entrance) > 80 && Math.abs(lx - CFG.exit) > 80) lit.push([lx, laneY(k) - CFG.tunnelH + 2]);
    }
  }
  if (!lit.length) return;
  const [lx, ly] = pick(lit);
  if (inMill(lx)) {
    // the mill breathes steam and turns dust in the window light; nothing is on fire
    if (Math.random() < 0.45) emit('smoke', 1, lx + rand(-90, 90), ly + rand(26, 42), { sx: 3, vx: [-9, 15], vy: [-17, -5], life: [1.1, 2.2], c: 'rgba(198,206,208,0.15)', sz: 0.7 });
    if (Math.random() < 0.85) emit('mote', 1, lx + rand(-100, 100), ly + rand(20, 110), { vx: [-6, 9], vy: [-5, 5], life: [1.8, 3.6], c: 'rgba(214,232,248,0.45)' });
    if (Math.random() < 0.09) emit('spark', 1, lx + rand(-70, 70), ly + rand(74, 98), { vx: [-46, 46], vy: [-46, 12], life: [0.18, 0.42], c: '#ffdca6' });
    return;
  }
  emit('ember', 1, lx, ly + 13, { sx: 2, vx: [-7, 7], vy: [-28, -12], life: [0.7, 1.5], c: '#ffb457' });
  if (Math.random() < 0.7) emit('mote', 1, lx + rand(-80, 80), ly + rand(20, 100), { vx: [-5, 5], vy: [-4, 4], life: [1.6, 3.2], c: 'rgba(255,214,150,0.5)' });
}

// ================================================================ state
let S;
function reset() {
  S = {
    mode: 'title', t: 0, cam: 0, camMax: CFG.finale.x - 480, paused: false,
    runners: [], rooms: [], gates: [], active: null, wrongFlash: 0, shake: 0,
    particles: [], rings: [], floaters: [], ripples: [], bubbles: [], sayT: 0, lastWordT: 0, ambT: 0,
    stats: { dead: 0, arrived: 0 },
    finale: null, best: loadBest(), rollBottom: 254,
    endT: 0, endEmb: [], endSpawn: 0, endRoll: null,
    recent: [], spike: null, spikeCool: 0, streak: 0, bestStreak: 0, lastScream: 0,
  };
  for (let i = 0; i < CFG.runnerCount; i++) {
    S.runners.push({
      x: 0, slot: rand(CFG.packBack, CFG.packFront), jit: rand(0, 6.28), jitAmp: rand(8, CFG.jitter),
      dy: rand(-22, 22), y: laneY(0),
      skin: pick(SKIN), shirt: pick(SHIRT), pants: pick(PANTS), hair: pick(HAIR), style: pick(STYLES), height: 1,
      name: null,
      phase: Math.random() * 6.28,
      state: 'run', vy: 0, fy: 0, rot: 0, fallLimit: 70, hop: 0, rolled: null, fs: false, squash: 0, catchUp: 0,
      doom: null, endX: 0, deathT: 0,
      lane: 0, lastForkX: -1, route: [], ramp: null, held: false,
    });
  }
  for (const r of S.runners) r.x = r.slot;
  // deal every name to a different runner
  const deck = S.runners.slice();
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  CFG.names.forEach((nm, i) => {
    const r = deck[i]; if (!r) return;
    r.name = nm;
    const L = LOOKS[nm];
    if (L) { r.skin = L.skin; r.hair = L.hair; r.style = L.style; r.height = L.h; r.shirt = L.shirt; }
  });
  CFG.rooms.forEach((r, i) => {
    const t = CFG.types[r.type];
    S.rooms.push({ ...r, ord: i + 1, verb: t.verb, hazard: t.hazard, title: t.title, color: t.color,
                   hot: null, mg: null, state: 'dormant', bridge: 0, deaths: 0, flash: 0, slamT: rand(0, CFG.crusherPeriod) });
  });
  for (const x of CFG.gates) S.gates.push({ x, state: 'dormant', holdT: 0, drop: 0.09, dropV: 0, landed: false, judder: 0, flash: 0 });
  V.zoom = 1; V.left = 0; V.vw = W;
}
function armRoom(room) {
  const used = new Set(S.rooms.filter(r => r.state === 'armed').map(r => r.hot));
  let n = 1; while (used.has(n) && n < 9) n++;
  room.hot = n; room.mg = VERBS[room.verb].start(room.diff); room.state = 'armed';
  AU.arm();
  // the room wakes: a shockwave and dust shaken off the ceiling
  ring(room.x + CFG.gapWidth / 2, laneY(room.lane) - 34, 74, 0.4, room.color, 3, 0.5);
  emit('dust', 8, room.x + CFG.gapWidth / 2, laneY(room.lane) - CFG.tunnelH + 8, { sx: 60, vx: [-10, 10], vy: [12, 52], life: [0.6, 1.2], c: 'rgba(122,110,102,0.5)' });
}
// a room resolved with nobody lost: the streak grows
function cleanRoom(room) {
  S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 152, txt: S.streak > 1 ? `CLEAN x${S.streak}` : 'CLEAN', life: 1.4, color: '#2ecc71', big: S.streak > 1 });
  emit('spark', 7 + Math.min(9, S.streak), room.x + CFG.gapWidth / 2, laneY(room.lane) - 26, { sx: 34, vx: [-46, 46], vy: [-230, -120], life: [0.45, 0.95], c: '#8affbc' });
  AU.cheer(S.streak);
}
function say(r, pool, life = 2.2, pinned = false) {
  if (S.bubbles.some(b => b.r === r)) return;
  const used = new Set(S.bubbles.map(b => b.txt));
  const fresh = LINES[pool].filter(l => !used.has(l));
  S.bubbles.push({ r, wx: r.x, wy: footY(r) - (r.name ? 36 : 33), txt: pick(fresh.length ? fresh : LINES[pool]), life, max: life, pinned });
}
function killRunner(r, how) {
  r.state = 'dead'; r.endX = r.x; r.deathT = S.t; S.stats.dead++; S.shake = Math.min(5, S.shake + 1.2);
  S.recent.push(S.t); if (S.spike) S.spike.n++;
  S.lastKill = { x: r.x, y: laneY(r.lane) };      // so the death plate can point at where it happened
  if (S.streak > 0) { S.streak = 0; S.floaters.push({ sx: W / 2, sy: 200, txt: 'STREAK LOST', life: 1, color: '#ff9a3c' }); }
  if (how === 'splash') AU.splash(); else AU.noise(0.1, 0.18, ['lowpass', 300]);
  if (S.t - S.lastScream > 0.2 && Math.random() < 0.6) { S.lastScream = S.t; AU.scream(); }
  if (how !== 'splash' && how !== 'dark' && Math.random() < 0.4 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; say(r, 'crush', 1.3); }
  if (how === 'splash') splash(r.x, CFG.riverY);
  else if (how === 'dark') dust(r.x, r.y + 50, '#3a3040');
  else dust(r.x, r.y - 6, '#c0392b');
  S.floaters.push({ wx: r.x, wy: r.y - 10, txt: r.name ? `-${r.name}` : '-1', life: r.name ? 1.4 : 0.8, color: '#ff6b6b' });
}

// ================================================================ input
window.addEventListener('keyup', e => { HELD[e.key.toUpperCase()] = false; });
window.addEventListener('keydown', e => {
  HELD[e.key.toUpperCase()] = true;
  if (e.repeat) return;
  const k = e.key.toUpperCase();
  if (k === ' ' || k === 'ENTER' || k.startsWith('ARROW')) e.preventDefault();
  AU.init();
  if (k === 'M' && !S.active) { AU.muted = !AU.muted; return; }
  if (S.mode === 'title') { if (k === ' ') S.mode = 'play'; return; }
  if (S.mode === 'win' || S.mode === 'lose') { if (k === 'R') { reset(); S.mode = 'play'; } return; }
  if (S.paused) { if (k === 'P') S.paused = false; else if (k === 'R') { reset(); S.mode = 'play'; } return; }
  if (k === 'P' && !S.active) { S.paused = true; return; }
  if (S.mode === 'play') {
    if (k >= '1' && k <= '9') {
      const room = S.rooms.find(r => r.state === 'armed' && r.hot === +k);
      if (room) S.active = room;
      return;
    }
    if (k === 'ENTER') { toggleGate(); return; }
    if (k === 'ESCAPE') { S.active = null; return; }
    const room = S.active;
    if (!room) return;
    const res = VERBS[room.verb].key(room.mg, k);
    if (res === 'done') {
      room.state = 'solved'; S.active = null; AU.thud(); solveBurst(room);
      if (room.deaths === 0) cleanRoom(room);
      else S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 100, txt: 'CLEAR', life: 1, color: '#2ecc71' });
    } else if (res === 'wrong') { S.wrongFlash = 0.25; AU.wrong(); }
    else if (res === 'ok') AU.tick(VERBS[room.verb].progress(room.mg));
  }
  if (S.mode === 'finale') {
    if (k === ' ') finaleConfirm();
  }
});
function toggleGate() {
  const holding = S.gates.find(g => g.state === 'holding');
  if (holding) { holding.state = 'spent'; releaseGate(holding, 1 + CFG.tire * (S.cam / S.camMax)); AU.clank(); return; }
  const armed = S.gates.filter(g => g.state === 'armed').sort((a, b) => a.x - b.x)[0];
  if (armed) { armed.state = 'holding'; armed.holdT = 0; armed.landed = false; armed.dropV = -1; AU.clank(); }
}
// when a gate opens, the people it held keep their new place in the pack instead of sprinting back to their old slot
// iron meeting stone: grit, sparks, a ring and a kick, in every tunnel this gate crosses
function gateSlam(g) {
  g.judder = 1; g.flash = 1;
  S.shake = Math.max(S.shake, 5);
  AU.thud(); AU.clank();
  for (let k = 0; k < CFG.laneCount; k++) {
    if (!laneAt(k, g.x)) continue;
    const y = laneY(k);
    ring(g.x, y, 72, 0.4, 'rgba(210,225,255,0.85)', 3, 0.34);
    emit('grit', 9, g.x, y - 4, { sx: 15, vx: [-130, 130], vy: [-95, -20], life: [0.3, 0.6], c: '#9a8d80' });
    emit('dust', 5, g.x, y - 2, { sx: 20, vx: [-75, 75], vy: [-42, -8], life: [0.5, 0.95], c: 'rgba(150,140,130,0.5)' });
    emit('spark', 9, g.x, y - 3, { sx: 13, vx: [-160, 160], vy: [-130, -30], life: [0.25, 0.5], c: '#ffe0a0' });
  }
}
function releaseGate(g, spread) {
  for (const r of S.runners) {
    if (r.state !== 'run' || !r.held) continue;
    const wander = Math.sin(S.t * 0.7 + r.jit) * r.jitAmp;
    // a runner the camera has left behind would otherwise be handed a slot behind the pack and stay there
    // for good, drifting off the left edge; the back of the pack is as far back as anyone is ever placed
    r.slot = Math.max(CFG.packBack, CFG.packFront - (S.cam + CFG.packFront + wander - r.x) / spread);
    r.held = false;
    r.catchUp = 1;                       // a burst of pace, spent as they rejoin the pack
  }
}
function finaleFail() {
  // legacy name kept for any remaining references - LastRoom uses finaleWrong()
  finaleWrong();
}

// ================================================================ update
function update(dt) {
  if (S.paused) return;
  S.t += dt;
  S.wrongFlash = Math.max(0, S.wrongFlash - dt);
  S.shake = Math.max(0, S.shake - dt * 14);
  updateFx(dt);
  for (const r of S.runners) { r.phase += dt * 14; r.hop = Math.max(0, r.hop - dt); r.squash = Math.max(0, r.squash - dt * 7); }
  if (S.mode === 'finale') {
    updateFinale(dt);
    updateView(dt);
    return;
  }
  if (S.mode === 'win' || S.mode === 'lose') { S.endT += dt; endEmbers(dt); }
  if (S.mode !== 'play') { updateView(dt); return; }

  let rear = Infinity;
  for (const r of S.runners) if (r.state === 'run') rear = Math.min(rear, r.x);
  const want = Math.min(S.camMax, S.cam + CFG.scroll * dt);
  if (rear < Infinity) {
    const limit = rear - CFG.keepOnScreen / V.zoom - CFG.packFront + 0.56 * V.vw;
    S.cam = Math.max(S.cam, Math.min(want, limit));
  } else S.cam = want;
  updateView(dt);
  const camStopped = S.cam >= S.camMax;
  S.recent = S.recent.filter(t => S.t - t < 1);
  if (!S.spike && S.spikeCool <= 0 && S.recent.length >= 5) {
    S.spike = { t: 0.7, n: S.recent.length, at: S.lastKill }; S.recent.length = 0; S.spikeCool = CFG.spikeCooldown; S.shake = 8; AU.boom();
  }
  const inside = S.cam + CFG.packFront > CFG.entrance && S.cam + CFG.packFront < CFG.exit;
  AU.ambient(inside, S.runners.filter(r => r.state === 'run' && !r.held).length, dt);
  const spread = 1 + CFG.tire * (S.cam / S.camMax);
  if (S.active) VERBS[S.active.verb].update(S.active.mg, dt);
  const holdGate = S.gates.find(g => g.state === 'holding' && g.drop > 0.5);

  for (const r of S.runners) {
    if (r.state === 'run') {
      if (camStopped) r.x += CFG.scroll * dt;
      else {
        const target = S.cam + CFG.packFront - (CFG.packFront - r.slot) * spread + Math.sin(S.t * 0.7 + r.jit) * r.jitAmp;
        // anyone left behind closes the gap under their own steam, faster the further back they are
        const behind = Math.max(0, target - r.x);
        r.catchUp = Math.max(r.catchUp - dt * 0.5, behind > 90 ? 1 : 0);
        const cap = 80 + r.catchUp * 110;
        const rel = Math.max(-80, Math.min(cap, (target - r.x) * 2));
        r.x += (CFG.scroll + rel) * dt;
      }
      if (holdGate && holdGate.drop > 0.5 && r.x >= holdGate.x - 34 && r.x < holdGate.x + 6) { r.x = Math.min(r.x, holdGate.x - 8 - Math.abs(r.dy) * 1.2); r.held = true; }
      else r.held = false;
      // footfall: a puff of dust off the back foot and a beat of squash
      const step = Math.sin(r.phase) > 0;
      if (step !== r.fs) {
        r.fs = step; r.squash = 1;
        if (!r.held && V.zoom > 0.34 && inView(r.x, 40) && Math.random() < 0.6)
          emit('dust', 1, r.x - 3, footY(r) + 2, { vx: [-30, -6], vy: [-20, -5], life: [0.3, 0.6], c: 'rgba(196,180,160,0.6)', sz: 1.1 });
      }
      if (r.x >= CFG.finale.x - 40) { r.state = 'arrived'; r.endX = CFG.finale.x; S.stats.arrived++; continue; }
      updateLane(r);
      for (const room of S.rooms) {
        if (room.lane !== r.lane || room.state === 'solved') continue;
        if (r.x < room.x + 8 || r.x >= room.x + CFG.gapWidth) continue;
        if (room.hazard === 'burst') continue;
        if (room.hazard === 'half') { if (r.rolled === room) continue; r.rolled = room; if (Math.random() < 0.5) continue; }
        r.state = 'fall'; r.doom = room; r.vy = 0; r.fy = 0; r.fallLimit = r.lane === 0 ? CFG.riverY - r.y : 60; room.deaths++;
        r.rotRate = rand(1.5, 3.5) * (Math.random() < 0.5 ? -1 : 1); r.vx0 = CFG.scroll * 0.3; r.rv0 = r.rotRate;
        if (Math.random() < 0.35 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; S.bubbles = S.bubbles.filter(b => b.r !== r); say(r, 'fall', 1.4, true); }
        break;
      }
    } else if (r.state === 'fall') {
      r.vy += 900 * dt; r.fy += r.vy * dt; r.rot += (r.rotRate || 6) * dt; r.x += CFG.scroll * 0.3 * dt;
      if (r.fy > r.fallLimit) killRunner(r, r.lane === 0 ? 'splash' : 'dark');
    }
  }

  for (const room of S.rooms) {
    if (room.state === 'dormant') {
      const near = S.runners.some(r => r.state === 'run' && r.lane === room.lane && r.x >= room.x - CFG.armDist);
      if (near) armRoom(room);
    }
    // nobody left who can reach it: close it, whether it was fixed or not
    if (room.state === 'armed' && !S.runners.some(r => (r.state === 'run' || r.state === 'fall') && canReach(r, room))) {
      room.state = 'passed';
      if (S.active === room) S.active = null;
      if (room.deaths) S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 100, txt: 'TOO LATE', life: 1.2, color: '#ff8a8a' });
      else cleanRoom(room);
    }
    if (room.state === 'solved') room.bridge = Math.min(1, room.bridge + dt * 3.5);
    room.flash = Math.max(0, room.flash - dt * 1.8);
    if (room.hazard === 'burst' && room.state !== 'solved') {
      const before = room.slamT; room.slamT += dt;
      if (before < 0.78 && room.slamT >= 0.78 && inView(room.x, 120)) {
        emit('grit', 7, room.x + 60, laneY(room.lane) - CFG.tunnelH + 16, { sx: 26, vx: [-12, 12], vy: [20, 70], life: [0.4, 0.7], c: '#9a8d80' });
        emit('chip', 3, room.x + 60, laneY(room.lane) - CFG.tunnelH + 16, { sx: 22, vx: [-24, 24], vy: [10, 40], life: [0.5, 0.9], c: '#6f6459' });
      }
      if (before < 1.0 && room.slamT >= 1.0) {
        if (inView(room.x, 0)) AU.thud();
        for (const r of S.runners) {
          if (r.state === 'run' && r.lane === room.lane && r.x >= room.x + 35 && r.x < room.x + 85) { r.doom = room; killRunner(r, 'crush'); room.deaths++; }
        }
      }
      if (room.slamT >= CFG.crusherPeriod) room.slamT -= CFG.crusherPeriod;
    }
  }

  for (const g of S.gates) {
    if (g.state === 'dormant' && S.runners.some(r => r.state === 'run' && r.x >= g.x - CFG.gateArm)) g.state = 'armed';
    if (g.state === 'armed' && S.runners.every(r => r.state !== 'run' || r.x > g.x + 20)) g.state = 'spent';
    if (g.state === 'holding') {
      g.holdT += dt;
      if (g.holdT >= CFG.holdMax) g.state = 'spent';
      if (g.state === 'spent') releaseGate(g, spread);
    }
    if (g.state === 'holding') {
      if (g.drop < 1) {
        g.dropV += 18 * dt;
        g.drop = Math.max(-0.05, g.drop + g.dropV * dt);
        if (g.drop >= 1) { g.drop = 1; g.dropV = 0; if (!g.landed) { g.landed = true; gateSlam(g); } }
      }
    } else {
      g.landed = false; g.dropV = 0;
      g.drop = Math.max(0.09, g.drop - dt * 1.6);          // winched back up into the ceiling
    }
    g.judder = Math.max(0, g.judder - dt * 4.2);
    g.flash = Math.max(0, g.flash - dt * 3.4);
  }

  chatter(dt);
  ambient(dt);
  const settled = S.runners.every(r => r.state !== 'run' && r.state !== 'fall');
  if (settled) {
    if (S.stats.arrived === 0) { S.mode = 'lose'; return; }
    startFinale();
  }
}
// forks: branch up into a new tunnel; merges: come back down. Nested branches unwind in order.
function updateLane(r) {
  for (const f of CFG.forks) {
    if (f.x <= r.lastForkX || r.x < f.x) continue;
    r.lastForkX = f.x;
    if (f.from !== r.lane) continue;
    if (Math.random() < f.split) {
      r.route.push({ mergeX: f.merge, back: f.from });
      r.lane = f.to; r.hop = 0.5;
      r.ramp = { x0: f.x, x1: f.x + CFG.rampLen, y0: laneY(f.from), y1: laneY(f.to) };
      dust(r.x, r.y);
    }
  }
  const top = r.route[r.route.length - 1];
  if (top && r.x >= top.mergeX) {
    r.route.pop();
    r.ramp = { x0: top.mergeX, x1: top.mergeX + CFG.rampLen, y0: laneY(r.lane), y1: laneY(top.back) };
    r.lane = top.back;
  }
  if (r.ramp) {
    const t = clamp01((r.x - r.ramp.x0) / (r.ramp.x1 - r.ramp.x0));
    r.y = r.ramp.y0 + (r.ramp.y1 - r.ramp.y0) * t;
    if (t >= 1) r.ramp = null;
  }
}
function chatter(dt) {
  S.sayT -= dt;
  if (S.spike) return;
  if (S.sayT > 0 || S.bubbles.length >= (V.zoom < 0.6 ? 1 : 3)) return;
  S.sayT = rand(0.8, 1.6);
  const vis = S.runners.filter(r => r.state === 'run' && inView(r.x, -40) && !S.bubbles.some(b => b.r === r));
  if (!vis.length) return;
  const named = vis.filter(r => r.name);
  const r = named.length && Math.random() < 0.35 ? pick(named) : pick(vis);
  if (r.held) say(r, 'held');
  else if (S.rooms.some(m => m.lane === r.lane && m.state === 'solved' && r.x >= m.x && r.x < m.x + CFG.gapWidth)) say(r, 'safe');
  else say(r, 'ambient');
}
function updateFx(dt) {
  for (const p of S.particles) {
    const d = PK[p.k] || PK.dust;
    p.vy += d.g * dt;
    const f = Math.max(0, 1 - d.drag * dt);
    p.vx *= f; p.vy *= f;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.rv * dt; p.life -= dt;
  }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const r of S.rings) r.life -= dt;
  S.rings = S.rings.filter(r => r.life > 0);
  for (const f of S.floaters) { if (f.wy !== undefined) f.wy -= 30 * dt; else f.sy -= 30 * dt; f.life -= dt; }
  S.floaters = S.floaters.filter(f => f.life > 0);
  for (const r of S.ripples) { r.r += 40 * dt; r.life -= dt; }
  S.ripples = S.ripples.filter(r => r.life > 0);
  for (const b of S.bubbles) {
    b.life -= dt;
    const r = b.r;
    if (!b.pinned && r.state === 'run') { b.wx = r.x; b.wy = footY(r) - (r.name ? 36 : 33); }
  }
  S.bubbles = S.bubbles.filter(b => b.life > 0);
}
function splash(wx, y) {
  // the more bodies hitting the water together, the bigger the column of spray
  const n = 1 + S.recent.filter(t => S.t - t < 0.35).length;
  const big = Math.min(10, n);
  emit('drop', 10 + big * 3, wx, y, { sx: 3 + big, vx: [-130 - big * 12, 130 + big * 12], vy: [-330 - big * 22, -120], life: [0.45, 1], c: '#bfe6ff' });

// --- roof furniture, standing in the sky above the roofline all through act one
function millPlume(bx, by, sc, tint) {
  for (let i = 0; i < 15; i++) {
    const t = ((S.t * 0.055 + i / 15 + hash(bx + i) * 0.03) % 1);
    const rr = (7 + t * 54) * sc;
    if (!(rr > 0)) continue;
    const px = bx + t * 210 * sc + Math.sin(t * 4.4 + i) * 13 * sc;
    const py = by - t * 230 * sc - Math.sin(t * 2.2) * 8;
    ctx.fillStyle = `rgba(${tint},${0.3 * (1 - t) * (1 - t * 0.3)})`;
    ctx.beginPath(); ctx.arc(px, py, rr, 0, 6.28); ctx.fill();
  }
}

// --- tall steel-framed windows in the far wall of each hall
function millWindow(sx, cy, th, lift, salt, face) {
  const w = 58, h = th - 46, ty = cy + 22;
  ctx.fillStyle = '#16131b'; ctx.fillRect(sx - w / 2 - 6, ty - 6, w + 12, h + 12);
  ctx.fillStyle = '#3a3138'; ctx.fillRect(sx - w / 2 - 6, ty - 10, w + 12, 5);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(sx - w / 2 - 6, ty - 10, w + 12, 1.4);
  // A window in the FAR wall of a hall shows sky. A window in the outside FACE
  // shows the inside of the building, which is dark with the odd lamp in it.
  const k = 0.42 + lift * 0.28;
  const sky = (r, gn, b) => `rgb(${r * k | 0},${gn * k | 0},${b * k | 0})`;
  const g = ctx.createLinearGradient(0, ty, 0, ty + h);
  if (face) {
    g.addColorStop(0, '#1b1a24'); g.addColorStop(0.5, '#23212c'); g.addColorStop(1, '#191821');
  } else {
    g.addColorStop(0, sky(190, 218, 246)); g.addColorStop(0.45, sky(150, 186, 220)); g.addColorStop(1, sky(96, 130, 164));
  }
  ctx.fillStyle = '#1a2028'; ctx.fillRect(sx - w / 2, ty, w, h);
  ctx.fillStyle = g; ctx.fillRect(sx - w / 2, ty, w, h);
  // a lamp burning somewhere back in the room
  if (face && hash(salt * 0.29) > 0.45) {
    const lg2 = ctx.createRadialGradient(sx + (hash(salt) - 0.5) * w * 0.4, ty + h * (0.3 + hash(salt * 3) * 0.4), 2,

    lg2.addColorStop(0, 'rgba(255,206,140,0.5)'); lg2.addColorStop(1, 'rgba(255,196,120,0)');
    ctx.fillStyle = lg2; ctx.fillRect(sx - w / 2, ty, w, h);

  if (!face) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const bloom = ctx.createRadialGradient(sx, ty + h * 0.45, 2, sx, ty + h * 0.45, w * 0.78);
    bloom.addColorStop(0, `rgba(176,206,234,${0.13 * lift})`); bloom.addColorStop(1, 'rgba(176,206,234,0)');
    ctx.fillStyle = bloom; ctx.fillRect(sx - w * 0.8, ty - w * 0.4, w * 1.6, h + w * 0.8);
    ctx.restore();
  }
  // grime creeping in from the edges, thicker downstairs
  const gr = ctx.createRadialGradient(sx, ty + h * 0.4, 6, sx, ty + h * 0.4, w);
  gr.addColorStop(0, 'rgba(40,44,40,0)'); gr.addColorStop(1, `rgba(36,40,34,${0.3 - lift * 0.12})`);
  ctx.fillStyle = gr; ctx.fillRect(sx - w / 2, ty, w, h);
  // a few panes dead, boarded or cracked - fixed per window
  if (!face) for (let i = 0; i < 4; i++) for (let j = 0; j < 6; j++) {
    const hv = hash(salt * 0.7 + i * 13.3 + j * 5.1);

    if (hv > 0.93) { ctx.fillStyle = '#463b30'; ctx.fillRect(px + 1, py + 1, w / 4 - 2, h / 6 - 2); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(px + 1, py + h / 12, w / 4 - 2, 1.6); }
    else if (hv > 0.87) { ctx.fillStyle = 'rgba(26,30,38,0.5)'; ctx.fillRect(px + 1, py + 1, w / 4 - 2, h / 6 - 2); }
    else if (hv < 0.07) { ctx.fillStyle = `rgba(250,253,255,${0.42 * lift + 0.2})`; ctx.fillRect(px + 1, py + 1, w / 4 - 2, h / 6 - 2); }
  }
  // the leading
  ctx.fillStyle = '#4e4f5b';
  for (let i = 1; i < 4; i++) ctx.fillRect(sx - w / 2 + i * w / 4 - 1, ty, 2, h);
  for (let j = 1; j < 6; j++) ctx.fillRect(sx - w / 2, ty + j * h / 6 - 1, w, 2);
  ctx.fillStyle = '#5e6070'; ctx.fillRect(sx - w / 2, ty + h / 2 - 2.5, w, 5);
  ctx.strokeStyle = '#575866'; ctx.lineWidth = 3; ctx.strokeRect(sx - w / 2, ty, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1; ctx.strokeRect(sx - w / 2 - 1.6, ty - 1.6, w + 3.2, h + 3.2);

  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(sx - w / 2 - 7, ty + h, w + 14, 1.4);

    ctx.moveTo(sx, cy + 5); ctx.lineTo(sx + 26, cy + d - 4); ctx.lineTo(sx + 52, cy + 5);
  }
  ctx.stroke();
  for (let wx = Math.floor(wx0 / 52) * 52; wx < wx1 + 52; wx += 52) {
    const sx = wx - V.left;
    ctx.fillStyle = '#4a4c59';
    ctx.beginPath(); ctx.moveTo(sx - 6, cy + 5); ctx.lineTo(sx + 6, cy + 5); ctx.lineTo(sx, cy + 13); ctx.closePath(); ctx.fill();
    // gusset plate riveted over the panel point
    ctx.fillStyle = '#3e404d';
    ctx.beginPath(); ctx.moveTo(sx - 9, cy + 4); ctx.lineTo(sx + 9, cy + 4); ctx.lineTo(sx + 6, cy + 12); ctx.lineTo(sx - 6, cy + 12); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    for (const [rx, ry] of [[-4.4, 6.6], [0, 6.6], [4.4, 6.6], [-2.2, 10], [2.2, 10]]) { ctx.beginPath(); ctx.arc(sx + rx, cy + ry, 1, 0, 6.28); ctx.fill(); }
    ctx.fillStyle = '#444653';
    ctx.beginPath(); ctx.moveTo(sx - 7, cy + d - 6); ctx.lineTo(sx + 7, cy + d - 6); ctx.lineTo(sx + 4, cy + d - 1); ctx.lineTo(sx - 4, cy + d - 1); ctx.closePath(); ctx.fill();
  }
  rivets(x0, x1, cy + 2.4, 11, 1.1, 'rgba(255,255,255,0.22)');
  rivets(x0, x1, cy + d - 1.6, 11, 1, 'rgba(255,255,255,0.14)');
}

// --- the deck: steel plate on a plate girder, worn through to bare metal on the walking line
function millDeck(wx0, wx1, y) {
  const x0 = wx0 - V.left, x1 = wx1 - V.left;
  // the girder carrying it, with lightening holes
  ctx.fillStyle = '#1d1b24'; ctx.fillRect(x0, y + 12, x1 - x0, 32);
  ctx.fillStyle = '#2f2d39'; ctx.fillRect(x0, y + 15, x1 - x0, 24);
  ctx.fillStyle = '#211f29';
  for (let wx = Math.floor(wx0 / 44) * 44; wx < wx1; wx += 44) {
    const sx = wx - V.left + 22;
    if (sx < x0 - 8 || sx > x1 + 8) continue;
    ctx.beginPath(); ctx.arc(sx, y + 27, 6.6, 0, 6.28); ctx.fill();
  }
  ctx.fillStyle = '#3d3b49'; ctx.fillRect(x0, y + 13, x1 - x0, 3.4); ctx.fillRect(x0, y + 37, x1 - x0, 3.4);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y + 12, x1 - x0, 32); ctx.clip();
  rivets(Math.floor(wx0 / 10) * 10 - V.left, x1 + 10, y + 15, 10, 1, 'rgba(255,255,255,0.13)');
  rivets(Math.floor(wx0 / 10) * 10 - V.left, x1 + 10, y + 38.6, 10, 1, 'rgba(255,255,255,0.1)');
  ctx.restore();
  // the plate itself
  ctx.fillStyle = '#3e424c'; ctx.fillRect(x0, y, x1 - x0, 13);
  const dg = ctx.createLinearGradient(0, y, 0, y + 13);
  dg.addColorStop(0, 'rgba(146,160,178,0.3)'); dg.addColorStop(1, 'rgba(0,0,0,0.35)');
  ctx.fillStyle = dg; ctx.fillRect(x0, y, x1 - x0, 13);
  ctx.save(); ctx.beginPath(); ctx.rect(x0, y - 2, x1 - x0, 15); ctx.clip();
  // tread pattern
  ctx.strokeStyle = 'rgba(190,206,224,0.13)'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let wx = Math.floor(wx0 / 9) * 9; wx < wx1 + 9; wx += 9) {
    const sx = wx - V.left, up = Math.floor(wx / 9) % 2 === 0;
    ctx.moveTo(sx, y + (up ? 9 : 3)); ctx.lineTo(sx + 5, y + (up ? 3 : 9));
  }
  ctx.stroke();
  // panel joints, scuffed paint and grime - the deck is not one ruled sheet
  for (let wx = Math.floor(wx0 / 118) * 118; wx < wx1 + 118; wx += 118) {
    const sx = wx - V.left;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx, y, 2, 13);
    ctx.fillStyle = 'rgba(210,226,244,0.16)'; ctx.fillRect(sx + 2, y, 1.4, 13);
  }
  ctx.fillStyle = 'rgba(14,16,20,0.3)';
  for (let wx = Math.floor(wx0 / 17) * 17; wx < wx1 + 17; wx += 17) {
    const hv = hash(wx * 1.3 + y);
    if (hv < 0.55) continue;
    ctx.fillRect(wx - V.left, y + 3 + hv * 6, 9 + hv * 12, 2 + hv * 3);
  }
  ctx.restore();
  // the lit nose of the plate: broken into plate lengths with splices and soot,
  // rather than one ruled highlight across the whole view
  for (let wx = Math.floor(wx0 / 26) * 26; wx < wx1 + 26; wx += 26) {
    const hv = hash(wx * 0.9 + y);
    if (hv > 0.87) continue;                       // a plate worn back into shadow
    const v = 0.5 + hv * 0.5;
    ctx.fillStyle = `rgb(${123 * v | 0},${132 * v | 0},${150 * v | 0})`;
    ctx.fillRect(wx - V.left, y - 1.7, 26, 3.6);
    ctx.fillStyle = `rgba(255,255,255,${0.05 + hv * 0.2})`;
    ctx.fillRect(wx - V.left, y - 1.7, 26, 1.2);
    ctx.fillStyle = 'rgba(16,14,20,0.5)'; ctx.fillRect(wx - V.left + 24.6, y - 1.7, 1.4, 3.6);
  }
  for (let wx = Math.floor(wx0 / 118) * 118; wx < wx1 + 118; wx += 118) {
    ctx.fillStyle = '#9aa4b6'; ctx.fillRect(wx - V.left - 3, y - 2.6, 7, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(wx - V.left - 3, y + 1.4, 7, 1.4);
  }
  for (let wx = Math.floor(wx0 / 13) * 13; wx < wx1; wx += 13) {
    const hv = hash(wx * 2.7 + y * 1.1);
    if (hv < 0.35) continue;
    ctx.fillStyle = hv > 0.78 ? 'rgba(206,160,44,0.55)' : 'rgba(176,138,40,0.34)';
    ctx.fillRect(wx - V.left, y + 2.6, 13 * (0.55 + hv * 0.45), 2.2);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x0, y + 11, x1 - x0, 2.4);
}

// --- an open steel stair between floors
function millStair(wx0, y0, wx1, y1) {
  if (!inView(wx0, 280)) return;
  // 26 risers, so a 33-unit runner climbs about a fifth of their own height a step
  // 14, not 26: at the zoom a fork is actually seen at, 26 treads are 4.6 screen
  // pixels apart and alias into the smooth ramp they were meant to break up
  const x0 = wx0 - V.left, x1 = wx1 - V.left, n = 14;
  const dx = (x1 - x0) / n, dy = (y1 - y0) / n;
  // the shadow the flight throws back onto the brick
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.moveTo(x0 + 9, y0 + 8); ctx.lineTo(x1 + 9, y1 + 8); ctx.lineTo(x1 + 9, y1 + 26); ctx.lineTo(x0 + 9, y0 + 26); ctx.closePath(); ctx.fill();
  // a shallow stringer, so the flight reads open rather than as a ramp with stripes
  ctx.fillStyle = '#17151d';
  ctx.beginPath(); ctx.moveTo(x0, y0 + 2); ctx.lineTo(x1, y1 + 2); ctx.lineTo(x1, y1 + 15); ctx.lineTo(x0, y0 + 15); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2d2b37';
  ctx.beginPath(); ctx.moveTo(x0, y0 + 3.4); ctx.lineTo(x1, y1 + 3.4); ctx.lineTo(x1, y1 + 13); ctx.lineTo(x0, y0 + 13); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.moveTo(x0, y0 + 3.4); ctx.lineTo(x1, y1 + 3.4); ctx.lineTo(x1, y1 + 13); ctx.lineTo(x0, y0 + 13); ctx.closePath(); ctx.clip();
  rivets(x0, x1, y0 + 8, 16, 1, 'rgba(255,255,255,0.1)');
  ctx.restore();
  // treads, with the open riser showing between them
  for (let i = 0; i < n; i++) {
    const tx = x0 + dx * i, ty = y0 + dy * i;
    const tw2 = dx * 0.6;                        // the other 40% is open riser
    ctx.fillStyle = '#1b1922'; ctx.fillRect(tx - 0.8, ty - 4.4, tw2 + 1.6, 6.2);
    ctx.fillStyle = '#464a56'; ctx.fillRect(tx, ty - 3.6, tw2, 4.6);
    ctx.fillStyle = 'rgba(214,228,244,0.28)'; ctx.fillRect(tx, ty - 3.6, tw2, 1.3);
    ctx.fillStyle = 'rgba(206,160,44,0.42)'; ctx.fillRect(tx + tw2 - 3, ty - 3.6, 2.6, 1.3);
  }
  // a landing plate where the flight meets the deck above
  ctx.fillStyle = '#1b1922'; ctx.fillRect(x1 - 3, y1 - 4.4, 22, 7);
  ctx.fillStyle = '#4c5060'; ctx.fillRect(x1 - 2, y1 - 3.4, 20, 5);
  ctx.fillStyle = 'rgba(214,228,244,0.3)'; ctx.fillRect(x1 - 2, y1 - 3.4, 20, 1.3);
  // handrail at hand height on a 33-unit figure, with a mid rail under it
  ctx.strokeStyle = '#14121a'; ctx.lineWidth = 4.4;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 18); ctx.lineTo(x1 + 18, y1 - 18); ctx.stroke();
  ctx.strokeStyle = '#5b5f6c'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 18); ctx.lineTo(x1 + 18, y1 - 18); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 19); ctx.lineTo(x1 + 18, y1 - 19); ctx.stroke();
  ctx.strokeStyle = '#454955'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(x0, y0 - 9.4); ctx.lineTo(x1 + 18, y1 - 9.4); ctx.stroke();
  for (let i = 0; i <= n; i += 3) {
    const tx = x0 + dx * i, ty = y0 + dy * i;
    ctx.fillStyle = '#16141c'; ctx.fillRect(tx - 2, ty - 18.6, 4, 19);
    ctx.fillStyle = '#4e525f'; ctx.fillRect(tx - 1.3, ty - 18.6, 2.6, 19);
  }
  // the underside: a few hangers down to the floor below
  const floor = Math.max(y0, y1);
  for (let t = 0.24; t < 1; t += 0.32) {
    const px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t + 30, h = floor + 14 - py;
    if (h <= 4) continue;
    ctx.fillStyle = '#16141c'; ctx.fillRect(px - 5.4, py - 1, 10.8, h + 1);
    ctx.fillStyle = '#343240'; ctx.fillRect(px - 4.4, py, 8.8, h);
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(px - 4.4, py, 2, h);
  }
}

// --- the stairwell shaft cut through a floor
function millShaftWell(wx0, y0, wx1, y1) {
  if (!inView(wx0, 280)) return;
  const x0 = wx0 - V.left, x1 = wx1 - V.left, th = CFG.tunnelH;
  ctx.fillStyle = '#211e27';
  ctx.beginPath(); ctx.moveTo(x0, y0 + 1); ctx.lineTo(x1, y1 + 1); ctx.lineTo(x1, y1 - th); ctx.lineTo(x0, y0 - th); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.moveTo(x0, y0 + 1); ctx.lineTo(x1, y1 + 1); ctx.lineTo(x1, y1 - th); ctx.lineTo(x0, y0 - th); ctx.closePath(); ctx.clip();
  brickFill(Math.min(x0, x1) - 20, Math.min(y0, y1) - th - 20, Math.abs(x1 - x0) + 40, Math.abs(y1 - y0) + th + 60, 0.55);
  // enough light down the well that the flight inside it is not a silhouette on black
  const wl = ctx.createLinearGradient(x0, 0, x1, 0);
  wl.addColorStop(0, 'rgba(18,16,24,0.44)'); wl.addColorStop(0.55, 'rgba(18,16,24,0.1)'); wl.addColorStop(1, 'rgba(18,16,24,0.4)');
  ctx.fillStyle = wl; ctx.fillRect(Math.min(x0, x1) - 20, Math.min(y0, y1) - th - 20, Math.abs(x1 - x0) + 40, Math.abs(y1 - y0) + th + 60);
  ctx.restore();
  // light falling down the well from the floor above, so it is an opening and
  // not a hole punched in the artwork
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const dl = ctx.createLinearGradient(0, Math.min(y0, y1) - th, 0, Math.max(y0, y1));
  dl.addColorStop(0, 'rgba(226,214,186,0.2)'); dl.addColorStop(0.5, 'rgba(226,210,178,0.07)'); dl.addColorStop(1, 'rgba(226,210,178,0)');
  ctx.fillStyle = dl;
  ctx.beginPath(); ctx.moveTo(x0, y0 - th); ctx.lineTo(x1, y1 - th); ctx.lineTo(x1, y1 + 1); ctx.lineTo(x0, y0 + 1); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.restore();
  // steel soffit following the slope, riveted
  ctx.fillStyle = '#1a1821';
  ctx.beginPath(); ctx.moveTo(x0, y0 - th - 4); ctx.lineTo(x1, y1 - th - 4); ctx.lineTo(x1, y1 - th + 12); ctx.lineTo(x0, y0 - th + 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3a3c48';
  ctx.beginPath(); ctx.moveTo(x0, y0 - th - 2); ctx.lineTo(x1, y1 - th - 2); ctx.lineTo(x1, y1 - th + 8); ctx.lineTo(x0, y0 - th + 8); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.moveTo(x0, y0 - th - 2); ctx.lineTo(x1, y1 - th - 2); ctx.lineTo(x1, y1 - th + 9); ctx.lineTo(x0, y0 - th + 9); ctx.closePath(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.beginPath(); ctx.moveTo(x0, y0 - th - 2); ctx.lineTo(x1, y1 - th - 2); ctx.lineTo(x1, y1 - th - 0.6); ctx.lineTo(x0, y0 - th - 0.6); ctx.closePath(); ctx.fill();
  ctx.restore();
  for (let i = 0; i <= 10; i++) {
    const t = i / 10, px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t - th + 3;
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.beginPath(); ctx.arc(px, py, 1.1, 0, 6.28); ctx.fill();
  }
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = `rgba(0,0,0,${0.4 - i * 0.075})`;
    const a = y0 - th + 8 + i * 9, b = y1 - th + 8 + i * 9;
    ctx.beginPath(); ctx.moveTo(x0, a); ctx.lineTo(x1, b); ctx.lineTo(x1, b + 9); ctx.lineTo(x0, a + 9); ctx.closePath(); ctx.fill();
  }
}

// --- a conical enamel lamp hung off the truss
function millLamp(wx, y) {
  if (!inView(wx, 170)) return;
  const sx = wx - V.left;
  const fl = 0.93 + 0.045 * Math.sin(S.t * 4.7 + wx * 0.013) + 0.02 * Math.sin(S.t * 29 + wx);
  const sway = Math.sin(S.t * 1.05 + wx * 0.02) * 1.5;
  const cxg = sx + sway, bulbY = y + 26;
  ctx.save();
  ctx.beginPath(); ctx.rect(sx - 230, y - 2, 460, CFG.tunnelH + 6); ctx.clip();
  // the cone the shade throws, widening to the deck. Three nested widths rather
  // than one, so the sides have a penumbra instead of a ruled edge.
  for (const [spread, amt] of [[1.5, 0.1], [1.05, 0.11], [0.62, 0.13]]) {
    const cone = ctx.createLinearGradient(0, bulbY, 0, y + CFG.tunnelH);
    cone.addColorStop(0, `rgba(255,214,150,${amt * fl})`);
    cone.addColorStop(0.45, `rgba(255,200,130,${amt * 0.36 * fl})`);
    cone.addColorStop(1, 'rgba(255,196,120,0)');
    ctx.fillStyle = cone;
    ctx.beginPath();
    ctx.moveTo(cxg - 11 * spread, bulbY - 2); ctx.lineTo(cxg + 11 * spread, bulbY - 2);
    ctx.lineTo(cxg + 116 * spread, y + CFG.tunnelH); ctx.lineTo(cxg - 116 * spread, y + CFG.tunnelH);
    ctx.closePath(); ctx.fill();
  }
  // and a small bloom on the bulb itself, small enough that the ceiling clip
  // lands where the gradient has already gone
  const R = 54 * fl;
  const gl = ctx.createRadialGradient(cxg, bulbY, 2, cxg, bulbY, R);
  gl.addColorStop(0, `rgba(255,222,166,${0.34 * fl})`);
  gl.addColorStop(0.45, `rgba(255,204,136,${0.05 * fl})`);
  gl.addColorStop(1, 'rgba(255,198,126,0)');
  ctx.fillStyle = gl; ctx.fillRect(cxg - R, bulbY - R, R * 2, R * 2);
  ctx.restore();
  const cx = sx + sway;
  // flex and stem
  ctx.strokeStyle = '#14121a'; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(sx, y + 1); ctx.quadraticCurveTo(sx + sway * 0.4, y + 8, cx, y + 14); ctx.stroke();
  ctx.strokeStyle = '#4b4652'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(sx, y + 1); ctx.quadraticCurveTo(sx + sway * 0.4, y + 8, cx, y + 14); ctx.stroke();
  // shade: dark enamel outside, hot white inside
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.moveTo(cx - 4.4, y + 13); ctx.lineTo(cx + 4.4, y + 13); ctx.lineTo(cx + 13.4, y + 24.4); ctx.lineTo(cx - 13.4, y + 24.4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#31463f';
  ctx.beginPath(); ctx.moveTo(cx - 3.4, y + 14); ctx.lineTo(cx + 3.4, y + 14); ctx.lineTo(cx + 12.2, y + 23.6); ctx.lineTo(cx - 12.2, y + 23.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';
  ctx.beginPath(); ctx.moveTo(cx - 3.4, y + 14); ctx.lineTo(cx - 1, y + 14); ctx.lineTo(cx - 8, y + 23.6); ctx.lineTo(cx - 12.2, y + 23.6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255,236,196,${0.72 * fl})`; ctx.fillRect(cx - 11.6, y + 22.4, 23.2, 2);
  // bulb and cage
  ctx.fillStyle = `rgba(255,230,176,${0.95 * fl})`;
  ctx.beginPath(); ctx.ellipse(cx, y + 26.4, 3.4, 4.2, 0, 0, 6.28); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(255,246,214,${0.75 * fl})`;
  ctx.beginPath(); ctx.ellipse(cx, y + 26, 2, 2.6, 0, 0, 6.28); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(28,24,32,0.85)'; ctx.lineWidth = 1;
  for (const d of [-1, 0, 1]) {
    ctx.beginPath();
    ctx.moveTo(cx + d * 5.4, y + 23.6);
    ctx.quadraticCurveTo(cx + d * 6.6, y + 29.4, cx + d * 1.6, y + 31.6);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(cx - 5.6, y + 29); ctx.quadraticCurveTo(cx, y + 31.4, cx + 5.6, y + 29); ctx.stroke();
}

// --- the loading bay the crowd walks in through
function millDoorway(wx, y) {
  if (!inView(wx, 260)) return;
  // set in from the corner so the lintel and corbels are not cut off by it
  const sx = wx - V.left + 34, th = CFG.tunnelH, half = 46;
  ctx.save(); ctx.beginPath(); ctx.rect(FAC.x0 - V.left, -3000, 30000, 14000); ctx.clip();
  // jambs
  ctx.fillStyle = INK; ctx.fillRect(sx - half - 2, y - th - 6, 16, th + 6); ctx.fillRect(sx + half - 14, y - th - 6, 16, th + 6);
  ctx.fillStyle = '#463b42'; ctx.fillRect(sx - half, y - th - 6, 13, th + 6); ctx.fillRect(sx + half - 13, y - th - 6, 13, th + 6);
  ctx.save();
  ctx.beginPath(); ctx.rect(sx - half, y - th - 6, 13, th + 6); ctx.rect(sx + half - 13, y - th - 6, 13, th + 6); ctx.clip();
  brickFill(sx - half - 4, y - th - 10, half * 2 + 8, th + 14, 0.8);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,240,214,0.1)'; ctx.fillRect(sx - half, y - th - 6, 3.4, th + 6);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(sx + half - 4, y - th - 6, 4, th + 6);
  // riveted steel lintel on corbels
  ctx.fillStyle = INK; ctx.fillRect(sx - half - 8, y - th - 22, half * 2 + 16, 18);
  ctx.fillStyle = '#41434f'; ctx.fillRect(sx - half - 6, y - th - 20, half * 2 + 12, 14);
  ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(sx - half - 6, y - th - 20, half * 2 + 12, 1.6);
  rivets(sx - half - 1, sx + half + 1, y - th - 16, 11, 1.2, 'rgba(255,255,255,0.24)');
  rivets(sx - half - 1, sx + half + 1, y - th - 9, 11, 1.1, 'rgba(255,255,255,0.14)');
  ctx.fillStyle = '#4e4350';
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx + d * (half + 8), y - th - 4); ctx.lineTo(sx + d * (half + 8), y - th - 22); ctx.lineTo(sx + d * (half - 4), y - th - 4); ctx.closePath(); ctx.fill(); }
  // the shutter, rolled up under the lintel
  ctx.fillStyle = '#2a2833'; ctx.fillRect(sx - half + 4, y - th - 4, half * 2 - 8, 15);
  ctx.fillStyle = '#3d4049';
  for (let i = 0; i < 4; i++) ctx.fillRect(sx - half + 4, y - th - 3 + i * 3.6, half * 2 - 8, 2.4);
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(sx - half + 4, y - th - 3, half * 2 - 8, 1);
  ctx.fillStyle = '#1e1c26'; ctx.fillRect(sx - half + 4, y - th + 10, half * 2 - 8, 3.4);
  // gooseneck lamp over the door
  ctx.strokeStyle = INK; ctx.lineWidth = 3.4;
  ctx.beginPath(); ctx.moveTo(sx + half + 2, y - th - 26); ctx.quadraticCurveTo(sx + half + 2, y - th - 40, sx + half - 14, y - th - 40); ctx.stroke();
  ctx.strokeStyle = '#4b4652'; ctx.lineWidth = 2;

  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(sx + half - 22, y - th - 44); ctx.lineTo(sx + half - 6, y - th - 44); ctx.lineTo(sx + half - 10, y - th - 35); ctx.lineTo(sx + half - 18, y - th - 35); ctx.closePath(); ctx.fill();

    }
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(sx - 35, y + 2, 70, 2.4);

// --- the rest of the works, seen over the hills on the approach
// the mill yard: cinder underfoot, a boundary wall and the stuff that piles up
// against it, so the approach reads as a works and not a meadow
function millYard() {
  const x0 = FAC.x0 - 300, x1 = FAC.x0;
  if (!inView(x0, 200) && !inView(x1, 200)) return;
  const base = laneY(0);
  const sx0 = Math.max(-40, x0 - V.left), sx1 = Math.min(V.vw + 40, x1 - V.left);
  if (sx1 <= sx0) return;
  // cinder apron replacing the grass as you come up to the gate
  const cg = ctx.createLinearGradient(sx0, 0, sx0 + 120, 0);
  cg.addColorStop(0, 'rgba(48,44,42,0)'); cg.addColorStop(1, 'rgba(48,44,42,0.9)');
  ctx.fillStyle = cg; ctx.fillRect(sx0, base - 1, Math.min(120, sx1 - sx0), 22);
  if (sx1 - sx0 > 120) { ctx.fillStyle = 'rgba(48,44,42,0.9)'; ctx.fillRect(sx0 + 120, base - 1, sx1 - sx0 - 120, 22); }
  ctx.fillStyle = 'rgba(22,20,20,0.5)';
  for (let wx = Math.floor(x0 / 11) * 11; wx < x1; wx += 11) {
    const hv = hash(wx * 1.9);
    if (hv < 0.45) continue;
    ctx.fillRect(wx - V.left, base + 2 + hv * 12, 3 + hv * 4, 1.8);
  }
  // a low soot-stained boundary wall running back from the gable
  const wy = base - 44;
  ctx.fillStyle = '#332b31'; ctx.fillRect(sx0, wy, sx1 - sx0, 44);
  ctx.save(); ctx.beginPath(); ctx.rect(sx0, wy, sx1 - sx0, 44); ctx.clip();
  brickFill(sx0, wy, sx1 - sx0, 44, 0.75);
  ctx.fillStyle = 'rgba(30,26,32,0.3)'; ctx.fillRect(sx0, wy, sx1 - sx0, 44);
  ctx.restore();
  ctx.fillStyle = '#4c4350'; ctx.fillRect(sx0, wy - 5, sx1 - sx0, 6);
  ctx.fillStyle = 'rgba(255,244,220,0.18)'; ctx.fillRect(sx0, wy - 5, sx1 - sx0, 1.6);
  // a gate pier rather than a square butt end in open grass
  const px = x0 - V.left;
  if (px > sx0 - 20 && px < sx1) {
    ctx.fillStyle = '#2b242a'; ctx.fillRect(px - 9, wy - 18, 20, 62);
    ctx.save(); ctx.beginPath(); ctx.rect(px - 9, wy - 18, 20, 62); ctx.clip();
    brickFill(px - 12, wy - 22, 26, 70, 0.8);
    ctx.fillStyle = 'rgba(28,24,30,0.3)'; ctx.fillRect(px - 9, wy - 18, 20, 62);
    ctx.restore();
    ctx.fillStyle = '#524657'; ctx.fillRect(px - 12, wy - 24, 26, 8);
    ctx.fillStyle = 'rgba(255,244,220,0.2)'; ctx.fillRect(px - 12, wy - 24, 26, 1.8);
    ctx.fillStyle = 'rgba(255,238,206,0.12)'; ctx.fillRect(px - 9, wy - 18, 3.4, 62);
  }
  // crates and a barrel stacked against it
  for (const [off, kind] of [[46, 0], [104, 1], [150, 0], [214, 2]]) {
    const cx = x0 + off - V.left;
    if (cx < sx0 - 40 || cx > sx1 + 10) continue;
    if (kind === 0) {
      const cw = 22 + hash(off) * 8;
      ctx.fillStyle = '#17141a'; ctx.fillRect(cx - 1, base - cw * 0.9 - 1, cw + 2, cw * 0.9 + 2);
      ctx.fillStyle = '#4a3b2c'; ctx.fillRect(cx, base - cw * 0.9, cw, cw * 0.9);
      ctx.fillStyle = 'rgba(255,236,200,0.14)'; ctx.fillRect(cx, base - cw * 0.9, cw, 2.2);
      ctx.strokeStyle = 'rgba(0,0,0,0.42)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(cx, base - cw * 0.9); ctx.lineTo(cx + cw, base); ctx.stroke();
    } else if (kind === 1) {
      ctx.fillStyle = '#17141a'; roundRect(cx - 1, base - 27, 19, 28, 5); ctx.fill();
      ctx.fillStyle = '#4e3c2a'; roundRect(cx, base - 26, 17, 26, 4); ctx.fill();
      ctx.fillStyle = '#6a5136'; ctx.fillRect(cx, base - 21, 17, 2.6); ctx.fillRect(cx, base - 9, 17, 2.6);
      ctx.fillStyle = 'rgba(255,236,200,0.12)'; ctx.fillRect(cx, base - 26, 3.4, 26);
    } else {

      ctx.strokeStyle = '#17141a'; ctx.lineWidth = 4.4;

      ctx.beginPath(); ctx.moveTo(cx + 9, base); ctx.lineTo(cx + 34, base - 30); ctx.stroke();
      ctx.strokeStyle = '#5a4430'; ctx.lineWidth = 2.8;
      ctx.beginPath(); ctx.moveTo(cx, base); ctx.lineTo(cx + 26, base - 34); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 9, base); ctx.lineTo(cx + 34, base - 30); ctx.stroke();

  ctx.fillStyle = f.phase === 'search' ? '#2ecc71' : '#e67e22';
  ctx.fillRect(L.gen.x + 48, L.gen.y + 38, 32 * chargeFrac, 6);

  ctx.fillStyle = '#9a9088'; ctx.font = '11px monospace'; ctx.textAlign = 'left';
  ctx.fillText(f.phase === 'charge'
    ? `${f.line.length} workers on the wheel  -  ${f.chargeNeed.toFixed(1)}s to light`
    : f.phase === 'blackout'
      ? 'lights failing - hold on'
      : 'arrows move cursor  -  SPACE marks a difference', L.deck.x, L.deck.y - 10);

  // runners on deck - sorted back->front, full sprint cycle on the belt
  const pack = f.deck.slice().sort((a, b) => a.x - b.x);
  for (const d of pack) {
    if (d.enter < 0 && d.x <= L.deck.x - 40) continue;
    const sprinting = d.arrived && f.phase !== 'blackout';
    const entering = !d.arrived && d.enter >= 0;
    const phase = (sprinting || entering) ? (t * 24 + d.i * 2.1) : (t * 2 + d.i);
    const bob = (sprinting || entering) ? -Math.abs(Math.sin(phase)) * 3.6 : 0;
    const alpha = d.enter < 0 ? 0.35 : 1;
    ctx.fillStyle = `rgba(0,0,0,${0.38 * alpha})`;
    ctx.beginPath(); ctx.ellipse(d.x + 5, L.deck.y + L.deck.h - 1, 10, 2.8, 0, 0, 6.28); ctx.fill();
    ctx.save();
    ctx.translate(d.x, L.deck.y + L.deck.h - 6 + bob);
    if (sprinting || entering) ctx.rotate(0.12);
    drawFigure(d.r, 0, 0, phase, 1.18, alpha);
    ctx.restore();
  }

  // falling bodies
  for (const fall of f.falling) {
    ctx.save();
    ctx.translate(fall.x, fall.y);
    ctx.rotate(fall.rot);
    const alpha = fall.splashed ? Math.max(0, 1 - (fall.t - 0.35) / 1.5) : 1;
    drawFigure(fall.r, 0, 0, fall.t * 10, 1, alpha);
    ctx.restore();
  }

  // FX sparks / spray
  for (const p of f.fx) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.c;
    if (p.k === 'spark') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 8);
      ctx.fillRect(-1.5, -4, 3, 8); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r || 2, 0, 6.28); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // cursor (only useful in search, but show dim otherwise)
  const cx = f.cursor.x, cy = f.cursor.y;
  ctx.globalAlpha = f.phase === 'search' ? 1 : 0.35;
  ctx.strokeStyle = f.flashWrong > 0 ? '#ff4646' : '#5ce1ff'; ctx.lineWidth = 2;
  ctx.shadowColor = f.flashWrong > 0 ? 'rgba(255,70,70,0.5)' : 'rgba(92,225,255,0.45)'; ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.moveTo(cx - 12, cy); ctx.lineTo(cx + 12, cy); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx, cy + 12); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 8, 0, 6.28); ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;

  if (f.flashWrong > 0) {
    ctx.fillStyle = `rgba(255,40,40,${f.flashWrong * 0.28})`; ctx.fillRect(L.px, L.py, L.pw, L.ph);
  }
  ctx.textAlign = 'left';
}
function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.font = 'bold 52px monospace'; ctx.fillText('HUNDRED RUNNERS', W / 2 + 4, 114);
  ctx.fillStyle = '#f1c40f'; ctx.fillText('HUNDRED RUNNERS', W / 2, 110);
  ctx.fillStyle = '#eee'; ctx.font = '15px monospace';
  const lines = [
    'LAST ROOM PLAYTEST - no mid-run puzzles.',
    'Everyone runs straight to the sealed capitalism chamber.',
    'The room is dark: the crew must run a generator to light it.',
    'More survivors = faster charge. Then spot 10 differences in 90 seconds.',
    '',
    'ARROWS move the cursor. SPACE confirms a difference.',
    'A wrong mark costs one person and kills the lights - recharge from scratch.',
    'M mutes. R restarts after a run ends.',
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 156 + i * 22));
  ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 20px monospace';
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.t * 4); ctx.fillText('SPACE to start', W / 2, 350); ctx.globalAlpha = 1;
  if (S.best) { ctx.fillStyle = '#aaa'; ctx.font = '13px monospace'; ctx.fillText(`best run: ${S.best} survivors`, W / 2, 374); }
  ctx.fillStyle = '#777'; ctx.font = '11px monospace'; ctx.fillText(`build ${BUILD}`, W / 2, H - 34);
  ctx.textAlign = 'left';
}
// a list of names wrapped to the width of the screen, returning the y it finished on
function rollCall(label, names, colour, y) {
  ctx.fillStyle = colour;
  if (!names.length) { ctx.fillText(`${label}: nobody you knew`, W / 2, y); return y + 18; }
  const lines = [];
  let line = `${label}: `;
  names.forEach((nm, i) => {
    const bit = nm + (i < names.length - 1 ? ', ' : '');
    if (ctx.measureText(line + bit).width > W - 80) { lines.push(line); line = '   '; }
    line += bit;
  });
  lines.push(line);
  for (const l of lines) { ctx.fillText(l, W / 2, y); y += 17; }
  return y + 1;
}
function drawEnd() {
  const T = S.endT, win = S.mode === 'win';
  ctx.fillStyle = `rgba(6,4,10,${0.5 + 0.34 * clamp01(T / 0.7)})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const e of S.endEmb) {
    ctx.globalAlpha = Math.min(1, e.life / e.max) * Math.min(1, (e.max - e.life) * 2) * 0.75;
    ctx.fillStyle = e.c; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.28); ctx.fill();
  }
  ctx.restore();
  ctx.textAlign = 'center';

  // the title lands hard: overshoot, a kick of shake, and a ring off the impact
  const tp = clamp01(T / 0.44), tk = easeBack(tp), tsc = 1.75 - 0.75 * tk;
  const shake = Math.max(0, 1 - T / 0.3) * 7;
  ctx.save();
  ctx.translate(W / 2 + rand(-shake, shake), 104 + rand(-shake, shake)); ctx.scale(tsc, tsc);
  ctx.globalAlpha = Math.min(1, tp * 2.2);
  ctx.font = 'bold 46px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillText(win ? 'THEY MADE IT' : 'NOBODY MADE IT', 3, 4);
  ctx.fillStyle = win ? '#2ecc71' : '#ff4646';
  ctx.fillText(win ? 'THEY MADE IT' : 'NOBODY MADE IT', 0, 0);
  ctx.restore();
  if (tp < 1) {
    const rr = 40 + 420 * easeOut(tp);
    ctx.strokeStyle = win ? `rgba(46,204,113,${(1 - tp) * 0.45})` : `rgba(255,70,70,${(1 - tp) * 0.45})`;
    ctx.lineWidth = 6 * (1 - tp);
    ctx.beginPath(); ctx.ellipse(W / 2, 96, rr, rr * 0.34, 0, 0, 6.28); ctx.stroke();
  }

  // the tallies climb instead of simply being there
  const cp = easeOut(clamp01((T - 0.45) / 0.8));
  ctx.globalAlpha = clamp01((T - 0.4) / 0.3);
  ctx.fillStyle = '#eee'; ctx.font = '16px monospace';
  ctx.fillText(`Lost ${Math.round(S.stats.dead * cp)}   Reached the exit ${Math.round(S.stats.arrived * cp)}   best streak x${S.bestStreak}`, W / 2, 142);
  ctx.globalAlpha = 1;

  const named = S.runners.filter(r => r.name);
  const out = named.filter(r => r.state === 'arrived');
  const gone = named.filter(r => r.state !== 'arrived');
  let y = 176, at = 1.0;

  // who walked out
  ctx.font = 'bold 11px monospace';
  ctx.globalAlpha = clamp01((T - 0.88) / 0.3);
  ctx.fillStyle = 'rgba(150,240,190,0.9)';
  ctx.fillText(out.length ? `MADE IT OUT - ${out.length}` : 'NOT ONE OF THEM MADE IT OUT', W / 2, y);
  ctx.globalAlpha = 1;
  y += out.length ? 20 : 10;
  ctx.font = 'bold 13px monospace';
  for (const row of nameRows(out, W - 90, 16)) {
    let x = W / 2 - row.w / 2;
    ctx.textAlign = 'left';
    for (const it of row.items) { nameAt(it.r, x, y, at, false); x += it.w + 16; at += 0.035; }
    ctx.textAlign = 'center';
    y += 19;
  }

  // and where everyone else stopped, in the order they hit it
  y += 14; at += 0.15;
  ctx.font = 'bold 11px monospace';
  ctx.globalAlpha = clamp01((T - (at - 0.1)) / 0.3);
  ctx.fillStyle = 'rgba(255,160,160,0.9)';
  ctx.fillText(gone.length ? 'WHERE THE REST FELL' : 'EVERY ONE OF THEM WALKED OUT', W / 2, y);
  ctx.globalAlpha = 1;
  y += 18;

  if (gone.length) {
    const places = new Map();
    for (const r of gone) {
      const d = doomOf(r);
      if (!places.has(d.key)) places.set(d.key, { ...d, list: [] });
      places.get(d.key).list.push(r);
    }
    let rows = [...places.values()].sort((a, b) => a.order - b.order);
    // keep the report short enough to read: fold any tail into one last line
    const CAP = 12;
    if (rows.length > CAP) {
      const tail = rows.slice(CAP - 1);
      rows = rows.slice(0, CAP - 1);
      rows.push({ label: 'deeper in', list: tail.flatMap(t => t.list) });
    }
    const labelR = W / 2 - 132, namesL = W / 2 - 120, maxX = W - 40, LINES_CAP = 15;
    let lines = 0, spilled = 0;
    for (const row of rows) {
      let i = 0, firstLine = true;
      while (i < row.list.length) {
        if (lines >= LINES_CAP) { spilled += row.list.length - i; break; }
        if (firstLine) {
          const lp = clamp01((S.endT - at) / 0.3);
          if (lp > 0) {
            ctx.save();
            ctx.globalAlpha = Math.min(1, lp * 1.6);
            ctx.textAlign = 'right'; ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(210,180,180,0.75)';
            ctx.fillText(row.label, labelR, y);
            ctx.restore();
          }
        }
        // names wrap onto continuation lines rather than being cut off
        ctx.textAlign = 'left'; ctx.font = 'bold 12px monospace';
        let x = namesL, shown = 0;
        while (i < row.list.length) {
          const r = row.list[i], nw = ctx.measureText(r.name).width;
          if (shown && x + nw > maxX) break;
          nameAt(r, x, y, at + shown * 0.026, true);
          x += nw + 13; shown++; i++;
        }
        ctx.textAlign = 'center';
        at += 0.07 + shown * 0.024;
        y += 15; lines++; firstLine = false;
      }
      if (lines >= LINES_CAP && i < row.list.length) continue;
      at += 0.04;
    }
    if (spilled) {
      ctx.textAlign = 'left'; ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(200,150,150,0.7)';
      ctx.fillText(`and ${spilled} more, further in`, namesL, y);
      ctx.textAlign = 'center'; y += 15;
    }

    // the two facts they will actually argue about
    const furthest = gone.reduce((a, b) => b.endX > a.endX ? b : a);
    const first = gone.reduce((a, b) => b.deathT < a.deathT ? b : a);
    y += 12;
    ctx.font = '13px monospace';
    const l1 = clamp01((S.endT - at) / 0.35), l2 = clamp01((S.endT - at - 0.3) / 0.35);
    if (l1 > 0) {
      ctx.globalAlpha = Math.min(1, l1 * 1.6);
      ctx.fillStyle = '#ffd27a';
      ctx.fillText(`Got furthest: ${furthest.name} - ${Math.round(furthest.endX / CFG.finale.x * 100)}% of the way, at ${doomOf(furthest).short}`, W / 2, y);
      ctx.globalAlpha = 1;
    }
    if (l2 > 0) {
      ctx.globalAlpha = Math.min(1, l2 * 1.6);
      ctx.fillStyle = 'rgba(255,150,150,0.85)';
      ctx.fillText(`First to go: ${first.name} - ${doomOf(first).short}, ${first.deathT.toFixed(0)}s in`, W / 2, y + 18);
      ctx.globalAlpha = 1;
    }
    at += 0.7;
  }

  // the rank is stamped into the corner so the report keeps the middle of the screen
  if (win) {
    const left = (S.finale && S.finale.line) ? S.finale.line.length : S.stats.arrived;
    const rank = left >= 50 ? 'S' : left >= 30 ? 'A' : left >= 15 ? 'B' : left >= 5 ? 'C' : 'D';
    const line = { S: 'the mountain never touched them', A: 'a good day under the rock', B: 'they will talk about this', C: 'the mountain remembers', D: 'barely' }[rank];
    const sp = clamp01((T - 0.75) / 0.42), k = easeBack(sp);
    if (sp > 0) {
      ctx.save();
      ctx.translate(W - 112, 96); ctx.rotate(-0.16 + (1 - k) * -0.3); ctx.scale(2.1 - 1.1 * k, 2.1 - 1.1 * k);
      ctx.globalAlpha = Math.min(1, sp * 2.4);
      ctx.strokeStyle = 'rgba(241,196,15,0.5)'; ctx.lineWidth = 2; roundRect(-58, -26, 116, 52, 8); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.font = 'bold 30px monospace'; ctx.fillText(`RANK ${rank}`, 2, 12);
      ctx.fillStyle = '#f1c40f'; ctx.fillText(`RANK ${rank}`, 0, 10);
      ctx.restore();
      if (sp < 1) {
        const rr = 20 + 190 * easeOut(sp);
        ctx.strokeStyle = `rgba(241,196,15,${(1 - sp) * 0.5})`; ctx.lineWidth = 5 * (1 - sp);
        ctx.beginPath(); ctx.arc(W - 112, 96, rr, 0, 6.28); ctx.stroke();
      }
    }
    ctx.fillStyle = '#aaa'; ctx.font = '14px monospace';
    typeLine(`${left} survivor${left === 1 ? '' : 's'} - ${line}`, W / 2, H - 52, at);
  }

  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(S.t * 3.4);
  ctx.fillStyle = '#eee'; ctx.font = '17px monospace';
  ctx.fillText('R to run it again', W / 2, H - 24);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// ================================================================ loop
let last = performance.now();
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  update(S.spike ? real * 0.25 : real); draw();
  if (S.spike) { S.spike.t -= real; if (S.spike.t <= 0) S.spike = null; }
  if (S.spikeCool > 0) S.spikeCool -= real;
  requestAnimationFrame(frame);
}
reset();
updateView(1);
const qs = new URLSearchParams(location.search);
// ?start&skip=N runs N seconds of play; add &solve to have a bot clear every room it meets
function devSolve() {
  const fire = k => window.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
  for (const r of S.rooms.filter(r => r.state === 'armed')) {
    fire(String(r.hot));
    let guard = 0;
    while (S.active === r && guard++ < 200) {
      const m = r.mg;
      if (r.verb === 'keys') fire(m.seq[m.idx]);
      else if (r.verb === 'word') fire(m.word[m.idx]);
      else { m.pos = m.zone + m.zoneW / 2; fire(' '); }
    }
  }
}
if (qs.has('start')) {
  S.mode = 'play';
  const n = +(qs.get('skip') || 0) * 60, solve = qs.has('solve');
  for (let i = 0; i < n; i++) { update(1 / 60); if (solve) devSolve(); }
}
if (qs.has('finale')) {
  S.runners.forEach(r => { r.state = 'arrived'; });
  S.stats.arrived = S.runners.length; S.cam = S.camMax; updateView(1);
  startFinale();
}
requestAnimationFrame(frame);
</script>
