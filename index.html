function makeSeq(n) {
  const s = []; let last = '';
  while (s.length < n) { const k = pick(CFG.keyPool); if (k !== last) { s.push(k); last = k; } }
  return s;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function shade(hex, f = 0.72) {
  const n = parseInt(hex.slice(1), 16);

      // progress at all and five to cut through in under two -- which is a rhythm you have
      // to keep, not a key to mash. At the shipped 0.30/0.16 four presses finished it.

    crack.start(t); crack.stop(t + 0.09);

    // 2. the body, with the filter falling away
    const body = c.createBufferSource(); body.buffer = this.white;
    body.playbackRate.value = 0.8 + R() * 0.4;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.1;
    const dur = (0.30 + R() * 0.16) * sz;
    lp.frequency.setValueAtTime(3200 + R() * 1400, t);
    lp.frequency.exponentialRampToValueAtTime(320, t + dur);     // bright to dull: the wetness
    const bg = c.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.linearRampToValueAtTime(0.2 * sz, t + 0.02);
    bg.gain.exponentialRampToValueAtTime(0.0007, t + dur);
    body.connect(lp); lp.connect(bg); bg.connect(this.master);
    body.start(t); body.stop(t + dur + 0.04);

    // 3. the bubbles
    const n = 2 + Math.floor(R() * 3);
    for (let i = 0; i < n; i++) {
      const at = t + 0.05 + R() * 0.26 * sz;
      const f0 = 380 + R() * 520;
      const o = c.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(f0, at);
      o.frequency.exponentialRampToValueAtTime(f0 * (1.7 + R() * 1.3), at + 0.05);  // RISING: a shrinking bubble
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(0.05 + R() * 0.05, at + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0004, at + 0.07);
      o.connect(g); g.connect(this.master);
      o.start(at); o.stop(at + 0.1);
    }
  },
  scream() { this.tone('sawtooth', 900 + Math.random() * 300, 380, 0.3, 0.045); },
  boom() { this.tone('sine', 50, 28, 0.9, 0.7); this.noise(0.5, 0.35, ['lowpass', 250]); },
  millBeat() {
    if (!this.ctx || this.muted) return;
    this.tone('square', 92, 58, 0.09, 0.035);
    this.noise(0.06, 0.035, ['bandpass', 1500, 1.6]);
    this.tone('sine', 44, 30, 0.16, 0.06, 0.05);
  },
  cheer(n) { for (let i = 0; i < 3; i++) { const f = 440 * Math.pow(1.26, i) * (1 + Math.min(n, 8) * 0.06); this.tone('triangle', f, f * 1.5, 0.35, 0.08, i * 0.06); } },
  fail() { this.tone('sawtooth', 200, 60, 0.5, 0.22); },
  ambient(inside, moving, dt) {
    if (!this.ctx) return;
    if (this.muted) { this.rumble.gain.value = 0; this.bedGain.gain.value = 0; this.tail.gain.value = 0; return; }
    this.rumble.gain.value += ((inside ? 0.35 : 0.05) - this.rumble.gain.value) * Math.min(1, dt * 1.5);

    const crowd = Math.min(1, moving / 70);
    const near = clamp01(V.zoom);            // zoomed out is further away, so duller and quieter
    // three wobbles whose periods do not divide into each other, so the bed never
    // settles into a beat the way a single rectified sine did
    const w = 0.62 + 0.2 * Math.sin(S.t * 5.7) + 0.12 * Math.sin(S.t * 9.31 + 1.7) + 0.1 * Math.sin(S.t * 14.13 + 4.1);
    const bed = crowd * 0.19 * w * (inside ? 1 : 0.55) * (0.45 + 0.55 * near);
    this.bedGain.gain.value += (bed - this.bedGain.gain.value) * Math.min(1, dt * 12);
    this.bedFilter.frequency.value = 360 + 640 * near;
    this.tail.gain.value += ((inside ? 0.45 : 0.06) - this.tail.gain.value) * Math.min(1, dt * 2);

    // and the handful close enough to hear as individual feet
    const rate = 3 + 17 * crowd * (0.4 + 0.6 * near);
    this.grainT -= dt;
    let guard = 0;
    while (this.grainT <= 0 && guard++ < 6) {
      this.grainT += Math.max(0.012, (0.45 + Math.random() * 1.3) / rate);
      if (crowd <= 0) break;
      this.step((0.05 + Math.random() * 0.11) * (inside ? 1 : 0.6) * (0.4 + 0.6 * near),
                (Math.random() * 2 - 1) * 0.8, 0.35 + 0.65 * near);
      // every so often the weight of the pack rather than the scuff of it
      if (Math.random() < 0.2) this.tone('sine', 60 + Math.random() * 24, 40, 0.07, 0.1 * crowd * near);
    }
  },
};

// ================================================================ particles
// Each kind carries its own gravity, drag, size curve, shape and blend, so one
// emitter covers water, dust, sparks, embers, smoke, stone chips and light motes.
const PK = {
  drop:  { g: 640, drag: 0.03, r0: 2.4, r1: 0.5, add: false, shape: 'drop' },
  dust:  { g: 26,  drag: 1.8,  r0: 1.4, r1: 3.8, add: false, shape: 'puff' },
  smoke: { g: -16, drag: 1.3,  r0: 3,   r1: 15,  add: false, shape: 'puff' },
  ember: { g: -30, drag: 0.8,  r0: 1.7, r1: 0.3, add: true,  shape: 'dot' },
  spark: { g: 340, drag: 0.9,  r0: 1.9, r1: 0.15, add: true, shape: 'streak' },
  chip:  { g: 800, drag: 0.15, r0: 2.8, r1: 2.4, add: false, shape: 'chip' },
  mote:  { g: -2,  drag: 0.3,  r0: 1.0, r1: 1.0, add: true,  shape: 'dot' },
  grit:  { g: 520, drag: 0.1,  r0: 1.5, r1: 0.9, add: false, shape: 'dot' },
  // Act three. Thistle and willowherb seed: it does not fall and it does not glow, it
  // hangs and drifts, so it needs its own near-zero gravity and high drag rather than
  // being faked with a mote, which is additive and reads as a spark in daylight.
  seed:  { g: -1.4, drag: 0.5, r0: 1.4, r1: 1.1, add: false, shape: 'dot' },
};
const PCAP = 420;
// Open country, one frame's worth. Called from ambient() at its own 0.06s cadence.
//
// The density is keyed to the act's argument rather than being uniform: out of the
// mountain the ground is loud with seed and insects, and by the wall almost nothing is
// living in it. That is the parcelling of the land said in particles instead of in a
// caption, and it costs one multiplier.
function encAmbient() {
  const wx = rand(V.left - 40, V.left + V.vw + 40);
  const gy = encSurfaceY(wx);
  const fenced = clamp01((wx - ENC.free) / Math.max(1, ENC.wall - ENC.free));
  const alive = 1 - fenced * 0.78;
  const gust = windAt(wx, S.t);
  // seed heads carried downwind, faster inside a gust
  if (Math.random() < 0.6 * alive)
    emit('seed', 1, wx, gy + rand(-30, 96), { sx: 12, vx: [8 + gust * 22, 30 + gust * 30], vy: [-10, 4],
      life: [2.6, 5.4], c: `rgba(238,244,${212 + Math.round(hash(wx) * 26)},0.72)`, sz: 0.75 + hash(wx * 3) * 0.5 });
  // midges over the warm ground, which barely travel
  if (Math.random() < 0.34 * alive)
    emit('mote', 1, wx, gy + rand(6, 74), { sx: 16, sy: 8, vx: [-9, 16], vy: [-8, 8], life: [1.2, 2.8], c: 'rgba(255,238,176,0.42)' });
  // Dust off the trodden path, under the crowd rather than anywhere on screen -- a track
  // only smokes where feet are hitting it.
  if (Math.random() < 0.5) {
    const r = pick(S.runners.filter(q => q.state === 'run' && inView(q.x, 30)));
    if (r) emit('dust', 1, r.x + rand(-40, 40), footY(r) + 2,
      { sx: 6, vx: [-14 + gust * 26, 10 + gust * 30], vy: [-16, -3], life: [0.5, 1.1], c: 'rgba(188,176,150,0.34)', sz: 0.9 });
  }
}
function emit(k, n, x, y, o = {}) {
  n = Math.min(n, PCAP - S.particles.length);
  if (n <= 0) return;
  const vx = o.vx || [-30, 30], vy = o.vy || [-60, -10], lf = o.life || [0.4, 0.9];
  for (let i = 0; i < n; i++) {
    const life = rand(lf[0], lf[1]);
    S.particles.push({
      k, x: x + rand(-(o.sx || 0), o.sx || 0), y: y + rand(-(o.sy || 0), o.sy || 0),
      vx: rand(vx[0], vx[1]), vy: rand(vy[0], vy[1]),
      life, max: life, c: o.c || '#a08c70', sz: o.sz || 1, rot: rand(0, 6.28), rv: rand(-7, 7),
    });
  }
}
// an expanding ring: shockwaves at armed rooms, light bursts when one is solved, splash crowns
function ring(x, y, r1, life, c, w = 4, sq = 1) {
  S.rings.push({ x, y, r0: 4, r1, life, max: life, c, w, sq });
}
function solveBurst(room) {
  const cx = room.x + CFG.gapWidth / 2, y = laneY(room.lane);
  ring(cx, y - 24, 96, 0.38, '#ffd27a', 3, 0.42);
  emit('spark', 11, cx, y - 6, { sx: CFG.gapWidth / 2, vx: [-60, 60], vy: [-200, -70], life: [0.35, 0.8], c: '#ffe0a0' });
  emit('dust', 6, cx, y - 2, { sx: CFG.gapWidth / 2, vx: [-30, 30], vy: [-30, -6], life: [0.5, 0.9], c: 'rgba(160,140,112,0.45)' });
  room.flash = 1;
}
// idle life in the tunnels: embers off the lanterns, dust motes turning in the light
// the mill runs to a beat; the cave does not
let millBeatT = 0;
function ambient(dt) {
  const camX = S.cam + CFG.packFront;
  if (inMill(camX)) {
    millBeatT -= dt;
    if (millBeatT <= 0) { millBeatT = 0.82; AU.millBeat(); }
  }
  if (V.zoom < 0.3) return;
  S.ambT -= dt;
  if (S.ambT > 0) return;
  S.ambT = 0.06;
  // Act three has its own weather, and needs its own branch because the lamp loop below is
  // gated to lx < CFG.exit. Everything past the mountain's mouth therefore had no ambient
  // anything -- no seed, no insects, no dust off the track, not one particle in the whole
  // act. That is most of what "there are no effects out there" meant.
  if (ENC.inside(S.cam + CFG.packFront)) { encAmbient(); return; }
  const lit = [];
  for (let wx = Math.ceil((V.left - 100) / 240) * 240; wx < V.left + V.vw + 100; wx += 240) {
    for (let k = 0; k < CFG.laneCount; k++) {
      const lx = wx + k * 40;
      if (lx < CFG.exit && laneAt(k, lx) && Math.abs(lx - CFG.entrance) > 80 && Math.abs(lx - CFG.exit) > 80) lit.push([lx, laneY(k) - CFG.tunnelH + 2]);
    }
  }
  if (!lit.length) return;
  const [lx, ly] = pick(lit);
  if (inMill(lx)) {
    // the mill breathes steam and turns dust in the window light; nothing is on fire
    if (Math.random() < 0.45) emit('smoke', 1, lx + rand(-90, 90), ly + rand(26, 42), { sx: 3, vx: [-9, 15], vy: [-17, -5], life: [1.1, 2.2], c: 'rgba(198,206,208,0.15)', sz: 0.7 });
    if (Math.random() < 0.85) emit('mote', 1, lx + rand(-100, 100), ly + rand(20, 110), { vx: [-6, 9], vy: [-5, 5], life: [1.8, 3.6], c: 'rgba(214,232,248,0.45)' });
    if (Math.random() < 0.09) emit('spark', 1, lx + rand(-70, 70), ly + rand(74, 98), { vx: [-46, 46], vy: [-46, 12], life: [0.18, 0.42], c: '#ffdca6' });
    return;
  }
  emit('ember', 1, lx, ly + 13, { sx: 2, vx: [-7, 7], vy: [-28, -12], life: [0.7, 1.5], c: '#ffb457' });
  if (Math.random() < 0.7) emit('mote', 1, lx + rand(-80, 80), ly + rand(20, 100), { vx: [-5, 5], vy: [-4, 4], life: [1.6, 3.2], c: 'rgba(255,214,150,0.5)' });
}

// ================================================================ state

function reset() {

    runners: [], rooms: [], gates: [], active: null, wrongFlash: 0, shake: 0,

    stats: { dead: 0, arrived: 0 },
    finale: null, best: loadBest(), rollBottom: 254,
    endT: 0, endEmb: [], endSpawn: 0, endRoll: null,
    introT: 0, doorOpen: 0, drill: null, boss: null,
    recent: [], spike: null, spikeCool: 0, streak: 0, bestStreak: 0, lastScream: 0,
  };
  for (let i = 0; i < CFG.runnerCount; i++) {
    S.runners.push({
      x: 0, slot: rand(CFG.packBack, CFG.packFront), jit: rand(0, 6.28), jitAmp: rand(8, CFG.jitter),
      dy: rand(-22, 22), y: laneY(0),
      skin: pick(SKIN), shirt: pick(SHIRT), pants: pick(PANTS), hair: pick(HAIR), style: pick(STYLES), height: 1,
      name: null,
      phase: Math.random() * 6.28,

      doom: null, endX: 0, deathT: 0,
      lane: 0, lastForkX: -1, route: [], ramp: null, held: false,

      bornAt: (i / CFG.runnerCount) * CFG.intro.deliver,
    });
  }
  for (const r of S.runners) r.x = r.slot;
  // deal every name to a different runner
  const deck = S.runners.slice();
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  CFG.names.forEach((nm, i) => {
    const r = deck[i]; if (!r) return;
    r.name = nm;
    const L = LOOKS[nm];
    if (L) { r.skin = L.skin; r.hair = L.hair; r.style = L.style; r.height = L.h; r.shirt = L.shirt; }
  });
  CFG.rooms.forEach((r, i) => {
    const t = CFG.types[r.type];
    S.rooms.push({ ...r, ord: i + 1, verb: t.verb, hazard: t.hazard, title: t.title, color: t.color,
                   hot: null, mg: null, state: 'dormant', bridge: 0, deaths: 0, flash: 0, slamT: rand(0, CFG.crusherPeriod) });
  });
  for (const x of CFG.gates) S.gates.push({ x, state: 'dormant', holdT: 0, drop: 0.09, dropV: 0, landed: false, judder: 0, flash: 0 });
  V.zoom = 1; V.left = 0; V.vw = W;
}
// The one place a room becomes solved, so a win from the update loop looks
// exactly like a win from a keypress. room.pendingClear is cleared here.
function solveRoom(room) {
  room.state = 'solved'; room.pendingClear = false;
  if (S.active === room) S.active = null;
  AU.thud(); solveBurst(room);
  if (room.deaths === 0) cleanRoom(room);
  else S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 100, txt: 'CLEAR', life: 1, color: '#2ecc71' });
}
// The lowest digit nobody is using, or null when all nine are taken. It used to stop at 9
// and hand out 9 regardless, which gave two rooms the same key; that never bit while rooms
// armed one at a time, and would immediately with rooms arming on sight.
function freeHotkey() {
  const used = new Set(S.rooms.filter(r => r.state === 'armed').map(r => r.hot));
  for (let n = 1; n <= 9; n++) if (!used.has(n)) return n;
  return null;
}
function armRoom(room) {
  const n = freeHotkey();
  if (n === null) return;
  room.hot = n; room.mg = VERBS[room.verb].start(room.diff); room.state = 'armed';
  AU.arm();
  // the room wakes: a shockwave and dust shaken off the ceiling
  ring(room.x + CFG.gapWidth / 2, laneY(room.lane) - 34, 74, 0.4, room.color, 3, 0.5);
  emit('dust', 8, room.x + CFG.gapWidth / 2, laneY(room.lane) - CFG.tunnelH + 8, { sx: 60, vx: [-10, 10], vy: [12, 52], life: [0.6, 1.2], c: 'rgba(122,110,102,0.5)' });
}
// a room resolved with nobody lost: the streak grows
function cleanRoom(room) {
  S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
  // Rooms clear within a second of each other, so at life 1.4 three or four of these were
  // live at once -- the same number, stacked, one of them sitting on a hazard, while the
  // HUD pill already said it. Move the live one instead of adding another.
  const txt = S.streak > 1 ? `CLEAN x${S.streak}` : 'CLEAN';
  const live = S.floaters.find(f => f.clean);
  if (live) { live.txt = txt; live.life = 1.4; live.big = S.streak > 1; live.wx = room.x + CFG.gapWidth / 2; live.wy = laneY(room.lane) - 152; }
  else S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 152, txt, life: 1.4, color: '#2ecc71', big: S.streak > 1, clean: true });
  emit('spark', 7 + Math.min(9, S.streak), room.x + CFG.gapWidth / 2, laneY(room.lane) - 26, { sx: 34, vx: [-46, 46], vy: [-230, -120], life: [0.45, 0.95], c: '#8affbc' });
  AU.cheer(S.streak);
}
function say(r, pool, life = 2.2, pinned = false) {
  if (S.bubbles.some(b => b.r === r)) return;
  const used = new Set(S.bubbles.map(b => b.txt));
  const fresh = LINES[pool].filter(l => !used.has(l));
  S.bubbles.push({ r, wx: r.x, wy: footY(r) - (r.name ? 36 : 33), txt: pick(fresh.length ? fresh : LINES[pool]), life, max: life, pinned });
}
function killRunner(r, how) {
  r.state = 'dead'; r.endX = r.x; r.deathT = S.t; S.stats.dead++; S.shake = Math.min(5, S.shake + 1.2);
  S.recent.push(S.t); if (S.spike) S.spike.n++;
  S.lastKill = { x: r.x, y: laneY(r.lane) };      // so the death plate can point at where it happened
  if (S.streak > 0) { S.streak = 0; S.floaters.push({ sx: W / 2, sy: 200, txt: 'STREAK LOST', life: 1, color: '#ff9a3c' }); }
  // twenty going in at once is a bigger noise than one, and twenty identical
  // splashes on top of each other is mud rather than a crowd
  if (how === 'splash') AU.splash(1 + Math.min(0.8, S.recent.length * 0.12)); else AU.noise(0.1, 0.18, ['lowpass', 300]);
  if (S.t - S.lastScream > 0.2 && Math.random() < 0.6) { S.lastScream = S.t; AU.scream(); }
  if (how !== 'splash' && how !== 'dark' && Math.random() < 0.4 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; say(r, 'crush', 1.3); }
  if (how === 'splash') splash(r.x, CFG.riverY);
  else if (how === 'dark') dust(r.x, r.y + 50, '#3a3040');
  else dust(r.x, r.y - 6, '#c0392b');
  S.floaters.push({ wx: r.x, wy: r.y - 10, txt: r.name ? `-${r.name}` : '-1', life: r.name ? 1.4 : 0.8, color: '#ff6b6b' });
}

// ================================================================ input
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toUpperCase();
  if (k === ' ' || k === 'ENTER') e.preventDefault();
  // the machine puzzles are driven with the arrows; without this the browser
  // scrolls the page out from under the game while you play them
  if (k.startsWith('ARROW')) e.preventDefault();
  AU.init();
  if (k === 'M' && !S.active) { AU.muted = !AU.muted; return; }
  if (S.mode === 'title') { if (k === ' ') { S.mode = 'intro'; S.introT = 0; } return; }
  // Any key skips the opening; nobody wants to watch it twice. It skips TO the drill
  // rather than past it -- people mash space off the title, and landing on the road
  // having never seen a room is the thing the drill exists to prevent. Inside the drill
  // ESC moves past the kind on screen; see drillKey for why it is one and not all eleven.
  if (S.mode === 'intro') {
    if (S.drill && !S.drill.done) { drillKey(k); return; }
    // Only SPACE and ENTER, and never an auto-repeat: holding a key down would otherwise
    // walk the whole speech at the keyboard's repeat rate, which is the skip by another name.
    if (S.boss && !S.boss.gone) { if (!e.repeat && (k === ' ' || k === 'ENTER')) bossAdvance(); return; }
    if (!S.boss) { const c = I(); S.introT = c.deliver + c.settle; startBoss(); return; }
    startRun(); return;
  }
  if (S.mode === 'win' || S.mode === 'lose') { if (k === 'R') { reset(); S.mode = 'intro'; S.introT = 0; } return; }
  if (S.paused) { if (k === 'P') S.paused = false; else if (k === 'R') { reset(); S.mode = 'intro'; S.introT = 0; } return; }
  if (k === 'P' && !S.active) { S.paused = true; return; }
  if (S.mode === 'play') {
    // Digits pick a room, EXCEPT while a puzzle that reads digits is open --
    // the sweeper and the press keypad both do. Escape closes the panel and
    // hands 1-9 back to room selection.
    const numRoom = S.active && VERBS[S.active.verb].takesDigits;
    if (k >= '1' && k <= '9' && !numRoom) {
      const room = S.rooms.find(r => r.state === 'armed' && r.hot === +k);
      if (room) S.active = room;
      return;
    }
    if (k === 'ENTER') { toggleGate(); return; }
    if (k === 'ESCAPE') { S.active = null; return; }
    const room = S.active;
    if (!room) return;
    const res = VERBS[room.verb].key(room.mg, k);
    if (res === 'done') solveRoom(room);
    else if (res === 'wrong') { S.wrongFlash = 0.25; AU.wrong(); }
    else if (res === 'ok') AU.tick(VERBS[room.verb].progress(room.mg));
  }
  if (S.mode === 'finale') {
    const f = S.finale;
    if (!CFG.keyPool.includes(k)) return;
    if (k === f.seq[f.idx]) {
      f.idx++; f.timer = CFG.finale.keyTime; AU.tick(f.idx / f.len);
      if (f.idx >= f.len) { S.mode = 'win'; saveBest(f.attempts); }
    } else finaleFail();
  }
});
// The other half of a held key. `e.repeat` is dropped at the top of keydown, so a held key
// delivers exactly one keydown; verbs that are ABOUT holding (lift, blast) need to be told
// when it ends rather than being hammered. Only verbs declaring takesHold see this, so
// nothing else has to know keyup exists. A verb whose panel closes mid-hold never gets its
// release, which is why every hold verb also decays its own state in update().
window.addEventListener('keyup', e => {
  // The drill plays the same verbs, so a hold started in the drill needs its release
  // too -- without this the mantrap and the charge can never be let go of in there.
  const room = S.mode === 'play' ? S.active
             : S.mode === 'intro' && S.drill && !S.drill.done ? S.drill.room : null;
  if (!room) return;
  const v = VERBS[room.verb];
  if (v.takesHold && v.release) v.release(room.mg, e.key.toUpperCase());
});
function toggleGate() {
  const holding = S.gates.find(g => g.state === 'holding');

function releaseGate(g, spread) {

    const wander = Math.sin(S.t * 0.7 + r.jit) * r.jitAmp;

    // for good, drifting off the left edge; the back of the pack is as far back as anyone is ever placed
    r.slot = Math.max(CFG.packBack, CFG.packFront - (S.cam + CFG.packFront + wander - r.x) / spread);

// ================================================================ update
function update(dt) {
  if (S.paused) return;
  S.t += dt;
  S.wrongFlash = Math.max(0, S.wrongFlash - dt);
  S.shake = Math.max(0, S.shake - dt * 14);
  updateFx(dt);
  for (const r of S.runners) { r.phase += dt * 14; r.hop = Math.max(0, r.hop - dt); r.squash = Math.max(0, r.squash - dt * 7); }
  if (S.mode === 'finale') {
    const f = S.finale;
    f.timer -= dt;
    for (const l of f.leaving) l.t += dt;
    if (f.timer <= 0) finaleFail();
    updateView(dt);
    return;
  }
  if (S.mode === 'win' || S.mode === 'lose') { S.endT += dt; endEmbers(dt); }
  if (S.mode === 'intro') { updateIntro(dt); updateView(dt); return; }
  if (S.mode !== 'play') { updateView(dt); return; }

  let rear = Infinity;
  for (const r of S.runners) if (r.state === 'run') rear = Math.min(rear, r.x);
  const want = Math.min(S.camMax, S.cam + CFG.scroll * dt);
  if (rear < Infinity) {
    const limit = rear - CFG.keepOnScreen / V.zoom - CFG.packFront + 0.56 * V.vw;
    S.cam = Math.max(S.cam, Math.min(want, limit));
  } else S.cam = want;
  updateView(dt);
  const camStopped = S.cam >= S.camMax;
  S.recent = S.recent.filter(t => S.t - t < 1);
  if (!S.spike && S.spikeCool <= 0 && S.recent.length >= 5) {
    S.spike = { t: 0.9, n: S.recent.length, at: S.lastKill }; S.recent.length = 0; S.spikeCool = CFG.spikeCooldown; S.shake = 8; AU.boom();
  }

  AU.ambient(inside, S.runners.filter(r => r.state === 'run' && !r.held).length, dt);
  const spread = 1 + CFG.tire * (S.cam / S.camMax);
  if (S.active) VERBS[S.active.verb].update(S.active.mg, dt);
  const holdGate = S.gates.find(g => g.state === 'holding' && g.drop > 0.5);

  for (const r of S.runners) {
    if (r.state === 'run') {

      else {
        const target = S.cam + CFG.packFront - (CFG.packFront - r.slot) * spread + Math.sin(S.t * 0.7 + r.jit) * r.jitAmp;
        // anyone left behind closes the gap under their own steam, faster the further back they are

          emit('dust', 1, r.x - 3, footY(r) + 2, { vx: [-30, -6], vy: [-20, -5], life: [0.3, 0.6], c: 'rgba(196,180,160,0.6)', sz: 1.1 });
      }
      if (r.x >= CFG.finale.x - 40) { r.state = 'arrived'; r.endX = CFG.finale.x; S.stats.arrived++; continue; }

      // hazard, killing roughly a third of the crowd a run.

      // moving it: no future fork can be placed so as to recreate it.

        if (room.hazard === 'machine') {

          continue;
        }

        if (room.hazard === 'burst') continue;
        if (room.hazard === 'half') { if (r.rolled === room) continue; r.rolled = room; if (Math.random() < 0.5) continue; }

        r.rotRate = rand(1.5, 3.5) * (Math.random() < 0.5 ? -1 : 1); r.vx0 = CFG.scroll * 0.3; r.rv0 = r.rotRate;
        if (Math.random() < 0.35 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; S.bubbles = S.bubbles.filter(b => b.r !== r); say(r, 'fall', 1.4, true); }
        break;
      }
    } else if (r.state === 'fall') {

      // unsolved got the drowning death -- spray, ripples and AU.splash painted up the
      // face of a stone wall with no water within a thousand units. The ditches DO hold
      // water (drawn at y + depth - 14, which is where the body lands), so they keep it.
      if (r.fy > r.fallLimit) {

      // Two conditions beyond being on screen: somebody still in that lane has yet to reach
      // it, so rooms the crowd has already passed do not sit there armed, and a hotkey is
      // free, because far more rooms are now open at once than the nine digits allow.

      // more road from its warn, because nobody is in its lane until they arrive: wiring

      // so anyone still behind the room may yet come down this lane.

    if (room.state === 'armed' && room.mg && room.mg.won) {

      room.state = 'passed';
      if (S.active === room) S.active = null;
      if (room.deaths) S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 100, txt: 'TOO LATE', life: 1.2, color: '#ff8a8a' });

    // whenever the room is unsolved, including before the panel is ever opened,
    // so walking into an untouched press room is as dangerous as it looks.
    if (room.hazard === 'press' && room.state !== 'solved') {

      room.pressT = (room.pressT || 0) + dt;
      const beat = Math.floor(room.pressT / 0.65);
      if (beat > before) {
        const centre = room.x + 20 + ((beat - 1) % 3) * 40;
        if (inView(room.x, 120)) AU.thud();

        if (victim) { victim.doom = room; killRunner(victim, 'crush'); room.deaths++; }
      }

    // brought to rest. Scaling S.t by a rate makes the wheel JUMP the moment the rate
    // changes, because the phase is recomputed from scratch every frame; integrating a
    // decelerating rate is what makes it actually slow down and stop.

      if (before < 0.78 && room.slamT >= 0.78 && inView(room.x, 120)) {
        emit('grit', 7, room.x + 60, laneY(room.lane) - CFG.tunnelH + 16, { sx: 26, vx: [-12, 12], vy: [20, 70], life: [0.4, 0.7], c: '#9a8d80' });

// The shift comes off the line. Runners arrive on the belt in turn, step down,
// gather at the doors, and when the doors are up they are simply handed to the
// normal pack formation -- the run has already started by the time you see it move.
const I = () => CFG.intro;
// One stair, two consumers: updateIntro walks it and drawBelt draws it. Separate
// numbers here is how you get people descending past the treads.
// ---------------------------------------------------------------- the opening's datum
// Two lines: the band a rider stands on, and the yard everyone ends up on. Every
// other number in the opening is derived from them here and nowhere else.
//
// They used to be recomputed in four places and disagreed in all four -- riders hung
// 22 below the band, walkers 20 below the treads, and the flight covered 82 of a 126
// drop so it met neither the belt at the top nor the yard at the bottom. All four were
// the same datum computed four ways, so all four are fixed by having only one.
//
// CFG.intro.lift is the band's WALKING SURFACE above the yard, not the underside of the
// frame. That distinction is the whole bug: the frame hangs BELOW the surface you stand on.
const BELT_H = 22;                                    // frame depth, hanging below the band
// The gateway's VERTICAL datum, for the same reason. 122 was written in drawGateWall and
// again in drawYardDoors, and twice more as a literal `y - 122` in drawDoorSpill; they
// agreed today by luck, and one already meant something subtly different -- the spill's
// jamb licks started 10 units below the head of the opening they were lighting.

const introGroundY = () => laneY(0);

const STAIR_RUN = STAIR_N * STAIR_TREAD;

// a walker is on tread i for the whole of tread i, and drops a riser between them.
const stairY = k => introBeltY() + Math.min(STAIR_N, Math.floor(k * STAIR_N + 0.0001)) * STAIR_RISER;

// Between the shift assembling at the doors and the doors opening, the player is run
// through one of every kind of room, at difficulty 1, with nobody on the road. That gap
// already existed and was dead time; this is what it is for.
//
// The reason it exists at all: a room's usable window is 0.36 * V.vw ahead of the crowd,
// which is 3.13s at zoom 1, and every one of those budgets is an EXPERT's -- none of them
// contains a second for working out what you are looking at. Measured, the first bridge
// gives 3.13s for 3 keys while the same bridge deep in the cave gives 8.13s for 6, so the
// course hands you its tightest windows exactly where everything is new. The drill is
// where that reading happens instead, at no cost in lives.
//
// Panels arrive from the right, are played, and leave to the left. ESC moves past one.
const DRILL = { in: 0.34, out: 0.26 };
// The horizontal line every drill panel is centred on, whatever its height.
const DRILL_MID = 163;
function startDrill() {

  for (const r of CFG.rooms.slice().sort((a, b) => a.x - b.x)) {
    const t = CFG.types[r.type];
    if (!seen[t.verb]) { seen[t.verb] = 1; order.push({ verb: t.verb, title: t.title, color: t.color }); }
  }

  const o = d.order[d.idx];

  // diff-5 wall as your first ever sight of the verb would be the bug this is fixing.
  d.room = { verb: o.verb, title: o.title, color: o.color, mg: VERBS[o.verb].start(1), hot: d.idx + 1 };

function updateDrill(dt) {

  if (d.phase === 'out') { d.pos -= dt / DRILL.out; if (d.pos <= -1) drillNext(); return; }

function drillKey(k) {

  // a second and NEVER at 2 -- below that the spade slumps back faster than it digs, which
  // is the point of the room on the road, where failing it costs people and the crowd
  // walks on. Here it would hold the doors shut against a player who simply cannot drum

  const drilling = S.drill && !S.drill.done;

  const holding = drilling || (S.boss && !S.boss.gone);

// camera moves, with each block lit on its upper-left face and dark on its lower-right,
// which is also the one thing the strata cannot say: bedding runs flat, fracture runs across.

// ================================================================ the workings
// What a mine has in it besides tunnels. Drawn by rockCorridor, which runs before the crowd,
// so a prop is always BEHIND the people walking past it and can never hide a runner.
//
// Placement is hashed off world position, so nothing moves when the camera does. Nothing is
// placed within CAVE_CLEAR of a room or a gate: those openings are the puzzle, and a barrow
// parked across one would be a lie about where the floor is.

// measures up to it with it, so they cannot drift. Written down twice they did: the prop was

    const px = wx + jitter;

// How fast the line shaft is turning at a point in the hall, as an accumulated angle.
// A gears room drives the bays around it, so solving one stops the shafting the player has
// been watching turn since the yard, rather than just clearing a panel. Bays out of its
// reach keep running on the clock.
const SHAFT_REACH = 620;
function shaftPhase(gx) {
  for (const room of S.rooms) {
    if (room.type !== 'gears' || room.bridge <= 0) continue;
    const d = Math.abs(gx - (room.x + CFG.gapWidth / 2));
    if (d > SHAFT_REACH) continue;
    // the bays nearest the machine stop first and hardest
    const grip = 1 - d / SHAFT_REACH;
    return room.shaftA * grip + S.t * 4 * (1 - grip);
  }
  return S.t * 4;
}
// A playable machine: the SAME plant that stands at the back of the hall, brought to the
// front and lit. Not a new object drawn in a new language. The hall already contains
// presses, lathes and boilers; a puzzle press drawn as its own thing would put two
// different objects called a press in one room and ask the player to believe they match.
// What says "this one is yours" is that it is lit, forward and carries a lamp, which is how
// every other room already announces itself, not a separate palette.
function millMachine(room, y) {

  const clear = room.state === 'solved';
  const b = room.bridge, run = 1 - b;
  // the hall's own palette, two steps up because this one stands in the light
  const DARK = '#141220', BODY = '#39443f', LIT = '#5a6a63', RIM = 'rgba(206,228,248,0.4)';
  const lamp = clear ? '#6ee7a0' : '#ff7a52';

  ctx.fillStyle = DARK; ctx.fillRect(sx - 8, y - 12, w + 16, 14);

  ctx.fillStyle = RIM; ctx.fillRect(sx - 6, y - 10, w + 12, 1.6);

    const a = shaftPhase(room.x + w / 2) * 0.6;

    ctx.fillStyle = BODY; ctx.fillRect(sx + 7, y - 77, 10, 67);
    ctx.fillStyle = RIM; ctx.fillRect(sx + 7, y - 77, 3, 67);
    for (const [gx, gy, r, dir] of [[sx + 44, y - 50, 21, 1], [sx + 80, y - 50, 15, -1], [sx + 62, y - 22, 12, 1]]) {
      ctx.fillStyle = DARK; gearTeeth(gx, gy, r + 2.4, a * dir);

      ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(gx, gy, r * 0.32, 0, 6.28); ctx.fill();

// --- the big engines -----------------------------------------------------------------
// What stands in one bay of the hall. The plant loop and the line-shafting loop both need
// this and used to work it out separately from the same two hashes, so a machine and the
// belt driving it could disagree the moment either expression moved. Those two hashes are
// unchanged here on purpose: every ordinary bay stands exactly where it already stood.
//
// The big engines are picked on a hash of their own and TAKE A BAY OVER rather than being
// squeezed between two. That is NOT a guarantee of clearance, and an earlier version of
// this comment claimed it was: the bay jitter is +/- 25, so consecutive centres are 150 to
// 250 apart and an engine is 197 wide. What guarantees it is tools/hall-check.js, which
// measures every placed pair on the mill's real bay positions and fails if one overlaps.
// Run it after touching a width, a jitter or a lane span.

// checked by tools/hall-check.js, which derives the same extents by recording where paint
// actually lands. If you widen a machine, this is the other place the number lives.

// affect; every loop that places a FEATURE must pass it, or adjacency goes unchecked.

  const kind = Math.floor(hash(gx * 0.017 + lane * 7.7) * 4);
  // The multipliers are picked, not arbitrary: over the mill's own bay positions they give
  // 42 engines across the six lanes, fourteen of each kind, six to ten per lane. The
  // obvious first pair put eight cupolas and one hammer on the whole course, which is what
  // a hash does when you ask it for three-way balance over forty samples and do not look.
  let feat = has && hash(gx * 0.043 + lane * 5.1) < 0.44
    ? Math.floor(hash(gx * 0.029 + lane * 2.9) * 3) : -1;

  // can be 150 apart while an engine reaches 197 across; but two hammers need 96 and have

  // wx alone, so a machine cannot appear or vanish as the camera moves past it.

function contactShadow(sx, y, rx) {

  // ruled edge on it, and it read as a painted oval rather than as shade
  const g = ctx.createRadialGradient(sx, y + 1, 0, sx, y + 1, rx);
  g.addColorStop(0, 'rgba(0,0,0,0.38)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.26)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  // offset away from the light. Every body in the hall, mine and millPlant's, carries its
  // rim on the top and left edges; a shadow centred under it contradicts them.
  const off = rx * 0.12;
  ctx.save(); ctx.translate(sx + off, y + 1); ctx.scale(1, 7 / rx); ctx.translate(-sx, -(y + 1));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, y + 1, rx, 0, 6.28); ctx.fill();
  ctx.restore();
}
// The engine that turns the hall. Everything else in here hangs off the line shaft; this
// is the thing on the other end of it, so it runs on shaftPhase rather than on a clock of
// its own -- shut the drive train down at a gears room and the engine coasts to a stop
// with it, instead of hammering away beside a shaft that has already stopped.
//
// Horizontal, not a beam engine, and that was decided by the room rather than by taste:
// the corridor is CFG.tunnelH tall with the shafting 52 down from the ceiling, which
// leaves 78 units of headroom. A beam engine wants half again that and comes out squat;
// a horizontal engine is the machine that shape of building actually got.
// The engine's crank angle, in one place. The body and the smoke both need it and they
// drifted the moment the belt gearing was added to one and not the other: the drain cocks
// beat 1.325x faster than the crank they are supposed to be opening with. Same reason
// hammerStroke and millBay exist.
const ENG = { drum: 20, rim: 26.5 };              // the belt's two radii; everything follows
const engineCrank = gx => shaftPhase(gx) * (ENG.drum / ENG.rim) + hash(gx) * 6.28;
function millEngine(sx, y, gx, shy) {
  const DARK = '#100e16', BODY = '#28322f', LIT = '#3c4845', EDGE = 'rgba(198,222,244,0.3)';
  const BRASS = '#6e5a2e', SHEEN = 'rgba(228,200,130,0.3)';
  const DRUM = ENG.drum, RIM = ENG.rim;
  const a = engineCrank(gx);
  const CL = y - 48;                              // centre line: piston, crosshead, crank
  const cr = 12, rod = 62, cx = sx + 56;
  const px = cx + Math.cos(a) * cr, py = CL + Math.sin(a) * cr;
  // The crosshead is wherever the rod's other end HAS to be, given that it slides on the
  // centre line: one square root, and the motion comes out as the engine's own rather
  // than a second sine wave that happens to look a bit like it.
  const C = px - Math.sqrt(Math.max(1, rod * rod - (py - CL) * (py - CL)));

  // ---- bedplate, and the crank pedestal it deliberately does not reach: the wheel wants
  // clear floor under it, and a bed running the whole length would have it ploughing
  contactShadow(sx - 43, y, 64); contactShadow(sx + 57, y, 24);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 104, y - 19, 130, 19);
  const bg = ctx.createLinearGradient(0, y - 19, 0, y);
  bg.addColorStop(0, '#39443f'); bg.addColorStop(0.35, '#28322f'); bg.addColorStop(1, '#1a211f');
  ctx.fillStyle = bg; ctx.fillRect(sx - 103, y - 18, 128, 18);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 103, y - 18, 128, 1.5);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (let i = -96; i < 14; i += 23) ctx.fillRect(sx + i, y - 13, 10, 2.6);
  ctx.fillStyle = 'rgba(206,228,250,0.07)';
  for (let i = -96; i < 14; i += 23) ctx.fillRect(sx + i, y - 13, 10, 0.9);
  ctx.fillStyle = DARK; ctx.fillRect(sx + 38, y - 44, 38, 44);
  ctx.fillStyle = bg; ctx.fillRect(sx + 39, y - 43, 36, 43);
  ctx.fillStyle = RIM; ctx.fillRect(sx + 39, y - 43, 3.4, 43);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(sx + 68, y - 43, 6, 43);
  ctx.fillStyle = DARK; ctx.fillRect(sx + 42, y - 60, 30, 17);
  ctx.fillStyle = LIT; ctx.fillRect(sx + 43, y - 59, 28, 15);
  ctx.fillStyle = RIM; ctx.fillRect(sx + 43, y - 59, 28, 1.5);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(sx + 43, y - 52, 28, 2.2);

  // ---- cylinder. Two to one, long and low: a barrel as tall as it is long reads as a
  // crate with bands painted on, which is what the first pass at this was.
  ctx.fillStyle = DARK; ctx.fillRect(sx - 96, y - 32, 54, 14);
  ctx.fillStyle = BODY; ctx.fillRect(sx - 95, y - 31, 52, 13);
  for (const cxo of [-99, -38]) {                 // drain cocks, clear of the saddle
    ctx.fillStyle = DARK; ctx.fillRect(sx + cxo - 2.6, y - 32, 5.2, 7);
    ctx.fillStyle = '#5c4d26'; ctx.fillRect(sx + cxo - 1.8, y - 31, 3.6, 6);
    ctx.fillStyle = DARK; ctx.fillRect(sx + cxo - 4.4, y - 27, 8.8, 2.4);
  }
  ctx.fillStyle = DARK; ctx.fillRect(sx - 101, y - 66, 68, 35);
  const cg = ctx.createLinearGradient(0, y - 65, 0, y - 32);
  cg.addColorStop(0, '#4a3f30'); cg.addColorStop(0.34, '#352d24'); cg.addColorStop(1, '#1d1915');
  ctx.fillStyle = cg; ctx.fillRect(sx - 100, y - 65, 66, 33);
  // the lagging is timber over the iron, and it is why this one object in the hall is warm
  for (let i = 1; i < 6; i++) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(sx - 100, y - 65 + i * 5.6, 66, 1.1);
    ctx.fillStyle = 'rgba(255,226,180,0.045)'; ctx.fillRect(sx - 100, y - 64 + i * 5.6, 66, 0.8);
  }
  for (const bx of [-92, -62]) {
    ctx.fillStyle = '#231c12'; ctx.fillRect(sx + bx - 1, y - 66, 6.6, 35);
    ctx.fillStyle = BRASS; ctx.fillRect(sx + bx, y - 66, 5, 35);
    ctx.fillStyle = SHEEN; ctx.fillRect(sx + bx, y - 66, 1.4, 35);
  }
  ctx.fillStyle = DARK; ctx.fillRect(sx - 108, y - 69, 8, 41);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 107, y - 68, 6, 39);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 107, y - 68, 6, 1.3);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (let i = 0; i < 4; i++) ctx.fillRect(sx - 106, y - 63 + i * 10, 4, 1.8);
  ctx.fillStyle = BODY; ctx.beginPath(); ctx.arc(sx - 104, y - 48, 6, 0, 6.28); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(sx - 104, y - 48, 2.6, 0, 6.28); ctx.fill();
  // valve chest on the top, and its steam pipe up into the overhead main
  ctx.fillStyle = DARK; ctx.fillRect(sx - 88, y - 79, 34, 14);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 87, y - 78, 32, 12);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 87, y - 78, 32, 1.6);
  ctx.fillStyle = 'rgba(0,0,0,0.42)';
  for (let i = 0; i < 6; i++) ctx.fillRect(sx - 84 + i * 5.6, y - 76, 1.8, 1.8);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 77, shy - 28, 11, 26);
  ctx.fillStyle = '#39424a'; ctx.fillRect(sx - 76, shy - 28, 9, 26);
  ctx.fillStyle = 'rgba(210,230,240,0.13)'; ctx.fillRect(sx - 76, shy - 28, 2.4, 26);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 79, y - 84, 15, 5);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 79, y - 84, 15, 1.2);
  // exhaust standpipe, off the cylinder and up to the flue. It is the leak at this bend
  // that millEngineSmoke draws: an engine that never shows is an engine nobody believes.
  ctx.fillStyle = DARK; ctx.fillRect(sx - 52, y - 90, 14, 28);
  ctx.fillStyle = '#39424a'; ctx.fillRect(sx - 51, y - 90, 12, 28);
  ctx.fillStyle = 'rgba(210,230,240,0.13)'; ctx.fillRect(sx - 51, y - 90, 3, 28);
  // the joint millEngineSmoke leaks at. Without it the steam came out of smooth pipe.
  ctx.fillStyle = '#1a161c'; ctx.fillRect(sx - 54, y - 74, 18, 6);
  ctx.fillStyle = '#3b3540'; ctx.fillRect(sx - 54, y - 74, 18, 4);
  ctx.fillStyle = 'rgba(214,230,248,0.13)'; ctx.fillRect(sx - 54, y - 74, 18, 1.2);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 56, y - 92, 22, 7);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 55, y - 91.4, 20, 5);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 55, y - 91.4, 20, 1.2);

  // ---- slide bars, crosshead, piston rod
  // the motion plate: the standard that carries the far end of the bars down to the bed
  ctx.fillStyle = DARK; ctx.fillRect(sx + 14, y - 63, 12, 45);
  ctx.fillStyle = BODY; ctx.fillRect(sx + 15, y - 62, 10, 44);
  ctx.fillStyle = RIM; ctx.fillRect(sx + 15, y - 62, 3, 44);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.arc(sx + 20, y - 40, 3, 0, 6.28); ctx.fill();
  ctx.fillStyle = DARK; ctx.fillRect(sx - 32, y - 62, 54, 6); ctx.fillRect(sx - 32, y - 40, 54, 6);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 32, y - 61, 54, 4); ctx.fillRect(sx - 32, y - 39, 54, 4);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 32, y - 61, 54, 1.1); ctx.fillRect(sx - 32, y - 39, 54, 1.1);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 38, y - 55, 8, 14);
  ctx.fillStyle = '#5c4d26'; ctx.fillRect(sx - 37, y - 54, 6, 12);
  ctx.fillStyle = SHEEN; ctx.fillRect(sx - 37, y - 54, 6, 1.3);
  ctx.fillStyle = '#5f6d6a'; ctx.fillRect(sx - 32, y - 50.4, C - 9 - (sx - 32), 4.8);
  ctx.fillStyle = 'rgba(226,240,255,0.24)'; ctx.fillRect(sx - 32, y - 50.4, C - 9 - (sx - 32), 1.4);
  ctx.fillStyle = DARK; ctx.fillRect(C - 9, y - 62, 18, 28);
  ctx.fillStyle = LIT; ctx.fillRect(C - 8, y - 61, 16, 26);
  ctx.fillStyle = RIM; ctx.fillRect(C - 8, y - 61, 16, 1.5);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(C - 8, y - 50, 16, 2.2);
  // the slippers riding the bars, so the block reads as held rather than floating
  ctx.fillStyle = 'rgba(220,238,255,0.2)';
  ctx.fillRect(C - 8, y - 58.4, 16, 1.3); ctx.fillRect(C - 8, y - 38.4, 16, 1.3);

  // ---- the drive: two strands off the shaft pulley this bay already carries, ending on
  // the rim's tangent so the belt meets the wheel instead of stopping short of it. Drawn
  // here and not by the shafting loop -- bayDrive returns SELF_DRIVEN to keep the loop out
  // of it -- because the wheel has to be down before a belt can wrap it.
  const dvx = 0, dvy = CL - shy, dl = Math.abs(dvy) || 1;   // drum is over the wheel
  const nx = -dvy / dl, ny = dvx / dl, sag = Math.sin(S.t * 5 + gx) * 1.1;
  // Hangers spaced for the drum, and the drum itself directly over the flywheel. Sitting
  // at sx it threw the belt diagonally across the engine: the lower strand began inside
  // the upper slide bar, passed half a unit from the crosshead's centre line, and cut the
  // motion plate in half -- all of it painted over the moving parts, because the belt is
  // drawn last. Over the wheel the strands are vertical and miss every one of them.
  for (const hd of [-30, 27]) {
    ctx.fillStyle = '#3f414a'; ctx.fillRect(cx + hd, shy - 52, 3.4, 52);
    ctx.fillStyle = 'rgba(214,230,248,0.12)'; ctx.fillRect(cx + hd, shy - 52, 1.1, 52);
    ctx.fillStyle = '#4b4a55'; ctx.fillRect(cx + hd - 3, shy - 6, 9.4, 8);
  }
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(cx, shy, DRUM + 1.6, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#343742'; ctx.beginPath(); ctx.arc(cx, shy, DRUM, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(206,224,244,0.2)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(cx, shy, DRUM, 3.4, 5.5); ctx.stroke();
  ctx.fillStyle = '#23252e'; ctx.beginPath(); ctx.arc(cx, shy, 5, 0, 6.28); ctx.fill();
  const dspin = shaftPhase(gx) + hash(gx) * 6;
  ctx.fillStyle = 'rgba(224,206,160,0.3)';
  ctx.beginPath(); ctx.arc(cx + Math.cos(dspin) * (DRUM - 4), shy + Math.sin(dspin) * (DRUM - 4), 1.5, 0, 6.28); ctx.fill();
  ctx.save(); ctx.lineCap = 'butt';
  for (const d of [-1, 1]) {
    const ax = cx + nx * d * DRUM, ay = shy + ny * d * DRUM;
    const bx2 = cx + nx * d * RIM, by2 = CL + ny * d * RIM;
    const mx = (ax + bx2) / 2 + nx * d * 2.4 + sag * d, my = (ay + by2) / 2 + ny * d * 2.4;
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 4.4;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx2, by2); ctx.stroke();
    ctx.strokeStyle = d < 0 ? '#332718' : '#40311f'; ctx.lineWidth = 2.8;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx, my, bx2, by2); ctx.stroke();
    if (d > 0) {
      ctx.strokeStyle = 'rgba(206,188,158,0.16)'; ctx.lineWidth = 0.9;
      ctx.beginPath(); ctx.moveTo(ax, ay - 1.2); ctx.quadraticCurveTo(mx, my - 1.2, bx2, by2 - 1.2); ctx.stroke();
    }
  }
  ctx.restore();

  // ---- flywheel: an open wheel, so the crank bearing behind it stays visible
  ctx.save(); ctx.lineCap = 'butt';
  ctx.strokeStyle = DARK; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(cx, CL, 26, 0, 6.28); ctx.stroke();
  ctx.strokeStyle = '#313c39'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(cx, CL, 26, 0, 6.28); ctx.stroke();
  ctx.strokeStyle = 'rgba(206,228,250,0.22)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, CL, 28.8, Math.PI * 1.04, Math.PI * 1.84); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, CL, 24.2, 0, 6.28); ctx.stroke();
  ctx.strokeStyle = '#2b3532'; ctx.lineWidth = 4.4;
  for (let i = 0; i < 6; i++) {
    const th = a + i * Math.PI / 3;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(th) * 6, CL + Math.sin(th) * 6);
    ctx.lineTo(cx + Math.cos(th) * 23.4, CL + Math.sin(th) * 23.4); ctx.stroke();
  }
  // the belt wrapping the far side of the rim, laid over it after the strands
  ctx.strokeStyle = '#332718'; ctx.lineWidth = 6;
  const wrap = Math.atan2(ny, nx) + Math.PI;
  ctx.beginPath(); ctx.arc(cx, CL, RIM, wrap, wrap + Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(206,188,158,0.1)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, CL, 29, wrap, wrap + Math.PI); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(cx, CL, 8.4, 0, 6.28); ctx.fill();
  ctx.fillStyle = LIT; ctx.beginPath(); ctx.arc(cx, CL, 5.8, 0, 6.28); ctx.fill();
  // one bright bolt on the rim: a wheel with no mark on it does not read as turning
  ctx.fillStyle = 'rgba(226,212,168,0.5)';
  ctx.beginPath(); ctx.arc(cx + Math.cos(a) * 26, CL + Math.sin(a) * 26, 2, 0, 6.28); ctx.fill();

  // ---- connecting rod, drawn last so its big end sits ON the crank pin, not under it
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = DARK; ctx.lineWidth = 8.6;
  ctx.beginPath(); ctx.moveTo(C, CL); ctx.lineTo(px, py); ctx.stroke();
  ctx.strokeStyle = '#414e4b'; ctx.lineWidth = 5.6;
  ctx.beginPath(); ctx.moveTo(C, CL); ctx.lineTo(px, py); ctx.stroke();
  ctx.strokeStyle = 'rgba(220,240,255,0.18)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(C, CL - 1.7); ctx.lineTo(px, py - 1.7); ctx.stroke();
  ctx.restore();
  for (const [bx, by, br] of [[C, CL, 4.4], [px, py, 5.8]]) {
    ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(bx, by, br, 0, 6.28); ctx.fill();
    ctx.fillStyle = BRASS; ctx.beginPath(); ctx.arc(bx, by, br - 1.8, 0, 6.28); ctx.fill();
    ctx.fillStyle = SHEEN; ctx.beginPath(); ctx.arc(bx - 0.8, by - 0.8, (br - 1.8) * 0.5, 0, 6.28); ctx.fill();
  }

  // the warmth off a working cylinder, thrown down onto the deck in front of it
  const wg = ctx.createLinearGradient(0, y - 24, 0, y + 20);
  wg.addColorStop(0, 'rgba(255,196,120,0)'); wg.addColorStop(0.545, 'rgba(255,196,120,0.07)');
  wg.addColorStop(1, 'rgba(255,196,120,0)');
  ctx.fillStyle = wg; ctx.fillRect(sx - 104, y - 24, 122, 44);
}
// The cocks are open on the down stroke, which is when a cylinder full of condensate has
// somewhere to go, so the blast comes once a revolution rather than as a steady leak: a
// machine that exhales on a beat reads as working.
function millEngineSmoke(sx, y, gx) {
  const blow = Math.max(0, Math.sin(engineCrank(gx)));
  // the exhaust bend, which is where a mill engine actually shows: the pipe goes up to the
  // flue and the bend leaks, all day, whatever the crank is doing
  millSmoke(sx - 44, y - 70, { n: 12, rise: 40, rate: 0.32, r0: 7, r1: 28, drift: 12,
    a: 0.4, salt: gx * 5.9, tint: '206,214,226', ceil: SMOKE_CEIL(y), roll: 1.2 });
  for (const dx of [-99, -38]) {
    millSmoke(sx + dx, y - 30, { n: 7, rise: 20, rate: 1.0, r0: 7, r1: 30, drift: dx < -65 ? -44 : 38,
      a: 0.3 * blow, salt: gx + dx, tint: '222,230,240' });
  }
  millSmoke(sx - 34, y - 56, { n: 5, rise: 34, rate: 0.7, r0: 4.4, r1: 17, drift: -11,
    a: 0.15, salt: gx * 1.3, tint: '220,228,240' });
}

// A steam hammer: the loudest thing in the hall, and the one machine in here whose motion
// is a blow rather than a rotation. It takes steam from the same overhead main the engine
// does, so it keeps its own time -- stopping the line shaft does not stop this.
//
// THE VERTICAL BUDGET, written down because it is arithmetic and it was wrong. The hall
// gives a machine 106 units from deck to truss. The stack that has to fit under the crown
// is: the anvil's top face, the work on it, the tup, and the tup's stroke. At a seat of 38
// that came to 38 + 7.6 + 22 + 20 = 87.6 against a crown underside of 75, so the tup drove
// 12.6 units up INSIDE a solid 68-wide casting, twice a second, on every hammer in the
// hall. Nothing in a still frame shows it; the tup simply looks tall.
// Now: SEAT 26 + 7.6 + TUP 22 + STROKE 20 = 75.6 against a crown underside of 79.
// If you change any of these four, check that sum against CROWN before you look at it.
const HAM = { seat: 26, tup: 22, stroke: 20, crownBot: 79, crownTop: 96, work: 7.6 };
function millHammer(sx, y, gx) {
  const DARK = '#100e16', BODY = '#262e30', LIT = '#384345', RIM = 'rgba(198,222,244,0.28)';
  const { lift, since, ph } = hammerStroke(gx);           // since: 0 at the blow, 1 by the lift
  const glow = Math.max(0.46, 1 - since * 0.7);
  // 0.56 is where lift reaches 1 and the tup is at the top of its stroke: the one instant
  // in the cycle when a fresh heat can appear on the anvil without anything inside it
  const bh = (ph >= 0.56 && ph < 0.82) ? HAM.work : HAM.work - 2.4;
  const seat = y - HAM.seat;                              // the anvil's top face
  // The tup hangs off a piston rod. Its lifted position must not depend on what is lying
  // on the anvil -- written as seat - bh - lift*stroke it rose 2.4 units with every fresh
  // billet, 20 units clear of the thing it was tracking.
  const tupB = seat - HAM.work - lift * HAM.stroke + (1 - lift) * (HAM.work - bh);
  const tupT = tupB - HAM.tup;

  // ---- foundation: a timber block under a cast anvil, banded with iron
  contactShadow(sx, y, 54);
  // The anvil has to be the heaviest thing in the frame; at 12 units of block under a tup
  // 22 tall it read as a press. The height comes out of the timber, not the anvil, so the
  // seat stays at 26 and the clearance sum above is untouched.
  ctx.fillStyle = '#1d1613'; ctx.fillRect(sx - 48, y - 9, 96, 9);
  const fgd = ctx.createLinearGradient(0, y - 9, 0, y);
  fgd.addColorStop(0, '#332821'); fgd.addColorStop(1, '#1e1714');
  ctx.fillStyle = fgd; ctx.fillRect(sx - 47, y - 8, 94, 7);
  ctx.fillStyle = 'rgba(255,224,182,0.05)'; ctx.fillRect(sx - 47, y - 8, 94, 1.2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  for (const bx of [-30, 2, 28]) ctx.fillRect(sx + bx, y - 8, 2.4, 7);
  ctx.fillStyle = '#171319'; ctx.fillRect(sx - 48, y - 5, 96, 3.4);
  ctx.fillStyle = '#343c41'; ctx.fillRect(sx - 48, y - 5, 96, 2.2);
  ctx.fillStyle = 'rgba(214,232,248,0.14)'; ctx.fillRect(sx - 48, y - 5, 96, 0.9);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 32, seat - 1, 64, 19);
  const ag = ctx.createLinearGradient(sx - 31, 0, sx + 31, 0);
  ag.addColorStop(0, '#39454a'); ag.addColorStop(0.5, '#283134'); ag.addColorStop(1, '#1d2427');
  ctx.fillStyle = ag; ctx.fillRect(sx - 31, seat, 62, 17);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 31, seat, 62, 1.8);
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(sx - 31, seat + 8, 62, 2.4);
  // the waist and base of the block, so it reads as a casting rather than a slab
  ctx.fillStyle = DARK; ctx.fillRect(sx - 38, seat + 13, 76, 6);
  ctx.fillStyle = '#2b3437'; ctx.fillRect(sx - 37, seat + 13.6, 74, 4.4);
  ctx.fillStyle = 'rgba(206,228,248,0.1)'; ctx.fillRect(sx - 37, seat + 13.6, 74, 1.1);

  // ---- the standards, splayed, with the tup running between them
  for (const d of [-1, 1]) {
    ctx.fillStyle = DARK;
    ctx.beginPath();
    ctx.moveTo(sx + d * 47, y - 8); ctx.lineTo(sx + d * 30, y - 8);
    ctx.lineTo(sx + d * 20, y - 80); ctx.lineTo(sx + d * 30, y - 80); ctx.closePath(); ctx.fill();
    ctx.fillStyle = d < 0 ? '#2c3538' : '#222a2c';
    ctx.beginPath();
    ctx.moveTo(sx + d * 45, y - 9); ctx.lineTo(sx + d * 32.4, y - 9);
    ctx.lineTo(sx + d * 22, y - 79); ctx.lineTo(sx + d * 28.6, y - 79); ctx.closePath(); ctx.fill();
    if (d < 0) {
      ctx.fillStyle = 'rgba(206,228,248,0.16)';
      ctx.beginPath();
      ctx.moveTo(sx - 45, y - 9); ctx.lineTo(sx - 42, y - 9);
      ctx.lineTo(sx - 25, y - 79); ctx.lineTo(sx - 28.6, y - 79); ctx.closePath(); ctx.fill();
    }
    // lightening holes: what makes a casting read as a casting rather than a plank
    for (let i = 0; i < 3; i++) {

    }
  }
  // ---- crown, and the cylinder standing on it
  ctx.fillStyle = DARK; ctx.fillRect(sx - 34, y - HAM.crownTop, 68, HAM.crownTop - HAM.crownBot);
  const cgd = ctx.createLinearGradient(0, y - HAM.crownTop, 0, y - HAM.crownBot);
  cgd.addColorStop(0, '#3b464a'); cgd.addColorStop(0.4, '#283134'); cgd.addColorStop(1, '#1b2224');
  ctx.fillStyle = cgd; ctx.fillRect(sx - 33, y - HAM.crownTop + 1, 66, HAM.crownTop - HAM.crownBot - 2);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 33, y - HAM.crownTop + 1, 66, 1.8);
  rivets(sx - 27, sx + 27, y - HAM.crownBot - 4, 9, 1.1, 'rgba(255,255,255,0.13)');
  // The cylinder runs on up past y-106, where the roof truss takes over. That is not a
  // machine cut off: a stroke of 20 needs more barrel than the ten units left under the
  // truss, and a hammer tall enough to reach into the roof is the right answer to that.
  ctx.fillStyle = DARK; ctx.fillRect(sx - 20, y - 112, 40, 18);
  const vg = ctx.createLinearGradient(sx - 19, 0, sx + 19, 0);

  ctx.fillStyle = vg; ctx.fillRect(sx - 19, y - 112, 38, 17);
  ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.fillRect(sx - 19, y - 96, 38, 2);
  // the bottom cover, so the barrel has an end on it rather than stopping at a line
  ctx.fillStyle = DARK; ctx.fillRect(sx - 24, y - 97, 48, 6);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 23, y - 96.4, 46, 4.4);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 23, y - 96.4, 46, 1.3);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  for (let i = 0; i < 7; i++) ctx.fillRect(sx - 20 + i * 6.4, y - 94.6, 2, 2);
  // Steam IN, off the overhead main. It was claimed in a comment and never drawn: the
  // hammer had an exhaust, no supply, and no belt either, so nothing was driving it.
  ctx.fillStyle = DARK; ctx.fillRect(sx + 18, y - 98, 22, 9); ctx.fillRect(sx + 31, y - 105, 9, 10);
  ctx.fillStyle = '#39424a'; ctx.fillRect(sx + 18, y - 97, 21, 7); ctx.fillRect(sx + 32, y - 105, 7, 9);
  ctx.fillStyle = 'rgba(210,230,240,0.13)'; ctx.fillRect(sx + 18, y - 97, 21, 1.3);
  // exhaust: out of the cylinder side and down the standard. The mouth is 80 above the
  // deck, which against a 45-unit body is nearly two of them -- well overhead, not head
  // height, which is what this comment used to claim.
  ctx.fillStyle = DARK; ctx.fillRect(sx - 44, y - 104, 26, 9); ctx.fillRect(sx - 44, y - 104, 9, 22);
  ctx.fillStyle = '#39424a'; ctx.fillRect(sx - 43, y - 103, 25, 7); ctx.fillRect(sx - 43, y - 103, 7, 21);
  ctx.fillStyle = 'rgba(210,230,240,0.13)'; ctx.fillRect(sx - 43, y - 103, 25, 1.3);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 46, y - 85, 13, 5);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 45, y - 84.4, 11, 3.4);

  // ---- piston rod and tup
  // from the crown's underside, not from the cylinder: the rod passes through the crown

  const rodTop = y - HAM.crownBot - 1;
  ctx.fillStyle = DARK; ctx.fillRect(sx - 5.4, rodTop, 10.8, tupT - rodTop + 3);
  ctx.fillStyle = '#5f6d6a'; ctx.fillRect(sx - 4.4, rodTop, 8.8, tupT - rodTop + 3);
  ctx.fillStyle = 'rgba(230,242,255,0.22)'; ctx.fillRect(sx - 4.4, rodTop, 2.6, tupT - rodTop + 3);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 18, tupT, 36, tupB - tupT);
  const tg = ctx.createLinearGradient(sx - 17, 0, sx + 17, 0);
  tg.addColorStop(0, '#465456'); tg.addColorStop(0.42, '#2e393b'); tg.addColorStop(1, '#1f2729');
  ctx.fillStyle = tg; ctx.fillRect(sx - 17, tupT + 1, 34, tupB - tupT - 2);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 17, tupT + 1, 34, 1.6);
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(sx - 17, tupB - 5, 34, 3.4);
  ctx.fillStyle = '#7c8a8c'; ctx.fillRect(sx - 18, tupB - 3, 36, 2.4);   // the dressed face

  // ---- the work on the anvil: beaten thinner by the blow and glowing back up after it
  ctx.fillStyle = `rgba(${(126 + 70 * glow) | 0},${(34 + 40 * glow) | 0},20,0.92)`;
  ctx.fillRect(sx - 22, seat - bh, 44, bh);
  ctx.fillStyle = `rgba(255,${(142 + 80 * glow) | 0},${(52 + 78 * glow) | 0},${0.42 + 0.5 * glow})`;
  ctx.fillRect(sx - 22, seat + 0.6 - bh, 44, bh * 0.44);
  // scale: the skin goes black first, in patches, and the heat shows between them
  ctx.fillStyle = 'rgba(28,20,20,0.5)';
  for (let i = 0; i < 6; i++) {
    const hv = hash(gx * 1.9 + i * 6.7);
    ctx.fillRect(sx - 21 + i * 7.2, seat - bh + hv * bh * 0.4, 3 + hv * 3.4, bh * 0.4);
  }
  // The fill runs 20 PAST the floor, not to it. The gradient's circle reaches seat+58 and
  // a rect stopping at the deck cut the ramp off with a tenth of its alpha still on it --
  // which in 'lighter' is a hard edge, and worse, a white-hot billet that threw no pool on
  // the deck it stands over. 20 is where millCorridor's clip ends, so nothing escapes.
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createRadialGradient(sx, seat - 2, 2, sx, seat - 2, 60);
  hg.addColorStop(0, `rgba(255,150,58,${0.5 * glow})`);
  hg.addColorStop(0.45, `rgba(255,132,46,${0.16 * glow})`);
  hg.addColorStop(1, 'rgba(255,132,46,0)');
  ctx.fillStyle = hg; ctx.fillRect(sx - 60, seat - 62, 120, 62 + 46);
  ctx.restore();

  // ---- the blow: scale and sparks off the face, thrown flat along the anvil
  if (since < 0.5) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const f = 1 - since / 0.5;
    for (let i = 0; i < 12; i++) {
      const hv = hash(gx + i * 7.1), d = (1 - f) * (16 + hv * 52), sgn = i % 2 ? 1 : -1;
      ctx.globalAlpha = f * 0.9;

      ctx.fillRect(sx + sgn * (9 + d), seat - 2 - d * 0.28 * hv - hv * 3, 2.4, 2.4);
    }
    ctx.globalAlpha = f * 0.55; ctx.fillStyle = '#ffe6bc';
    ctx.fillRect(sx - 26, seat - 1.4, 52, 2.4);
    ctx.restore();
  }
}
// The exhaust blows at the top of the stroke; the work smokes all the time; and the blow
// itself throws one cloud whose whole life is the beat after the hammer lands -- which a
// free-running plume cannot do, because its puffs are spread evenly round the clock.
function millHammerSmoke(sx, y, gx) {
  const { ph, since } = hammerStroke(gx);
  millSmoke(sx - 40, y - 82, { n: 8, rise: 22, rate: 0.95, r0: 5, r1: 27, drift: -40,
    a: 0.46 * Math.max(0, 1 - Math.abs(ph - 0.77) * 4.5), salt: gx * 1.7, tint: '230,235,243',
    ceil: SMOKE_CEIL(y), roll: -1.2 });
  // rise well past the climb, so there is `over` to convert into the sideways run that
  // carries it out from under the crown. At rise 46 against a 45-unit climb it had one
  // unit to spend and stopped dead, leaving the side columns unconnected to anything.
  millSmoke(sx + 2, y - HAM.seat - 6, { n: 10, rise: 96, rate: 0.28, r0: 8, r1: 30, drift: 10,
    a: 0.42, salt: gx * 2.3, tint: '176,169,166', ceil: y - HAM.crownBot + 2, roll: 1.4 });
  // and out past the standards to the roof, which is the only way up that is not straight
  // through the crown casting
  for (const d of [-1, 1]) {
    millSmoke(sx + d * 30, y - HAM.crownBot + 3, { n: 9, rise: 36, rate: 0.26, r0: 9, r1: 33, drift: d * 14,
      a: 0.36, salt: gx * (9.1 + d), tint: '170,164,162', ceil: SMOKE_CEIL(y), roll: d * 1.2 });
  }
  if (since < 1) {
    const img = puffSprite('208,200,196');
    ctx.save();
    for (let i = 0; i < 8; i++) {
      const hv = hash(gx * 3.7 + i * 5.1), sgn = i % 2 ? 1 : -1;
      const r = 7 + since * (26 + hv * 14);
      ctx.globalAlpha = 0.4 * (1 - since) * Math.min(1, since * 8) * (0.6 + hv * 0.6);
      ctx.drawImage(img, sx + sgn * (12 + since * (34 + hv * 26)) - r,
                    y - HAM.seat - 2 - since * (14 + hv * 20) - r, r * 2, r * 2);
    }
    ctx.restore();
  }
}

// A cupola furnace and the blower that keeps it alight. This is the one in the hall that
// is here for the smoke: the hood over the throat catches most of it and the rest rolls
// out round the lip, which is what a cupola under a roof actually does to the air in it.
//
// The order matters twice here. The wall glow goes down BEFORE the shell, or the shell
// turns terracotta and stops reading as iron. The smoke goes down AFTER the hood, or the
// hood -- which is 86 units wide and sits directly over the throat -- hides every puff the
// furnace makes, which is exactly what the first version of this did.
function millCupola(sx, y, gx, shy) {
  const DARK = '#100e16', BODY = '#2b2f36', LIT = '#3d444c', RIM = 'rgba(198,222,244,0.3)';
  const BPUL = 5;                                  // driven pulley; 8 / BPUL is the step-up
  const spin = shaftPhase(gx) * (8 / BPUL) + hash(gx) * 6.28;
  const tap = (S.t * 0.09 + hash(gx * 1.1)) % 1;         // tapped now and then, not always
  const tapping = tap > 0.62 && tap < 0.8;
  const fl = cupolaFlame(gx);                            // the fire, never quite steady

  // ---- the light this thing throws on the wall behind it, before anything is drawn on top
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const wg = ctx.createRadialGradient(sx - 1, y - 42, 4, sx - 1, y - 42, 92);
  wg.addColorStop(0, `rgba(255,146,52,${0.3 * fl})`);
  wg.addColorStop(0.42, `rgba(255,132,46,${0.1 * fl})`);
  wg.addColorStop(1, 'rgba(255,132,46,0)');
  ctx.fillStyle = wg; ctx.fillRect(sx - 94, y - 134, 188, 154);   // 20 past the floor: the ramp ends there, not at the deck
  ctx.restore();

  // ---- bed plate
  contactShadow(sx, y, 52); contactShadow(sx + 72, y, 20);
  ctx.fillStyle = DARK; ctx.fillRect(sx - 46, y - 10, 92, 10);
  ctx.fillStyle = BODY; ctx.fillRect(sx - 45, y - 9, 90, 9);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 45, y - 9, 90, 1.4);
  // ---- the shell: plate, riveted, held round by three bands
  ctx.fillStyle = DARK; ctx.fillRect(sx - 31, y - 68, 62, 59);
  const sg = ctx.createLinearGradient(sx - 30, 0, sx + 30, 0);
  sg.addColorStop(0, '#39414a'); sg.addColorStop(0.42, '#282d34'); sg.addColorStop(1, '#1b1f25');
  ctx.fillStyle = sg; ctx.fillRect(sx - 30, y - 67, 60, 58);
  rivets(sx - 26, sx + 26, y - 56, 9, 1.1, 'rgba(255,255,255,0.12)');
  rivets(sx - 26, sx + 26, y - 22, 9, 1.1, 'rgba(255,255,255,0.09)');
  for (const by of [-61, -31, -13]) {
    ctx.fillStyle = '#15181e'; ctx.fillRect(sx - 32, y + by, 64, 5.4);
    ctx.fillStyle = '#39404a'; ctx.fillRect(sx - 32, y + by, 64, 3.6);
    ctx.fillStyle = 'rgba(210,230,248,0.15)'; ctx.fillRect(sx - 32, y + by, 64, 1.1);
  }
  // charging door, hanging open on its hinge, the fire behind it
  ctx.fillStyle = '#09070c'; ctx.fillRect(sx - 14, y - 53, 25, 21);
  const dg = ctx.createLinearGradient(sx - 14, 0, sx + 11, 0);
  dg.addColorStop(0, `rgba(196,76,22,${0.7 * fl})`);
  dg.addColorStop(0.5, `rgba(255,178,84,${0.92 * fl})`);
  dg.addColorStop(1, `rgba(255,120,36,${0.5 * fl})`);
  ctx.fillStyle = dg; ctx.fillRect(sx - 13, y - 52, 23, 19);
  ctx.fillStyle = `rgba(255,228,170,${0.5 * fl})`; ctx.fillRect(sx - 13, y - 40, 23, 3);

  ctx.fillStyle = DARK; ctx.fillRect(sx + 11, y - 55, 4, 25);
  ctx.fillStyle = LIT; ctx.fillRect(sx + 14, y - 54, 8, 23);
  ctx.fillStyle = RIM; ctx.fillRect(sx + 14, y - 54, 8, 1.4);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const fg = ctx.createRadialGradient(sx - 1, y - 43, 2, sx - 1, y - 43, 30);
  fg.addColorStop(0, `rgba(255,164,70,${0.34 * fl})`); fg.addColorStop(1, 'rgba(255,164,70,0)');
  ctx.fillStyle = fg; ctx.fillRect(sx - 32, y - 74, 64, 84);
  ctx.restore();
  // coke in the mouth, AFTER the bloom: drawn before it, the glow lit the lumps back up
  // and a bed of fuel came out as a row of bread rolls
  ctx.fillStyle = 'rgba(20,11,9,0.82)';
  for (let i = 0; i < 5; i++) {
    const hv = hash(gx + i * 4.3);
    ctx.beginPath(); ctx.arc(sx - 10 + i * 5.4, y - 34 + hv * 2.6, 1.2 + hv * 1, 0, 6.28); ctx.fill();
  }
  // Tap hole and spout, into a sand bed, on the side AWAY from the blower: the blower's
  // foundation is at sx+56 and is drawn after this, so a runner on the right was pouring
  // iron into a block of masonry. Tuyere one side, tap the other.
  ctx.fillStyle = DARK; ctx.fillRect(sx - 56, y - 27, 27, 10);
  ctx.fillStyle = BODY; ctx.fillRect(sx - 55, y - 26, 26, 8);
  ctx.fillStyle = RIM; ctx.fillRect(sx - 55, y - 26, 26, 1.2);
  ctx.fillStyle = '#231e1a'; ctx.fillRect(sx - 74, y - 4, 34, 4);
  if (tapping) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    // an arc, not a plumb line: it leaves the lip with the speed it had in the spout
    for (let i = 0; i < 9; i++) {
      const q = i / 8, px2 = sx - 54 - q * 9, py2 = y - 19 + q * q * 15;
      ctx.fillStyle = 'rgba(255,200,116,0.85)';
      ctx.fillRect(px2 - 1.8, py2, 3.6 + q * 1.4, 3.4);
    }
    ctx.fillStyle = 'rgba(255,152,62,0.55)'; ctx.fillRect(sx - 72, y - 5, 26, 5);
    const tg2 = ctx.createRadialGradient(sx - 60, y - 9, 2, sx - 60, y - 9, 46);
    tg2.addColorStop(0, 'rgba(255,174,74,0.42)'); tg2.addColorStop(1, 'rgba(255,174,74,0)');
    ctx.fillStyle = tg2; ctx.fillRect(sx - 106, y - 55, 92, 75);
    ctx.restore();
    millSmoke(sx - 60, y - 12, { n: 5, rise: 40, rate: 0.5, r0: 4, r1: 17, drift: -14,
      a: 0.22, salt: gx * 3.1, tint: '186,156,128' });
  }
  // ---- throat, hood, flue
  ctx.fillStyle = DARK; ctx.fillRect(sx - 25, y - 74, 50, 7);
  ctx.fillStyle = LIT; ctx.fillRect(sx - 24, y - 73, 48, 5);
  ctx.fillStyle = `rgba(255,150,60,${0.4 * fl})`; ctx.fillRect(sx - 22, y - 75, 44, 2.6);
  ctx.fillStyle = DARK;
  ctx.beginPath();
  ctx.moveTo(sx - 44, y - 77); ctx.lineTo(sx + 44, y - 77);
  ctx.lineTo(sx + 15, y - 94); ctx.lineTo(sx - 15, y - 94); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#272c33';
  ctx.beginPath();
  ctx.moveTo(sx - 42, y - 78.4); ctx.lineTo(sx + 42, y - 78.4);
  ctx.lineTo(sx + 14, y - 93); ctx.lineTo(sx - 14, y - 93); ctx.closePath(); ctx.fill();
  ctx.fillStyle = RIM;
  ctx.beginPath();
  ctx.moveTo(sx - 42, y - 78.4); ctx.lineTo(sx - 34, y - 78.4);
  ctx.lineTo(sx - 13, y - 93); ctx.lineTo(sx - 14, y - 93); ctx.closePath(); ctx.fill();
  ctx.fillStyle = DARK; ctx.fillRect(sx - 16, y - 116, 32, 23);
  ctx.fillStyle = '#31363d'; ctx.fillRect(sx - 15, y - 116, 30, 23);
  ctx.fillStyle = 'rgba(210,230,248,0.11)'; ctx.fillRect(sx - 15, y - 116, 4, 23);


  // ---- the blower: a volute with the fan turning behind its port, and the blast pipe
  const bx = sx + 72, by = y - 34;
  ctx.fillStyle = DARK; ctx.fillRect(sx + 56, y - 15, 32, 15);
  ctx.fillStyle = BODY; ctx.fillRect(sx + 57, y - 14, 30, 14);
  ctx.fillStyle = RIM; ctx.fillRect(sx + 57, y - 14, 30, 1.3);
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(bx, by, 24, 0, 6.28); ctx.fill();
  const vg = ctx.createLinearGradient(bx - 24, 0, bx + 24, 0);
  vg.addColorStop(0, '#3b434c'); vg.addColorStop(0.5, '#292f37'); vg.addColorStop(1, '#1d2229');
  ctx.fillStyle = vg; ctx.beginPath(); ctx.arc(bx, by, 22.4, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(206,228,250,0.2)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(bx, by, 22.4, Math.PI * 1.02, Math.PI * 1.9); ctx.stroke();
  // blast pipe across to the tuyere in the shell
  ctx.fillStyle = DARK; ctx.fillRect(sx + 30, y - 41, 26, 12);
  ctx.fillStyle = '#333b43'; ctx.fillRect(sx + 30, y - 40, 26, 10);
  ctx.fillStyle = 'rgba(210,230,248,0.13)'; ctx.fillRect(sx + 30, y - 40, 26, 1.4);
  ctx.fillStyle = DARK; ctx.fillRect(sx + 27, y - 43, 6, 16);
  ctx.fillStyle = LIT; ctx.fillRect(sx + 28, y - 42, 4, 14);
  // the fan, through its inspection port, with the smear a fast wheel leaves
  ctx.fillStyle = '#0b090f'; ctx.beginPath(); ctx.arc(bx, by, 14.6, 0, 6.28); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.arc(bx, by, 14.2, 0, 6.28); ctx.clip();
  for (const [w, col] of [[3.4, '#49535c'], [1.1, 'rgba(214,234,252,0.16)']]) {
    ctx.strokeStyle = col; ctx.lineWidth = w;
    for (let i = 0; i < 8; i++) {
      const th = spin + i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(th) * 4.6, by + Math.sin(th) * 4.6);
      ctx.lineTo(bx + Math.cos(th + 0.5) * 14, by + Math.sin(th + 0.5) * 14);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(150,168,182,0.07)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(bx, by, 9.6, 0, 6.28); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = DARK; ctx.beginPath(); ctx.arc(bx, by, 5, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#545d66'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(bx, by, 14.4, 0, 6.28); ctx.stroke();
  // The countershaft: a bracket OFF to the side, not a bar down the middle of the port.
  ctx.fillStyle = DARK; ctx.fillRect(bx + 15, y - 64, 7, 26);
  ctx.fillStyle = BODY; ctx.fillRect(bx + 16, y - 63, 5, 25);
  ctx.fillStyle = DARK; ctx.fillRect(bx - 2, y - 65, 24, 6);
  ctx.fillStyle = BODY; ctx.fillRect(bx - 1, y - 64, 22, 4.4);
  ctx.fillStyle = 'rgba(214,230,248,0.13)'; ctx.fillRect(bx - 1, y - 64, 22, 1.1);
  // the belt down from it to the fan shaft. Same size at both ends, so the step-up is all
  // in the first belt and one ratio describes the whole train.
  ctx.save(); ctx.lineCap = 'butt';
  for (const d of [-1, 1]) {
    ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 3.4;
    ctx.beginPath(); ctx.moveTo(bx + d * BPUL, y - 62); ctx.lineTo(bx + d * BPUL, by); ctx.stroke();
    ctx.strokeStyle = d < 0 ? '#2e241a' : '#3c2d20'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(bx + d * BPUL, y - 62); ctx.lineTo(bx + d * BPUL, by); ctx.stroke();
  }
  ctx.restore();
  for (const py of [y - 62, by]) {
    ctx.fillStyle = '#131118'; ctx.beginPath(); ctx.arc(bx, py, BPUL + 1.6, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#343742'; ctx.beginPath(); ctx.arc(bx, py, BPUL, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'rgba(206,224,244,0.22)'; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.arc(bx, py, BPUL, 3.4, 5.5); ctx.stroke();
    ctx.fillStyle = 'rgba(224,206,160,0.3)';
    ctx.beginPath(); ctx.arc(bx + Math.cos(spin) * (BPUL - 1.6), py + Math.sin(spin) * (BPUL - 1.6), 1.2, 0, 6.28); ctx.fill();
  }
  void shy;
}
// What the hood misses rolls out round both lips, climbs the outside of the flue and then
// spreads along the underside of the roof. Drawn over the hood, not under it: the hood is
// 86 units wide and sits directly over the throat, so every puff made underneath it was
// hidden by it, which is what the first pass at this did.
//
// MEASURED, because looking at a play-zoom frame and saying "I cannot see any smoke" is
// the failure this repo already has a note about. Lane 0 cupola at wx 4585, zoom 0.696,
// S.t frozen, 25x11 patches averaged, each taken with the smoke pass on and then off, and
// the whole set repeated -- deltas in luminance:
//
