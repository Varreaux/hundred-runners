<script>

// ================================================================ config
const W = 960, H = 540;

const CFG = {

  packBack: 120, packFront: 540,   // the pack holds slots in this band ahead of the camera anchor

CFG.exit = CFG.finale.x - 10;
const laneY = k => CFG.baseY - CFG.laneGap * k;
// where each tunnel exists: tunnel 0 runs the whole mountain, others exist between their fork and merge
const LANE_SPANS = [];
for (let k = 0; k < CFG.laneCount; k++) LANE_SPANS.push(k === 0 ? [[CFG.entrance - 20, CFG.exit + 20]] : CFG.forks.filter(f => f.to === k).map(f => [f.x + CFG.rampLen, f.merge]));
const laneAt = (k, x) => LANE_SPANS[k].some(([a, b]) => x >= a && x <= b);

const LINES = {

const WORDS = {

// ================================================================ helpers
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.lineJoin = 'round'; ctx.lineCap = 'round';
const rand = (a, b) => a + Math.random() * (b - a);
const pick = s => s[Math.floor(Math.random() * s.length)];
const clamp01 = v => Math.max(0, Math.min(1, v));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const SKIN = ['#ecd0b0', '#e0b899', '#c68642', '#8d5524'];
const SHIRT = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#ecf0f1', '#ff7eb6'];
const PANTS = ['#2c3e50', '#34495e', '#5d6d7e', '#1f2a44', '#6e4b2a'];
const HAIR = ['#2b1b0e', '#e6c46b', '#8b2500', '#111111', '#b5651d', '#8c8c98'];
function makeSeq(n) {
  const s = []; let last = '';
  while (s.length < n) { const k = pick(CFG.keyPool); if (k !== last) { s.push(k); last = k; } }
  return s;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const INK = '#1b1519';
function shade(hex, f = 0.72) {
  const n = parseInt(hex.slice(1), 16);
  return `rgb(${((n >> 16) & 255) * f | 0},${((n >> 8) & 255) * f | 0},${(n & 255) * f | 0})`;
}
let grainCanvas = null;
function grain() {
  if (grainCanvas) return grainCanvas;
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (Math.random() * 2 - 1) * 70; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return grainCanvas = c;
}
function loadBest() { try { return +localStorage.getItem('hr_best') || 0; } catch (e) { return 0; } }
function saveBest(n) { try { if (n > loadBest()) localStorage.setItem('hr_best', String(n)); } catch (e) {} }

// ================================================================ view: camera anchor, zoom, world <-> screen
// The world is drawn scaled by V.zoom with the river pinned to the bottom of the screen.
const V = { left: 0, zoom: 1, vw: W };
function updateView(dt) {
  V.vw = W / V.zoom;
  V.left = S.cam + CFG.packFront - 0.64 * V.vw;
  // zoom out so every tunnel active in view fits
  let top = 0;
  for (let k = 1; k < CFG.laneCount; k++) {
    if (LANE_SPANS[k].some(([a, b]) => b > V.left - 100 && a < V.left + V.vw + 250)) top = k;
  }
  const minY = laneY(top) - CFG.tunnelH - 60;
  const target = Math.min(1, (H - 46) / (CFG.worldBottom - minY));
  V.zoom += (target - V.zoom) * Math.min(1, dt * 1.6);
}
const toScreen = (wx, wy) => [(wx - V.left) * V.zoom, H + (wy - CFG.worldBottom) * V.zoom];
const inView = (wx, margin = 100) => wx > V.left - margin && wx < V.left + V.vw + margin;

// ================================================================ mini-game verbs
const VERBS = {
  keys: {
    hint: 'hit the highlighted keys in order',
    start(diff) { return { seq: makeSeq(2 + diff), idx: 0 }; },
    key(m, k) {
      if (!CFG.keyPool.includes(k)) return null;
      if (k === m.seq[m.idx]) { m.idx++; return m.idx >= m.seq.length ? 'done' : 'ok'; }
      m.idx = 0; return 'wrong';
    },
    update() {},
    progress(m) { return m.idx / m.seq.length; },
    draw(m, px, py, pw) { drawKeyBoxes(m.seq, m.idx, px, py, pw); },
  },
  bar: {
    hint: 'SPACE when the marker is in the green',
    start(diff) {
      const m = { pos: 0, dir: 1, speed: 0.9 + 0.12 * diff, zoneW: 0.3 - 0.025 * diff, zone: 0, hits: 0, need: [1, 2, 2, 2, 3][diff - 1] };
      m.zone = rand(0.15, 0.85 - m.zoneW); return m;
    },
    key(m, k) {
      if (k !== ' ') return null;
      if (m.pos >= m.zone && m.pos <= m.zone + m.zoneW) {
        m.hits++; m.zone = rand(0.1, 0.9 - m.zoneW);
        return m.hits >= m.need ? 'done' : 'ok';
      }
      return 'wrong';
    },
    update(m, dt) {
      m.pos += m.dir * m.speed * dt;
      if (m.pos > 1) { m.pos = 2 - m.pos; m.dir = -1; }
      if (m.pos < 0) { m.pos = -m.pos; m.dir = 1; }
    },
    progress(m) { return m.hits / m.need; },
    draw(m, px, py, pw) {
      const tx = px + 28, tw = pw - 56, ty = py + 46;
      ctx.fillStyle = '#2a2d3a'; roundRect(tx, ty, tw, 20, 6); ctx.fill();
      ctx.fillStyle = '#2ecc71'; ctx.fillRect(tx + tw * m.zone, ty, tw * m.zoneW, 20);
      const mx = tx + tw * m.pos;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(mx, ty - 2); ctx.lineTo(mx - 7, ty - 12); ctx.lineTo(mx + 7, ty - 12); ctx.fill();
      ctx.fillRect(mx - 1.5, ty - 2, 3, 24);
      for (let i = 0; i < m.need; i++) {
        ctx.fillStyle = i < m.hits ? '#2ecc71' : '#444';
        ctx.beginPath(); ctx.arc(px + pw / 2 + (i - (m.need - 1) / 2) * 18, ty + 34, 5, 0, 6.28); ctx.fill();
      }
    },
  },
  word: {
    hint: 'type the word',
    start(diff) { const len = [4, 5, 5, 6, 7][diff - 1]; return { word: pick(WORDS[len]), idx: 0 }; },
    key(m, k) {
      if (k.length !== 1 || k < 'A' || k > 'Z') return null;
      if (k === m.word[m.idx]) { m.idx++; return m.idx >= m.word.length ? 'done' : 'ok'; }
      m.idx = 0; return 'wrong';
    },
    update() {},
    progress(m) { return m.idx / m.word.length; },
    draw(m, px, py, pw) { drawKeyBoxes(m.word.split(''), m.idx, px, py, pw); },
  },
};

// ================================================================ sound (all synthesised in code, no audio files)
const AU = {
  ctx: null, master: null, muted: false, rumble: null, stepGain: null, white: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.5; this.master.connect(c.destination);
    this.white = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = this.white.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // deep rumble inside the mountain
    const brown = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), bd = brown.getChannelData(0);
    let last = 0; for (let i = 0; i < bd.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
    const src = c.createBufferSource(); src.buffer = brown; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 90;
    this.rumble = c.createGain(); this.rumble.gain.value = 0;
    src.connect(lp); lp.connect(this.rumble); this.rumble.connect(this.master); src.start();
    // footsteps: band-limited noise pulsed per frame by the crowd size
    const src2 = c.createBufferSource(); src2.buffer = this.white; src2.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.7;
    this.stepGain = c.createGain(); this.stepGain.gain.value = 0;
    src2.connect(bp); bp.connect(this.stepGain); this.stepGain.connect(this.master); src2.start();
  },
  tone(type, f0, f1, dur, gain = 0.2, delay = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, gain = 0.2, filt = null, delay = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + delay, src = c.createBufferSource(), g = c.createGain();
    src.buffer = this.white;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    let node = src;
    if (filt) { const f = c.createBiquadFilter(); f.type = filt[0]; f.frequency.value = filt[1]; f.Q.value = filt[2] || 1; src.connect(f); node = f; }
    node.connect(g); g.connect(this.master); src.start(t); src.stop(t + dur + 0.02);
  },
  arm() { this.tone('sawtooth', 660, 880, 0.12, 0.1); this.tone('sawtooth', 880, 660, 0.14, 0.08, 0.12); },
  tick(p) { const f = 480 + p * 420; this.tone('square', f, f, 0.06, 0.07); },
  wrong() { this.tone('sawtooth', 140, 90, 0.18, 0.14); },
  thud() { this.tone('sine', 70, 40, 0.35, 0.5); this.noise(0.15, 0.2, ['lowpass', 400]); },
  clank() { this.tone('square', 240, 180, 0.1, 0.12); this.noise(0.12, 0.2, ['highpass', 2000]); },
  splash() { this.noise(0.35, 0.22, ['bandpass', 1800, 0.8]); },
  scream() { this.tone('sawtooth', 900 + Math.random() * 300, 380, 0.3, 0.045); },
  boom() { this.tone('sine', 50, 28, 0.9, 0.7); this.noise(0.5, 0.35, ['lowpass', 250]); },
  rocks() { this.noise(0.25, 0.3, ['lowpass', 500]); this.tone('sine', 60, 40, 0.25, 0.3); },
  cheer(n) { for (let i = 0; i < 3; i++) { const f = 440 * Math.pow(1.26, i) * (1 + Math.min(n, 8) * 0.06); this.tone('triangle', f, f * 1.5, 0.35, 0.08, i * 0.06); } },
  fail() { this.tone('sawtooth', 200, 60, 0.5, 0.22); },
  ambient(inside, running, near, dt) {
    if (!this.ctx) return;
    if (this.muted) { this.rumble.gain.value = 0; this.stepGain.gain.value = 0; return; }
    const target = (inside ? 0.35 : 0.05) + (near ? 0.35 : 0);
    this.rumble.gain.value += (target - this.rumble.gain.value) * Math.min(1, dt * 1.5);
    const pulse = Math.pow(Math.max(0, Math.sin(S.t * 22)), 6);
    this.stepGain.gain.value = (running / 100) * 0.06 * pulse * (inside ? 1 : 0.6);
  },
};

// ================================================================ particles
// Each kind carries its own gravity, drag, size curve, shape and blend, so one
// emitter covers water, dust, sparks, embers, smoke, stone chips and light motes.
const PK = {
  drop:  { g: 640, drag: 0.03, r0: 2.4, r1: 0.5, add: false, shape: 'drop' },
  dust:  { g: 26,  drag: 1.8,  r0: 1.6, r1: 6,   add: false, shape: 'puff' },
  smoke: { g: -16, drag: 1.3,  r0: 3,   r1: 15,  add: false, shape: 'puff' },
  ember: { g: -30, drag: 0.8,  r0: 1.7, r1: 0.3, add: true,  shape: 'dot' },
  spark: { g: 340, drag: 0.9,  r0: 1.9, r1: 0.15, add: true, shape: 'streak' },
  chip:  { g: 800, drag: 0.15, r0: 2.8, r1: 2.4, add: false, shape: 'chip' },
  mote:  { g: -2,  drag: 0.3,  r0: 1.0, r1: 1.0, add: true,  shape: 'dot' },
  grit:  { g: 520, drag: 0.1,  r0: 1.5, r1: 0.9, add: false, shape: 'dot' },
};
const PCAP = 420;
function emit(k, n, x, y, o = {}) {
  n = Math.min(n, PCAP - S.particles.length);
  if (n <= 0) return;
  const vx = o.vx || [-30, 30], vy = o.vy || [-60, -10], lf = o.life || [0.4, 0.9];
  for (let i = 0; i < n; i++) {
    const life = rand(lf[0], lf[1]);
    S.particles.push({
      k, x: x + rand(-(o.sx || 0), o.sx || 0), y: y + rand(-(o.sy || 0), o.sy || 0),
      vx: rand(vx[0], vx[1]), vy: rand(vy[0], vy[1]),
      life, max: life, c: o.c || '#a08c70', sz: o.sz || 1, rot: rand(0, 6.28), rv: rand(-7, 7),
    });
  }
}
// an expanding ring: shockwaves at armed rooms, light bursts when one is solved, splash crowns
function ring(x, y, r1, life, c, w = 4, sq = 1) {
  S.rings.push({ x, y, r0: 4, r1, life, max: life, c, w, sq });
}
function solveBurst(room) {
  const cx = room.x + CFG.gapWidth / 2, y = laneY(room.lane);
  ring(cx, y - 24, 96, 0.38, '#ffd27a', 3, 0.42);
  emit('spark', 11, cx, y - 6, { sx: CFG.gapWidth / 2, vx: [-60, 60], vy: [-200, -70], life: [0.35, 0.8], c: '#ffe0a0' });
  emit('dust', 6, cx, y - 2, { sx: CFG.gapWidth / 2, vx: [-30, 30], vy: [-30, -6], life: [0.5, 0.9], c: 'rgba(160,140,112,0.45)' });
  room.flash = 1;
}
// idle life in the tunnels: embers off the lanterns, dust motes turning in the light
function ambient(dt) {
  if (V.zoom < 0.3) return;
  S.ambT -= dt;
  if (S.ambT > 0) return;
  S.ambT = 0.06;
  const lit = [];
  for (let wx = Math.ceil((V.left - 100) / 240) * 240; wx < V.left + V.vw + 100; wx += 240) {
    for (let k = 0; k < CFG.laneCount; k++) {
      const lx = wx + k * 40;
      if (laneAt(k, lx) && Math.abs(lx - CFG.entrance) > 80 && Math.abs(lx - CFG.exit) > 80) lit.push([lx, laneY(k) - CFG.tunnelH + 2]);
    }
  }
  if (!lit.length) return;
  const [lx, ly] = pick(lit);
  emit('ember', 1, lx, ly + 13, { sx: 2, vx: [-7, 7], vy: [-28, -12], life: [0.7, 1.5], c: '#ffb457' });
  if (Math.random() < 0.7) emit('mote', 1, lx + rand(-80, 80), ly + rand(20, 100), { vx: [-5, 5], vy: [-4, 4], life: [1.6, 3.2], c: 'rgba(255,214,150,0.5)' });
}

// ================================================================ state
let S;
function reset() {
  S = {
    mode: 'title', t: 0, cam: 0, camMax: CFG.finale.x - 480, paused: false,
    runners: [], rooms: [], gates: [], active: null, wrongFlash: 0, shake: 0,
    particles: [], rings: [], floaters: [], ripples: [], bubbles: [], sayT: 0, lastWordT: 0, ambT: 0,
    stats: { dead: 0, arrived: 0 },
    finale: null, best: loadBest(), rollBottom: 254,
    collapseX: CFG.collapseLead, recent: [], spike: null, spikeCool: 0, streak: 0, bestStreak: 0, lastScream: 0,
  };
  for (let i = 0; i < CFG.runnerCount; i++) {
    S.runners.push({
      x: 0, slot: rand(CFG.packBack, CFG.packFront), jit: rand(0, 6.28), jitAmp: rand(8, CFG.jitter),
      dy: rand(-22, 22), y: laneY(0),
      skin: pick(SKIN), shirt: pick(SHIRT), pants: pick(PANTS), hair: pick(HAIR), hairStyle: Math.floor(Math.random() * 4),
      name: null,
      phase: Math.random() * 6.28,
      state: 'run', vy: 0, fy: 0, rot: 0, fallLimit: 70, hop: 0, rolled: null, fs: false, squash: 0,
      lane: 0, lastForkX: -1, route: [], ramp: null, held: false,
    });
  }
  for (const r of S.runners) r.x = r.slot;
  // deal every name to a different runner
  const deck = S.runners.slice();
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  CFG.names.forEach((nm, i) => { if (deck[i]) deck[i].name = nm; });
  for (const r of CFG.rooms) {
    const t = CFG.types[r.type];
    S.rooms.push({ ...r, verb: t.verb, hazard: t.hazard, title: t.title, color: t.color,
                   hot: null, mg: null, state: 'dormant', bridge: 0, deaths: 0, flash: 0, slamT: rand(0, CFG.crusherPeriod) });
  }
  for (const x of CFG.gates) S.gates.push({ x, state: 'dormant', holdT: 0, trampleT: 0, deaths: 0 });
  V.zoom = 1; V.left = 0; V.vw = W;
}
function armRoom(room) {
  const used = new Set(S.rooms.filter(r => r.state === 'armed').map(r => r.hot));
  let n = 1; while (used.has(n) && n < 9) n++;
  room.hot = n; room.mg = VERBS[room.verb].start(room.diff); room.state = 'armed';
  AU.arm();
  // the room wakes: a shockwave and dust shaken off the ceiling
  ring(room.x + CFG.gapWidth / 2, laneY(room.lane) - 34, 74, 0.4, room.color, 3, 0.5);
  emit('dust', 8, room.x + CFG.gapWidth / 2, laneY(room.lane) - CFG.tunnelH + 8, { sx: 60, vx: [-10, 10], vy: [12, 52], life: [0.6, 1.2], c: 'rgba(122,110,102,0.5)' });
}
// a room resolved with nobody lost: the streak grows
function cleanRoom(room) {
  S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak);
  S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 120, txt: S.streak > 1 ? `CLEAN x${S.streak}` : 'CLEAN', life: 1.4, color: '#2ecc71', big: S.streak > 1 });
  emit('spark', 7 + Math.min(9, S.streak), room.x + CFG.gapWidth / 2, laneY(room.lane) - 26, { sx: 34, vx: [-46, 46], vy: [-230, -120], life: [0.45, 0.95], c: '#8affbc' });
  AU.cheer(S.streak);
}
function say(r, pool, life = 2.2, pinned = false) {
  if (S.bubbles.some(b => b.r === r)) return;
  const used = new Set(S.bubbles.map(b => b.txt));
  const fresh = LINES[pool].filter(l => !used.has(l));
  S.bubbles.push({ r, wx: r.x, wy: footY(r) - (r.name ? 36 : 33), txt: pick(fresh.length ? fresh : LINES[pool]), life, max: life, pinned });
}
function killRunner(r, how) {
  r.state = 'dead'; S.stats.dead++; S.shake = Math.min(5, S.shake + 1.2);
  S.recent.push(S.t); if (S.spike) S.spike.n++;
  if (S.streak > 0) { S.streak = 0; S.floaters.push({ sx: W / 2, sy: 200, txt: 'STREAK LOST', life: 1, color: '#ff9a3c' }); }
  if (how === 'splash') AU.splash(); else if (how === 'buried') AU.rocks(); else AU.noise(0.1, 0.18, ['lowpass', 300]);
  if (S.t - S.lastScream > 0.2 && Math.random() < 0.6) { S.lastScream = S.t; AU.scream(); }
  if (how !== 'splash' && how !== 'dark' && Math.random() < 0.4 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; say(r, how === 'crush' ? 'crush' : 'trample', 1.3); }
  if (how === 'splash') splash(r.x, CFG.riverY);
  else if (how === 'dark') dust(r.x, r.y + 50, '#3a3040');
  else if (how === 'buried') { dust(r.x, r.y - 20, '#6b5a4a'); dust(r.x, r.y - 60, '#4a3f3a'); }
  else dust(r.x, r.y - 6, '#c0392b');
  S.floaters.push({ wx: r.x, wy: r.y - 10, txt: r.name ? `-${r.name}` : '-1', life: r.name ? 1.4 : 0.8, color: '#ff6b6b' });
}

// ================================================================ input
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toUpperCase();
  if (k === ' ' || k === 'ENTER') e.preventDefault();
  AU.init();
  if (k === 'M' && !S.active) { AU.muted = !AU.muted; return; }
  if (S.mode === 'title') { if (k === ' ') S.mode = 'play'; return; }
  if (S.mode === 'win' || S.mode === 'lose') { if (k === 'R') { reset(); S.mode = 'play'; } return; }
  if (S.paused) { if (k === 'P') S.paused = false; else if (k === 'R') { reset(); S.mode = 'play'; } return; }
  if (k === 'P' && !S.active) { S.paused = true; return; }
  if (S.mode === 'play') {
    if (k >= '1' && k <= '9') {
      const room = S.rooms.find(r => r.state === 'armed' && r.hot === +k);
      if (room) S.active = room;
      return;
    }
    if (k === 'ENTER') { toggleGate(); return; }
    if (k === 'ESCAPE') { S.active = null; return; }
    const room = S.active;
    if (!room) return;
    const res = VERBS[room.verb].key(room.mg, k);
    if (res === 'done') {
      room.state = 'solved'; S.active = null; AU.thud(); solveBurst(room);
      if (room.deaths === 0) cleanRoom(room);
      else S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 100, txt: 'CLEAR', life: 1, color: '#2ecc71' });
    } else if (res === 'wrong') { S.wrongFlash = 0.25; AU.wrong(); }
    else if (res === 'ok') AU.tick(VERBS[room.verb].progress(room.mg));
  }
  if (S.mode === 'finale') {
    const f = S.finale;
    if (!CFG.keyPool.includes(k)) return;
    if (k === f.seq[f.idx]) {
      f.idx++; f.timer = CFG.finale.keyTime; AU.tick(f.idx / f.len);
      if (f.idx >= f.len) { S.mode = 'win'; saveBest(f.attempts); }
    } else finaleFail();
  }
});
function toggleGate() {
  const holding = S.gates.find(g => g.state === 'holding');
  if (holding) { holding.state = 'spent'; releaseGate(holding, 1 + CFG.tire * (S.cam / S.camMax)); AU.clank(); return; }
  const armed = S.gates.filter(g => g.state === 'armed').sort((a, b) => a.x - b.x)[0];
  if (armed) { armed.state = 'holding'; armed.holdT = 0; armed.trampleT = 0; AU.clank(); }
}
// when a gate opens, the people it held keep their new place in the pack instead of sprinting back to their old slot
function releaseGate(g, spread) {
  for (const r of S.runners) {
    if (r.state !== 'run' || !r.held) continue;
    const wander = Math.sin(S.t * 0.7 + r.jit) * r.jitAmp;
    r.slot = CFG.packFront - (S.cam + CFG.packFront + wander - r.x) / spread;
    r.held = false;
  }
}
function finaleFail() {
  const f = S.finale;
  f.attempts--; f.idx = 0; f.timer = CFG.finale.keyTime; S.wrongFlash = 0.4; S.shake = 6; AU.fail();
  f.seq = makeSeq(f.len);
  const r = f.line.pop();
  if (r) { r.state = 'gone'; f.leaving.push({ r, t: 0 }); }
  S.floaters.push({ sx: W / 2, sy: H / 2 - 40, txt: r && r.name ? `${r.name} IS LOST` : 'ATTEMPT LOST', life: 1.2, color: '#ff5555', big: true });
  if (f.attempts <= 0) S.mode = 'lose';
}

// ================================================================ update
function update(dt) {
  if (S.paused) return;
  S.t += dt;
  S.wrongFlash = Math.max(0, S.wrongFlash - dt);
  S.shake = Math.max(0, S.shake - dt * 14);
  updateFx(dt);
  for (const r of S.runners) { r.phase += dt * 14; r.hop = Math.max(0, r.hop - dt); r.squash = Math.max(0, r.squash - dt * 7); }
  if (S.mode === 'finale') {
    const f = S.finale;
    f.timer -= dt;
    for (const l of f.leaving) l.t += dt;
    if (f.timer <= 0) finaleFail();
    updateView(dt);
    return;
  }
  if (S.mode !== 'play') { updateView(dt); return; }

  S.cam = Math.min(S.camMax, S.cam + CFG.scroll * dt);
  updateView(dt);
  const camStopped = S.cam >= S.camMax;
  S.collapseX += CFG.scroll * dt;
  S.recent = S.recent.filter(t => S.t - t < 1);
  if (!S.spike && S.spikeCool <= 0 && S.recent.length >= 5) {
    S.spike = { t: 0.7, n: S.recent.length }; S.recent.length = 0; S.spikeCool = CFG.spikeCooldown; S.shake = 8; AU.boom();
  }
  const inside = S.cam + CFG.packFront > CFG.entrance && S.cam + CFG.packFront < CFG.exit;
  let nearest = 1e9; for (const r of S.runners) if (r.state === 'run') nearest = Math.min(nearest, r.x - S.collapseX);
  if (S.collapseX > CFG.entrance && nearest < 140) {
    S.shake = Math.max(S.shake, 0.8);
    // one buried tunnel per frame throws rubble, so six lanes cannot flood the particle pool
    const buried = [];
    for (let k = 0; k < CFG.laneCount; k++) if (laneAt(k, S.collapseX)) buried.push(k);
    if (buried.length && inView(S.collapseX, 160)) {
      const k = pick(buried);
      emit('chip', 2, S.collapseX + 10, laneY(k) - rand(0, CFG.tunnelH), { sx: 20, vx: [20, 95], vy: [-30, 45], life: [0.4, 0.9], c: '#6b5a4a' });
      emit('dust', 1, S.collapseX + 14, laneY(k) - rand(10, CFG.tunnelH), { sx: 16, vx: [10, 60], vy: [-14, 20], life: [0.7, 1.4], c: 'rgba(120,104,92,0.5)' });
    }
  }
  AU.ambient(inside, S.runners.filter(r => r.state === 'run').length, S.collapseX > CFG.entrance && nearest < 140, dt);
  const spread = 1 + CFG.tire * (S.cam / S.camMax);
  if (S.active) VERBS[S.active.verb].update(S.active.mg, dt);
  const holdGate = S.gates.find(g => g.state === 'holding');

  for (const r of S.runners) {
    if (r.state === 'run') {
      if (camStopped) r.x += CFG.scroll * dt;
      else {
        const target = S.cam + CFG.packFront - (CFG.packFront - r.slot) * spread + Math.sin(S.t * 0.7 + r.jit) * r.jitAmp;
        const rel = Math.max(-80, Math.min(80, (target - r.x) * 2));
        r.x += (CFG.scroll + rel) * dt;
      }
      if (holdGate && r.x >= holdGate.x - 34 && r.x < holdGate.x + 6) { r.x = Math.min(r.x, holdGate.x - 8 - Math.abs(r.dy) * 1.2); r.held = true; }
      else r.held = false;
      // footfall: a puff of dust off the back foot and a beat of squash
      const step = Math.sin(r.phase) > 0;
      if (step !== r.fs) {
        r.fs = step; r.squash = 1;
        if (!r.held && V.zoom > 0.34 && inView(r.x, 40) && Math.random() < 0.6)
          emit('dust', 1, r.x - 3, footY(r) + 2, { vx: [-30, -6], vy: [-20, -5], life: [0.3, 0.6], c: 'rgba(196,180,160,0.6)', sz: 1.1 });
      }
      if (r.x >= CFG.finale.x - 40) { r.state = 'arrived'; S.stats.arrived++; continue; }
      if (S.collapseX > CFG.entrance && r.x < S.collapseX) { killRunner(r, 'buried'); continue; }
      updateLane(r);
      for (const room of S.rooms) {
        if (room.lane !== r.lane || room.state === 'solved') continue;
        if (r.x < room.x + 8 || r.x >= room.x + CFG.gapWidth) continue;
        if (room.hazard === 'burst') continue;
        if (room.hazard === 'half') { if (r.rolled === room) continue; r.rolled = room; if (Math.random() < 0.5) continue; }
        r.state = 'fall'; r.vy = 0; r.fy = 0; r.fallLimit = r.lane === 0 ? CFG.riverY - r.y : 60; room.deaths++;
        r.rotRate = rand(1.5, 3.5) * (Math.random() < 0.5 ? -1 : 1); r.vx0 = CFG.scroll * 0.3; r.rv0 = r.rotRate;
        if (Math.random() < 0.35 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; S.bubbles = S.bubbles.filter(b => b.r !== r); say(r, 'fall', 1.4, true); }
        break;
      }
    } else if (r.state === 'fall') {
      r.vy += 900 * dt; r.fy += r.vy * dt; r.rot += (r.rotRate || 6) * dt; r.x += CFG.scroll * 0.3 * dt;
      if (r.fy > r.fallLimit) killRunner(r, r.lane === 0 ? 'splash' : 'dark');
    }
  }

  for (const room of S.rooms) {
    if (room.state === 'dormant') {
      const near = S.runners.some(r => r.state === 'run' && r.lane === room.lane && r.x >= room.x - CFG.armDist);
      if (near) armRoom(room);
    }
    // nobody left who can reach it: close it, whether it was fixed or not
    if (room.state === 'armed' && !S.runners.some(r => (r.state === 'run' || r.state === 'fall') && canReach(r, room))) {
      room.state = 'passed';
      if (S.active === room) S.active = null;
      if (room.deaths) S.floaters.push({ wx: room.x + CFG.gapWidth / 2, wy: laneY(room.lane) - 100, txt: 'TOO LATE', life: 1.2, color: '#ff8a8a' });
      else cleanRoom(room);
    }
    if (room.state === 'solved') room.bridge = Math.min(1, room.bridge + dt * 3.5);
    room.flash = Math.max(0, room.flash - dt * 1.8);
    if (room.hazard === 'burst' && room.state !== 'solved') {
      const before = room.slamT; room.slamT += dt;
      if (before < 0.78 && room.slamT >= 0.78 && inView(room.x, 120)) {
        emit('grit', 7, room.x + 60, laneY(room.lane) - CFG.tunnelH + 16, { sx: 26, vx: [-12, 12], vy: [20, 70], life: [0.4, 0.7], c: '#9a8d80' });
        emit('chip', 3, room.x + 60, laneY(room.lane) - CFG.tunnelH + 16, { sx: 22, vx: [-24, 24], vy: [10, 40], life: [0.5, 0.9], c: '#6f6459' });
      }
      if (before < 1.0 && room.slamT >= 1.0) {
        if (inView(room.x, 0)) AU.thud();
        for (const r of S.runners) {
          if (r.state === 'run' && r.lane === room.lane && r.x >= room.x + 35 && r.x < room.x + 85) { killRunner(r, 'crush'); room.deaths++; }
        }
      }
      if (room.slamT >= CFG.crusherPeriod) room.slamT -= CFG.crusherPeriod;
    }
  }

  for (const g of S.gates) {
    if (g.state === 'dormant' && S.runners.some(r => r.state === 'run' && r.x >= g.x - CFG.gateArm)) g.state = 'armed';
    if (g.state === 'armed' && S.runners.every(r => r.state !== 'run' || r.x > g.x + 20)) g.state = 'spent';
    if (g.state === 'holding') {
      g.holdT += dt; g.trampleT += dt;
      if (g.trampleT >= CFG.trampleEvery) {
        g.trampleT = 0;
        const held = S.runners.filter(r => r.state === 'run' && r.held);
        if (held.length) { const v = pick(held); killRunner(v, 'trample'); g.deaths++; }
      }
      if (g.holdT >= CFG.holdMax) g.state = 'spent';
      if (g.state === 'spent') releaseGate(g, spread);
    }
  }

  chatter(dt);
  ambient(dt);
  const settled = S.runners.every(r => r.state !== 'run' && r.state !== 'fall');
  if (settled) {
    if (S.stats.arrived === 0) { S.mode = 'lose'; return; }
    const len = Math.min(11, CFG.finale.baseLen + Math.floor(S.stats.arrived / 20));
    S.finale = { len, seq: makeSeq(len), idx: 0, attempts: S.stats.arrived, timer: CFG.finale.keyTime,
                 line: S.runners.filter(r => r.state === 'arrived'), leaving: [] };
    S.mode = 'finale';
  }
}
// forks: branch up into a new tunnel; merges: come back down. Nested branches unwind in order.
function updateLane(r) {
  for (const f of CFG.forks) {
    if (f.x <= r.lastForkX || r.x < f.x) continue;
    r.lastForkX = f.x;
    if (f.from !== r.lane) continue;
    if (Math.random() < f.split) {
      r.route.push({ mergeX: f.merge, back: f.from });
      r.lane = f.to; r.hop = 0.5;
      r.ramp = { x0: f.x, x1: f.x + CFG.rampLen, y0: laneY(f.from), y1: laneY(f.to) };
      dust(r.x, r.y);
    }
  }
  const top = r.route[r.route.length - 1];
  if (top && r.x >= top.mergeX) {
    r.route.pop();
    r.ramp = { x0: top.mergeX, x1: top.mergeX + CFG.rampLen, y0: laneY(r.lane), y1: laneY(top.back) };
    r.lane = top.back;
  }
  if (r.ramp) {
    const t = clamp01((r.x - r.ramp.x0) / (r.ramp.x1 - r.ramp.x0));
    r.y = r.ramp.y0 + (r.ramp.y1 - r.ramp.y0) * t;
    if (t >= 1) r.ramp = null;
  }
}
function chatter(dt) {
  S.sayT -= dt;
  if (S.spike) return;
  if (S.sayT > 0 || S.bubbles.length >= (V.zoom < 0.6 ? 1 : 3)) return;
  S.sayT = rand(0.8, 1.6);
  const vis = S.runners.filter(r => r.state === 'run' && inView(r.x, -40) && !S.bubbles.some(b => b.r === r));
  if (!vis.length) return;
  const named = vis.filter(r => r.name);
  const r = named.length && Math.random() < 0.35 ? pick(named) : pick(vis);
  if (r.held) say(r, 'held');
  else if (S.rooms.some(m => m.lane === r.lane && m.state === 'solved' && r.x >= m.x && r.x < m.x + CFG.gapWidth)) say(r, 'safe');
  else say(r, 'ambient');
}
function updateFx(dt) {
  for (const p of S.particles) {
    const d = PK[p.k] || PK.dust;
    p.vy += d.g * dt;
    const f = Math.max(0, 1 - d.drag * dt);
    p.vx *= f; p.vy *= f;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.rv * dt; p.life -= dt;
  }
  S.particles = S.particles.filter(p => p.life > 0);
  for (const r of S.rings) r.life -= dt;
  S.rings = S.rings.filter(r => r.life > 0);
  for (const f of S.floaters) { if (f.wy !== undefined) f.wy -= 30 * dt; else f.sy -= 30 * dt; f.life -= dt; }
  S.floaters = S.floaters.filter(f => f.life > 0);
  for (const r of S.ripples) { r.r += 40 * dt; r.life -= dt; }
  S.ripples = S.ripples.filter(r => r.life > 0);
  for (const b of S.bubbles) {
    b.life -= dt;
    const r = b.r;
    if (!b.pinned && r.state === 'run') { b.wx = r.x; b.wy = footY(r) - (r.name ? 36 : 33); }
  }
  S.bubbles = S.bubbles.filter(b => b.life > 0);
}
function splash(wx, y) {
  // the more bodies hitting the water together, the bigger the column of spray
  const n = 1 + S.recent.filter(t => S.t - t < 0.35).length;
  const big = Math.min(10, n);
  emit('drop', 10 + big * 3, wx, y, { sx: 3 + big, vx: [-130 - big * 12, 130 + big * 12], vy: [-330 - big * 22, -120], life: [0.45, 1], c: '#bfe6ff' });
  emit('smoke', 2 + Math.ceil(big / 2), wx, y - 4, { sx: 6 + big * 2, vx: [-20, 20], vy: [-30, -8], life: [0.5, 1.1], c: 'rgba(205,238,255,0.32)' });
  S.ripples.push({ x: wx, y, r: 3, life: 0.9 });
  ring(wx, y, 30 + big * 6, 0.5, 'rgba(200,240,255,0.9)', 3, 0.32);
}
function dust(wx, y, c = '#a08c70') {
  emit('dust', 7, wx, y, { sx: 6, sy: 4, vx: [-48, 48], vy: [-72, -14], life: [0.35, 0.75], c });
  emit('chip', 3, wx, y, { sx: 5, vx: [-75, 75], vy: [-135, -40], life: [0.4, 0.8], c: shade(c, 0.7) });
}
// can this runner still arrive at the room? Same tunnel, or a tunnel that forks into it before the room.
function canReach(r, room) {
  if (r.x >= room.x + 8) return false;
  const lanes = new Set([room.lane]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const f of CFG.forks) if (lanes.has(f.to) && f.x > r.x && f.x < room.x && !lanes.has(f.from)) { lanes.add(f.from); grew = true; }
  }
  return lanes.has(r.lane);
}
// where a runner's feet are: the pack's depth (dy) is squeezed onto the walkable strip of the floor
const footY = r => r.y + (r.dy + 22) * 0.3 - 2;
function approaching(room) {
  let n = 0, maxX = -1e9;
  for (const r of S.runners) {
    if (r.state !== 'run' || r.lane !== room.lane || r.x >= room.x + 8 || r.x < room.x - 700) continue;
    n++; if (r.x > maxX) maxX = r.x;
  }
  return { n, eta: n ? (room.x + 8 - maxX) / CFG.scroll : 99 };
}

// ================================================================ draw
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawSky();
  ctx.save();
  if (S.shake > 0) ctx.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  // world space: scaled by zoom, river pinned to the bottom
  ctx.translate(0, H - CFG.worldBottom * V.zoom); ctx.scale(V.zoom, V.zoom);
  drawOutside();
  drawMountain();
  drawRiver();
  carveTunnels();
  for (let k = CFG.laneCount - 1; k >= 0; k--) { drawLane(k); drawRunners(k); }

  for (const g of S.gates) { ctx.fillStyle = g.state === 'spent' ? '#3a5a66' : '#5ce1ff'; ctx.fillRect(tx + tw * g.x / CFG.finale.x - 1, 9, 2, 22); }
  for (const room of S.rooms) {
    const rx = tx + tw * Math.min(1, room.x / CFG.finale.x);
    ctx.fillStyle = room.state === 'solved' ? '#2ecc71' : room.state === 'armed' ? room.color : '#8a8fa3';
    ctx.fillRect(rx - 2, 27 - room.lane * 3.6, 4, 3);
  }
  const cx = tx + tw * Math.min(1, (S.cam + CFG.packFront) / CFG.finale.x);
  ctx.fillStyle = '#fff'; ctx.fillRect(cx - 1, 6, 2, 28);
  if (S.mode === 'play') {
    let hint = 'watch the tunnels ahead';
    const armed = S.rooms.filter(r => r.state === 'armed');
    const gate = S.gates.find(g => g.state === 'armed' || g.state === 'holding');
    if (S.active) hint = VERBS[S.active.verb].hint + '   (ESC to close)';
    else if (armed.length) hint = `press ${armed.map(r => r.hot).sort().join(' or ')} to open a flashing room`;
    if (gate) hint += gate.state === 'holding' ? '   ENTER releases the gate' : '   ENTER holds the crowd at the gate';
    let danger = false;
    if (gate && gate.state === 'holding') {
      const held = S.runners.filter(r => r.state === 'run' && r.held);
      if (held.length && Math.min(...held.map(r => r.x)) - S.collapseX < 260) { hint = 'THE TUNNEL IS CAVING IN BEHIND THEM. ENTER TO RELEASE!'; danger = true; }
    }
    ctx.fillStyle = danger ? 'rgba(120,10,10,0.75)' : 'rgba(8,10,18,0.6)'; ctx.fillRect(0, H - 26, W, 26);
    ctx.fillStyle = danger ? '#fff' : 'rgba(255,255,255,0.8)'; ctx.font = danger ? 'bold 13px monospace' : '13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(hint, W / 2, H - 9); ctx.textAlign = 'left';
  }
}
function drawKeyBoxes(chars, idx, px, py, pw) {
  const boxW = 40, gap = 8, total = chars.length * boxW + (chars.length - 1) * gap;
  let bx = px + (pw - total) / 2;
  for (let i = 0; i < chars.length; i++, bx += boxW + gap) {
    const done = i < idx, cur = i === idx;
    ctx.fillStyle = done ? '#2ecc71' : cur ? '#f1c40f' : '#2a2d3a';
    roundRect(bx, py + 36, boxW, boxW, 6); ctx.fill();
    if (cur) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; roundRect(bx - 2, py + 34, boxW + 4, boxW + 4, 7); ctx.stroke(); }
    ctx.fillStyle = done || cur ? '#111' : '#8a8fa3'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
    ctx.fillText(chars[i], bx + boxW / 2, py + 36 + boxW / 2 + 8);
  }
  ctx.textAlign = 'left';
}
function panelFrame(pw, title, color) {
  const px = W / 2 - pw / 2, py = 48, ph = 110;
  ctx.fillStyle = 'rgba(10,12,20,0.9)'; roundRect(px, py, pw, ph, 10); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 2; roundRect(px, py, pw, ph, 10); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
  ctx.fillText(title, W / 2, py + 22); ctx.textAlign = 'left';
  return [px, py];
}
function drawPanel(room) {
  const v = VERBS[room.verb];
  const pw = Math.max(420, 80 + (room.verb === 'keys' ? room.mg.seq.length : room.verb === 'word' ? room.mg.word.length : 0) * 48);
  const [px, py] = panelFrame(pw, `ROOM ${room.hot}   ${room.title}`, '#5ce1ff');
  v.draw(room.mg, px, py, pw);
}
function drawFinalePanel() {
  const f = S.finale, pw = 80 + f.len * 48;
  const [px, py] = panelFrame(pw, `FINAL GATE   attempts left: ${f.attempts}`, '#f1c40f');
  drawKeyBoxes(f.seq, f.idx, px, py, pw);
  const tw = pw - 56, frac = Math.max(0, f.timer / CFG.finale.keyTime);
  ctx.fillStyle = '#333'; ctx.fillRect(px + 28, py + 96, tw, 6);
  ctx.fillStyle = frac < 0.3 ? '#ff4646' : '#f1c40f'; ctx.fillRect(px + 28, py + 96, tw * frac, 6);
}
function drawTitle() {
  ctx.fillStyle = 'rgba(0,0,0,0.62)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.font = 'bold 52px monospace'; ctx.fillText('HUNDRED RUNNERS', W / 2 + 4, 114);
  ctx.fillStyle = '#f1c40f'; ctx.fillText('HUNDRED RUNNERS', W / 2, 110);
  ctx.fillStyle = '#eee'; ctx.font = '15px monospace';
  const lines = [
    '100 people are running into the mountain. You cannot stop them.',
    'Broken crossings swallow whoever reaches them before you fix them.',
    'Red rooms take everyone. Orange take half. Yellow crushers take some.',
    'The tunnels branch, and branch again. The view pulls back to show them all.',
    '',
    'NUMBER opens a flashing room. Then: hit keys in order, time the winch, or type the word.',
    'ENTER holds the crowd at a gate, but the crush tramples people and the tunnel is caving in behind them.',
    'M mutes. Clear rooms with nobody lost to build a streak.',
    'Everyone who makes it out is one attempt at the final gate.',
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 156 + i * 22));
  ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 20px monospace';
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(S.t * 4); ctx.fillText('SPACE to start', W / 2, 350); ctx.globalAlpha = 1;
  if (S.best) { ctx.fillStyle = '#aaa'; ctx.font = '13px monospace'; ctx.fillText(`best run: ${S.best} survivors`, W / 2, 374); }
  ctx.fillStyle = '#777'; ctx.font = '11px monospace'; ctx.fillText(`build ${BUILD}`, W / 2, H - 34);
  ctx.textAlign = 'left';
}
// a list of names wrapped to the width of the screen, returning the y it finished on
function rollCall(label, names, colour, y) {
  ctx.fillStyle = colour;
  if (!names.length) { ctx.fillText(`${label}: nobody you knew`, W / 2, y); return y + 18; }
  const lines = [];
  let line = `${label}: `;
  names.forEach((nm, i) => {
    const bit = nm + (i < names.length - 1 ? ', ' : '');
    if (ctx.measureText(line + bit).width > W - 80) { lines.push(line); line = '   '; }
    line += bit;
  });
  lines.push(line);
  for (const l of lines) { ctx.fillText(l, W / 2, y); y += 17; }
  return y + 1;
}
function drawEnd() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  const win = S.mode === 'win';
  ctx.fillStyle = win ? '#2ecc71' : '#ff4646'; ctx.font = 'bold 50px monospace';
  ctx.fillText(win ? 'THEY MADE IT' : 'NOBODY MADE IT', W / 2, 150);
  ctx.fillStyle = '#eee'; ctx.font = '18px monospace';
  ctx.fillText(`Lost ${S.stats.dead}   Reached the exit ${S.stats.arrived}`, W / 2, 200);
  const named = S.runners.filter(r => r.name);
  const out = named.filter(r => r.state === 'arrived').map(r => r.name), gone = named.filter(r => r.state !== 'arrived').map(r => r.name);
  ctx.font = '13px monospace';
  let ry = 226;
  ry = rollCall('Made it', out, '#2ecc71', ry);
  ry = rollCall('Lost', gone, '#ff8a8a', ry + 4);
  S.rollBottom = ry;
  if (win) {
    const left = S.finale.attempts;
    const rank = left >= 50 ? 'S' : left >= 30 ? 'A' : left >= 15 ? 'B' : left >= 5 ? 'C' : 'D';
    const line = { S: 'the mountain never touched them', A: 'a good day under the rock', B: 'they will talk about this', C: 'the mountain remembers', D: 'barely' }[rank];
    const by = Math.max(296, S.rollBottom + 24);
    ctx.fillStyle = '#eee'; ctx.font = '18px monospace'; ctx.fillText(`Survivors: ${left}${left >= S.best && left > 0 ? '   new best' : ''}   best streak x${S.bestStreak}`, W / 2, by);
    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 54px monospace'; ctx.fillText(`RANK ${rank}`, W / 2, by + 62);
    ctx.fillStyle = '#aaa'; ctx.font = '15px monospace'; ctx.fillText(line, W / 2, by + 88);
  } else {
    const worst = S.rooms.reduce((a, b) => b.deaths > a.deaths ? b : a, S.rooms[0]);
    ctx.fillStyle = '#eee'; ctx.font = '16px monospace';
    if (worst.deaths > 0) ctx.fillText(`Worst crossing: ${worst.deaths} lost at the ${worst.type}`, W / 2, Math.max(300, S.rollBottom + 26));
  }
  ctx.fillStyle = '#eee'; ctx.font = '18px monospace'; ctx.fillText('R to run it again', W / 2, H - 26);
  ctx.textAlign = 'left';
}

// ================================================================ loop
let last = performance.now();
function frame(now) {
  const real = Math.min(0.05, (now - last) / 1000); last = now;
  update(S.spike ? real * 0.25 : real); draw();
  if (S.spike) { S.spike.t -= real; if (S.spike.t <= 0) S.spike = null; }
  if (S.spikeCool > 0) S.spikeCool -= real;
  requestAnimationFrame(frame);
}
reset();
updateView(1);
const qs = new URLSearchParams(location.search);
// ?start&skip=N runs N seconds of play; add &solve to have a bot clear every room it meets
function devSolve() {
  const fire = k => window.dispatchEvent(new KeyboardEvent('keydown', { key: k }));
  for (const r of S.rooms.filter(r => r.state === 'armed')) {
    fire(String(r.hot));
    let guard = 0;
    while (S.active === r && guard++ < 200) {
      const m = r.mg;
      if (r.verb === 'keys') fire(m.seq[m.idx]);
      else if (r.verb === 'word') fire(m.word[m.idx]);
      else { m.pos = m.zone + m.zoneW / 2; fire(' '); }
    }
  }
}
if (qs.has('start')) {
  S.mode = 'play';
  const n = +(qs.get('skip') || 0) * 60, solve = qs.has('solve');
  for (let i = 0; i < n; i++) { update(1 / 60); if (solve) devSolve(); }
}
if (qs.has('finale')) {
  S.runners.slice(0, 12).forEach(r => { r.state = 'arrived'; });
  S.stats.arrived = 12; S.cam = S.camMax; updateView(1);
  S.finale = { len: 6, seq: makeSeq(6), idx: 2, attempts: 12, timer: 0.9, line: S.runners.slice(0, 12), leaving: [] }; S.mode = 'finale';
}
requestAnimationFrame(frame);
</script>
