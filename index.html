<script>
'use strict';
// ================================================================ config
const W = 960, H = 540;
const CFG = {

  packFront: 540,         // first runner's starting position ahead of the camera anchor

  laneCount: 6,

CFG.exit = CFG.finale.x - 10;
const laneY = k => CFG.baseY - CFG.laneGap * k;
// where each tunnel exists: tunnel 0 runs the whole mountain, others exist between their fork and merge
const LANE_SPANS = [];
for (let k = 0; k < CFG.laneCount; k++) LANE_SPANS.push(k === 0 ? [[CFG.entrance - 20, CFG.exit + 20]] : CFG.forks.filter(f => f.to === k).map(f => [f.x + CFG.rampLen, f.merge]));
const laneAt = (k, x) => LANE_SPANS[k].some(([a, b]) => x >= a && x <= b);

const LINES = {
  ambient: [
    'Yay, I retire tomorrow!', 'Best day of my life!', 'Nothing can go wrong!', "Wait, what's a drawbridge?",
    'I left the oven on.', 'My knees feel great today!', 'Is this the queue for the gift shop?', "I've never felt safer.",

  fall: [

const WORDS = {

// ================================================================ helpers
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const rand = (a, b) => a + Math.random() * (b - a);
const pick = s => s[Math.floor(Math.random() * s.length)];
const themeWord = () => pick(WORDS[Math.floor(rand(3, 7))]);
const clamp01 = v => Math.max(0, Math.min(1, v));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const SKIN = ['#f5e6d3', '#e0b899', '#c68642', '#8d5524'];
const SHIRT = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c', '#ecf0f1', '#ff7eb6'];
const PANTS = ['#2c3e50', '#34495e', '#5d6d7e', '#1f2a44', '#6e4b2a'];
const HAIR = ['#2b1b0e', '#e6c46b', '#8b2500', '#111111', '#b5651d', '#d9d9d9'];
function makeSeq(n) {
  const s = []; let last = '';
  while (s.length < n) { const k = pick(CFG.keyPool); if (k !== last) { s.push(k); last = k; } }
  return s;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function loadBest() { try { return +localStorage.getItem('hr_best') || 0; } catch (e) { return 0; } }
function saveBest(n) { try { if (n > loadBest()) localStorage.setItem('hr_best', String(n)); } catch (e) {} }

// ================================================================ view: camera anchor, zoom, world <-> screen
// The world is drawn scaled by V.zoom with the river pinned to the bottom of the screen.
const V = { left: 0, zoom: 1, vw: W };
function updateView(dt) {
  V.vw = W / V.zoom;
  V.left = S.cam + CFG.packFront - 0.56 * V.vw;
  // zoom out so every tunnel active in view fits
  let top = 0;
  for (let k = 1; k < CFG.laneCount; k++) {
    if (LANE_SPANS[k].some(([a, b]) => b > V.left - 100 && a < V.left + V.vw + 250)) top = k;
  }
  const minY = laneY(top) - CFG.tunnelH - 60;
  const target = Math.min(1, (H - 46) / (CFG.worldBottom - minY));
  V.zoom += (target - V.zoom) * Math.min(1, dt * 1.6);
}
const toScreen = (wx, wy) => [(wx - V.left) * V.zoom, H + (wy - CFG.worldBottom) * V.zoom];
const inView = (wx, margin = 100) => wx > V.left - margin && wx < V.left + V.vw + margin;

// ================================================================ mini-game verbs
const VERBS = {
  keys: {
    hint: 'hit the highlighted keys in order',
    start() { return { seq: themeWord().split(''), idx: 0 }; },
    key(m, k) {
      if (!/^[A-Z]$/.test(k)) return null;
      if (k === m.seq[m.idx]) { m.idx++; return m.idx >= m.seq.length ? 'done' : 'ok'; }
      m.idx = 0; return 'wrong';
    },
    update() {},
    progress(m) { return m.idx / m.seq.length; },
    draw(m, px, py, pw) { drawKeyBoxes(m.seq, m.idx, px, py, pw); },
  },
  bar: {
    hint: 'SPACE when the marker is in the green',
    start(diff) {
      const m = { pos: 0, dir: 1, speed: 0.9 + 0.12 * diff, zoneW: 0.3 - 0.025 * diff, zone: 0, hits: 0, need: [1, 2, 2, 2, 3][diff - 1] };
      m.zone = rand(0.15, 0.85 - m.zoneW); return m;
    },
    key(m, k) {
      if (k !== ' ') return null;
      if (m.pos >= m.zone && m.pos <= m.zone + m.zoneW) {
        m.hits++; m.zone = rand(0.1, 0.9 - m.zoneW);
        return m.hits >= m.need ? 'done' : 'ok';
      }
      return 'wrong';
    },
    update(m, dt) {
      m.pos += m.dir * m.speed * dt;
      if (m.pos > 1) { m.pos = 2 - m.pos; m.dir = -1; }
      if (m.pos < 0) { m.pos = -m.pos; m.dir = 1; }
    },
    progress(m) { return m.hits / m.need; },
    draw(m, px, py, pw) {
      const tx = px + 28, tw = pw - 56, ty = py + 46;
      ctx.fillStyle = '#2a2d3a'; roundRect(tx, ty, tw, 20, 6); ctx.fill();
      ctx.fillStyle = '#2ecc71'; ctx.fillRect(tx + tw * m.zone, ty, tw * m.zoneW, 20);
      const mx = tx + tw * m.pos;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(mx, ty - 2); ctx.lineTo(mx - 7, ty - 12); ctx.lineTo(mx + 7, ty - 12); ctx.fill();
      ctx.fillRect(mx - 1.5, ty - 2, 3, 24);
      for (let i = 0; i < m.need; i++) {
        ctx.fillStyle = i < m.hits ? '#2ecc71' : '#444';
        ctx.beginPath(); ctx.arc(px + pw / 2 + (i - (m.need - 1) / 2) * 18, ty + 34, 5, 0, 6.28); ctx.fill();
      }
    },
  },
  word: {
    hint: 'type the word',
    start() { return { word: themeWord(), idx: 0 }; },
    key(m, k) {
      if (k.length !== 1 || k < 'A' || k > 'Z') return null;
      if (k === m.word[m.idx]) { m.idx++; return m.idx >= m.word.length ? 'done' : 'ok'; }
      m.idx = 0; return 'wrong';
    },
    update() {},
    progress(m) { return m.idx / m.word.length; },
    draw(m, px, py, pw) { drawKeyBoxes(m.word.split(''), m.idx, px, py, pw); },
  },
};

// ================================================================ factory puzzles
const ARROWS = ['ARROWLEFT', 'ARROWUP', 'ARROWRIGHT', 'ARROWDOWN'];
const ARROW_LABELS = ['←', '↑', '→', '↓'];
const mod12 = n => (n % 12 + 12) % 12;
function factoryText(text, x, y, color = '#d5d9e2', size = 13) {
  ctx.fillStyle = color; ctx.font = `${size}px monospace`; ctx.textAlign = 'center';
  ctx.fillText(text, x, y); ctx.textAlign = 'left';
}
function gearShape(x, y, radius, angle, color = '#657183') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 48; i++) {
    const a = i * Math.PI / 24, r = radius * (i % 4 < 2 ? 1 : 0.85);
    if (!i) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1b202c'; ctx.beginPath(); ctx.arc(0, 0, radius * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#9aa7ba'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}
const LIGHT_BEAT = 0.7 / 1.2; // Playback is 20% faster; input feedback keeps its duration.
function lightRound(m) {
  const len = 4;
  m.seq = Array.from({ length: len }, () => String(Math.floor(rand(1, 10))));
  m.idx = 0; m.watch = true; m.clock = 0;
}
const GEAR_LAYOUT = { step: 76, orbit: 38, markerRadius: 6 };
function gearMarkPoint(m, gear, side) {
  const angle = (m.phase - m.goal) * Math.PI / 6 * (gear % 2 ? -1 : 1) + (side < 0 ? Math.PI : 0);
  return { x: gear * GEAR_LAYOUT.step + Math.cos(angle) * GEAR_LAYOUT.orbit, y: Math.sin(angle) * GEAR_LAYOUT.orbit };
}
function gearsAligned(m) {
  // Winning uses the same colored circles as rendering, including their visible radii.
  for (let i = 0; i < m.n - 1; i++) {
    const a = gearMarkPoint(m, i, 1), b = gearMarkPoint(m, i + 1, -1);
    if (Math.hypot(a.x - b.x, a.y - b.y) > 2 * GEAR_LAYOUT.markerRadius + 0.01) return false;
  }
  return true;
}
function connectMatchingWire(m) {
  if (!m.pulling || m.links.includes(m.target) || m.left[m.idx] !== m.right[m.target]) return 'ok';
  m.links.push(m.target); m.idx++; m.pulling = false;
  if (m.idx === m.left.length) return 'done';
  m.target = m.right.findIndex((_, i) => !m.links.includes(i));
  return 'ok';
}
Object.assign(VERBS, {
  wires: {
    hint: 'RIGHT pull · UP/DOWN choose free socket · matching colors connect automatically',
    start() {
      const shuffle = list => { for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(rand(0, i + 1)); [list[i], list[j]] = [list[j], list[i]]; } return list; };
      const left = shuffle([0, 1, 2, 3]).slice(0, Math.floor(rand(3, 5)));
      const right = shuffle([...left]);
      if (right.every((color, i) => color === left[i])) [right[0], right[1]] = [right[1], right[0]];
      return { left, right, idx: 0, target: 0, pulling: false, links: [], wrong: 0 };
    },
    key(m, k) {
      if (m.idx >= m.left.length) return null;
      if (m.pulling && (k === 'ARROWUP' || k === 'ARROWDOWN')) {
        do { m.target = (m.target + (k === 'ARROWUP' ? m.right.length - 1 : 1)) % m.right.length; } while (m.links.includes(m.target));
        return connectMatchingWire(m);
      }
      if (k !== 'ARROWRIGHT' || m.pulling) return null;
      m.pulling = true;
      return connectMatchingWire(m);
    },
    update(m, dt) { m.wrong = Math.max(0, m.wrong - dt); },
    progress(m) { return m.idx / m.left.length; },
    draw(m, px, py, pw) {
      const colors = ['#ff706c', '#5ce1ff', '#f1c40f', '#ad8bfa'];
      const lx = px + 106, rx = px + pw - 106, yy = i => py + 73 + i * 31;
      factoryText(`CONNECT MATCHING COLORS · ${m.idx}/${m.left.length}`, px + pw / 2, py + 47, '#b8c2d2', 12);
      for (let i = 0; i < m.left.length; i++) {
        const color = colors[m.left[i]], current = i === m.idx;
        if (current) { ctx.fillStyle = 'rgba(92,225,255,0.14)'; ctx.fillRect(lx - 45, yy(i) - 12, 96, 24); }
        ctx.strokeStyle = color; ctx.lineWidth = current ? 6 : 3; ctx.beginPath(); ctx.moveTo(lx - 34, yy(i)); ctx.lineTo(lx + 35, yy(i)); ctx.stroke();
        factoryText(String(i + 1), lx - 56, yy(i) + 4, current ? '#fff' : '#6e7a8e', 12);
        if (i < m.idx || current && m.pulling) {
          const target = i < m.idx ? m.links[i] : m.target;
          ctx.lineWidth = current ? 5 : 3; ctx.globalAlpha = current ? 1 : 0.65;
          ctx.beginPath(); ctx.moveTo(lx + 35, yy(i)); ctx.bezierCurveTo(lx + 115, yy(i), rx - 115, yy(target), rx - 16, yy(target)); ctx.stroke(); ctx.globalAlpha = 1;
        }
        ctx.fillStyle = m.links.includes(i) ? '#234539' : '#273142'; ctx.fillRect(rx - 18, yy(i) - 12, 63, 24);
        ctx.strokeStyle = m.pulling && m.target === i ? (m.wrong > 0 ? '#ff5555' : '#fff') : '#57677d'; ctx.lineWidth = m.pulling && m.target === i ? 2 : 1; ctx.strokeRect(rx - 18, yy(i) - 12, 63, 24);
        ctx.fillStyle = colors[m.right[i]]; ctx.beginPath(); ctx.arc(rx - 5, yy(i), 6, 0, Math.PI * 2); ctx.fill();
        factoryText(m.links.includes(i) ? 'OK' : String(i + 1), rx + 25, yy(i) + 4, '#d4dcea', 12);
      }
      factoryText(m.pulling ? '↑ ↓ choose a free socket · matching color auto-connects' : 'Highlighted wire is next · → pull it to the sockets', px + pw / 2, py + 201, '#5ce1ff', 12);
    },
  },
  gears: {
    hint: 'Arrow keys rotate the linked gears',
    start() {
      const n = Math.floor(rand(2, 4)), goal = Math.floor(rand(0, 12));
      // Marks touch within one step of the exact center; offsets 4–8 still need at least three moves.
      const offset = Math.floor(rand(4, 9));
      return { n, goal, phase: mod12(goal + offset) };
    },
    key(m, k) {
      if (!ARROWS.includes(k)) return null;
      if (gearsAligned(m)) return 'done';
      m.phase = mod12(m.phase + (k === 'ARROWUP' || k === 'ARROWRIGHT' ? 1 : -1));
      return gearsAligned(m) ? 'done' : 'ok';
    },
    update() {}, progress(m) { return gearsAligned(m) ? 1 : 0; },
    draw(m, px, py, pw) {
      const r = 40, cy = py + 108, step = GEAR_LAYOUT.step;
      const origin = px + pw / 2 - (m.n - 1) / 2 * step;
      const angle = (m.phase - m.goal) * Math.PI / 6;
      for (let i = 0; i < m.n; i++) {
        const x = px + pw / 2 + (i - (m.n - 1) / 2) * step, a = angle * (i % 2 ? -1 : 1);
        gearShape(x, cy, r, a);
        // The middle gear has one colored marker for each neighboring contact.
        for (const side of [-1, 1]) {
          if ((side < 0 && i === 0) || (side > 0 && i === m.n - 1)) continue;
          const point = gearMarkPoint(m, i, side), pair = side < 0 ? i - 1 : i;
          ctx.fillStyle = ['#f1c40f', '#ff7eb6'][pair];
          ctx.beginPath(); ctx.arc(origin + point.x, cy + point.y, GEAR_LAYOUT.markerRadius, 0, Math.PI * 2); ctx.fill();
        }
        factoryText(String(i + 1), x, cy + 5, '#fff');
      }
      factoryText('Meet matching marks at EVERY contact point', px + pw / 2, py + 177);
      factoryText('↑ / → rotate clockwise · ↓ / ← reverse · ESC close', px + pw / 2, py + 199, '#5ce1ff', 12);
    },
  },
  levers: {
    hint: 'ARROW keys set the highlighted lever to match the instruction board',
    start() { return { seq: Array.from({ length: Math.floor(rand(5, 7)) }, () => Math.floor(rand(0, 4))), idx: 0, positions: [] }; },
    key(m, k) {
      const direction = ARROWS.indexOf(k); if (direction < 0) return null;
      m.positions[m.idx] = direction;
      if (direction !== m.seq[m.idx]) return 'wrong';
      return ++m.idx === m.seq.length ? 'done' : 'ok';
    },
    update() {}, progress(m) { return m.idx / m.seq.length; },
    draw(m, px, py, pw) {
      factoryText('INSTRUCTION BOARD', px + pw / 2, py + 49, '#aaa', 11);
      m.seq.forEach((direction, i) => {
        const x = px + pw / 2 + (i - (m.seq.length - 1) / 2) * 76;
        factoryText(ARROW_LABELS[direction], x, py + 76, i < m.idx ? '#2ecc71' : '#f1c40f', 26);
        ctx.fillStyle = '#303746'; ctx.fillRect(x - 26, py + 95, 52, 62);
        ctx.strokeStyle = i === m.idx ? '#5ce1ff' : '#626a78'; ctx.lineWidth = i === m.idx ? 3 : 1; ctx.strokeRect(x - 26, py + 95, 52, 62);
        const a = (m.positions[i] === undefined ? 1 : m.positions[i]) * Math.PI / 2 + Math.PI;
        ctx.strokeStyle = '#acb3bf'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x, py + 126); ctx.lineTo(x + Math.cos(a) * 19, py + 126 + Math.sin(a) * 19); ctx.stroke();
        ctx.fillStyle = i < m.idx ? '#2ecc71' : '#dedaca'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 19, py + 126 + Math.sin(a) * 19, 7, 0, Math.PI * 2); ctx.fill();

// ================================================================ input
window.addEventListener('keydown', e => {

// V3: travel as a group; feed dangerous rooms one runner at a time.
// Keep a room selectable while any living runner can still reach it, including
// runners on future forks or returning from nested branches. Do not predict deaths.
function canReachRoom(r, room) {
  const end = room.x + CFG.gapWidth + 8;
  if (r.state !== 'run' || r.x >= end) return false;
  const forks = CFG.forks.filter(f => f.x > r.lastForkX && f.x >= r.x && f.x < end);
  function visit(x, lane, route, nextFork) {
    const fork = forks[nextFork], top = route[route.length - 1];
    const forkX = fork ? fork.x : Infinity;
    const mergeX = top ? Math.max(x, top.mergeX) : Infinity;
    const nextX = Math.min(forkX, mergeX, end);
    if (lane === room.lane && Math.max(x, room.x) < nextX) return true;
    if (nextX >= end) return false;
    if (mergeX < forkX) return visit(mergeX, top.back, route.slice(0, -1), nextFork);
    if (fork.from !== lane) return visit(forkX, lane, route, nextFork + 1);
    if (fork.split < 1 && visit(forkX, lane, route, nextFork + 1)) return true;
    return fork.split > 0 && visit(forkX, fork.to,
      [...route, { mergeX: fork.merge, back: fork.from }], nextFork + 1);
  }
  return visit(r.x, r.lane, r.route, 0);
}
function retireEmptyRooms() {
  for (const room of S.rooms) {
    if (room.state !== 'armed' || S.runners.some(r => canReachRoom(r, room))) continue;
    room.state = 'spent'; room.hot = null;
    if (S.active === room) S.active = null;
  }
}
function roomEntry(room) { return room.x + (room.hazard === 'machine' ? 72 : -2); }
function moveFormation(dt) {
  for (let lane = 0; lane < CFG.laneCount; lane++) {
    const line = S.runners.filter(r => r.state === 'run' && r.lane === lane).sort((a, b) => b.x - a.x);
    if (!line.length) continue;
    const front = line[0].x;
    const obstacles = S.rooms.filter(room => room.lane === lane && room.state !== 'solved').sort((a, b) => a.x - b.x);
    for (let i = 0; i < line.length; i++) {
      const r = line[i], oldX = r.x, ahead = line[i - 1];
      const room = obstacles.find(room => oldX <= room.x + CFG.gapWidth + 8 && oldX >= roomEntry(room) - CFG.queueApproach);
      let next = oldX + CFG.scroll * dt;
      let targetDy = r.groupDy;
      if (room) {
        const entry = roomEntry(room), end = room.x + CFG.gapWidth + 8;
        // Followers wait without moving backwards while the compact group stretches into a line.
        if (ahead && oldX <= entry) next = Math.min(next, Math.max(oldX, ahead.x - CFG.runnerSpacing));
        if (oldX <= entry && line.some(other => other !== r && other.x > entry && other.x < end)) next = Math.min(next, entry);
        if (!ahead || ahead.x - oldX >= CFG.runnerSpacing - 1 || oldX > entry) targetDy = 0;
      } else {
        // Catch up gently after the obstacle to reform the five-person-wide group.
        const target = front - Math.floor(i / CFG.groupRows) * CFG.runnerSpacing;
        next = oldX + (CFG.scroll + Math.min(25, Math.max(0, target - oldX) * 1.5)) * dt;
      }
      r.x = Math.max(oldX, next);
      r.queueWaiting = r.x === oldX;
      r.dy += (targetDy - r.dy) * Math.min(1, dt * 8);

// ================================================================ update
function update(dt) {
  if (S.paused) return;
  S.t += dt;
  S.wrongFlash = Math.max(0, S.wrongFlash - dt);
  S.shake = Math.max(0, S.shake - dt * 14);
  updateFx(dt);
  for (const r of S.runners) { r.phase += dt * 7; r.hop = Math.max(0, r.hop - dt); }
  if (S.mode === 'finale') {
    const f = S.finale;
    f.timer -= dt;
    for (const l of f.leaving) l.t += dt;
    if (f.timer <= 0) finaleFail();

    return;
  }

  updateView(dt);
  if (S.active) VERBS[S.active.verb].update(S.active.mg, dt);
  if (S.active && S.active.verb === 'gears' && gearsAligned(S.active.mg)) clearRoom(S.active);
  for (const room of S.rooms) {
    if (room.state === 'armed' && room.verb === 'lights' && room.mg.round === 2) {

      else r.held = false;
      if (r.x >= CFG.finale.x - 40) { r.state = 'arrived'; S.stats.arrived++; continue; }
      updateLane(r);
      for (const room of S.rooms) {
        if (room.lane !== r.lane || room.state === 'solved') continue;
        if (room.hazard === 'press') continue;
        if (room.hazard === 'machine') {
          if (r.x >= room.x + 88 && r.x < room.x + CFG.gapWidth) { killRunner(r, room.type === 'wiring' ? 'electric' : 'crush'); room.deaths++; break; }
          continue;
        }
        if (r.x < room.x + 8 || r.x >= room.x + CFG.gapWidth) continue;
        if (room.hazard === 'burst') continue;
        if (room.hazard === 'half') { if (r.rolled === room) continue; r.rolled = room; if (Math.random() < 0.5) continue; }
        r.state = 'fall'; r.vy = 0; r.fy = 0; r.fallLimit = r.lane === 0 ? CFG.riverY - r.y : 60; room.deaths++;
        if (Math.random() < 0.35 && S.t - S.lastWordT > 0.4) { S.lastWordT = S.t; S.bubbles = S.bubbles.filter(b => b.r !== r); say(r, 'fall', 1.4); }
        break;
      }
    } else if (r.state === 'fall') {
      r.vy += 900 * dt; r.fy += r.vy * dt; r.rot += 6 * dt; r.x += CFG.scroll * 0.3 * dt;
      if (r.fy > r.fallLimit) killRunner(r, r.lane === 0 ? 'splash' : 'dark');
    }
  }

  retireEmptyRooms();
  for (const room of S.rooms) {
    if (room.state === 'dormant') {
      const near = S.runners.some(r => r.state === 'run' && r.lane === room.lane && r.x >= room.x - CFG.armDist && r.x < room.x + CFG.gapWidth + 8);
      if (near) armRoom(room);
    }
    if (room.hazard === 'press' && room.state !== 'solved') {
      const before = Math.floor((room.pressT || 0) / 0.65);
      room.pressT = (room.pressT || 0) + dt;
      const beat = Math.floor(room.pressT / 0.65);
      if (beat > before) {

  ctx.fillStyle = win ? '#2ecc71' : '#ff4646'; ctx.font = 'bold 50px monospace';
  ctx.fillText(win ? 'THEY MADE IT' : 'NOBODY MADE IT', W / 2, 150);
  ctx.fillStyle = '#eee'; ctx.font = '18px monospace';
  ctx.fillText(`Lost ${S.stats.dead}   Reached the exit ${S.stats.arrived}`, W / 2, 200);
  const named = S.runners.filter(r => r.name);
  const out = named.filter(r => r.state === 'arrived').map(r => r.name), gone = named.filter(r => r.state !== 'arrived').map(r => r.name);
  ctx.font = '14px monospace';
  ctx.fillStyle = '#2ecc71'; ctx.fillText(`Made it: ${out.length ? out.join(', ') : 'nobody you knew'}`, W / 2, 232);
  ctx.fillStyle = '#ff8a8a'; ctx.fillText(`Lost: ${gone.length ? gone.join(', ') : 'nobody you knew'}`, W / 2, 254);
  if (win) {
    const left = S.finale.attempts;
    const rank = left >= 50 ? 'S' : left >= 30 ? 'A' : left >= 15 ? 'B' : left >= 5 ? 'C' : 'D';
    const line = { S: 'the mountain never touched them', A: 'a good day under the rock', B: 'they will talk about this', C: 'the mountain remembers', D: 'barely' }[rank];
    ctx.fillStyle = '#eee'; ctx.font = '18px monospace'; ctx.fillText(`Survivors: ${left}${left >= S.best && left > 0 ? '   new best' : ''}`, W / 2, 296);
    ctx.fillStyle = '#f1c40f'; ctx.font = 'bold 60px monospace'; ctx.fillText(`RANK ${rank}`, W / 2, 364);
    ctx.fillStyle = '#aaa'; ctx.font = '15px monospace'; ctx.fillText(line, W / 2, 392);
  } else {
    const worst = S.rooms.reduce((a, b) => b.deaths > a.deaths ? b : a, S.rooms[0]);
    ctx.fillStyle = '#eee'; ctx.font = '16px monospace';
    if (worst.deaths > 0) ctx.fillText(`Worst crossing: ${worst.deaths} lost at the ${worst.type}`, W / 2, 300);
  }
  ctx.fillStyle = '#eee'; ctx.font = '18px monospace'; ctx.fillText('R to run it again', W / 2, 440);
  ctx.textAlign = 'left';
}

// ================================================================ loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
reset();
updateView(1);
const qs = new URLSearchParams(location.search);
if (qs.has('start')) { S.mode = 'play'; const n = +(qs.get('skip') || 0) * 60; for (let i = 0; i < n; i++) update(1 / 60); }
if (qs.has('finale')) {
  S.runners.slice(0, 12).forEach(r => { r.state = 'arrived'; });
  S.stats.arrived = 12; S.cam = S.camMax; updateView(1);
  S.finale = { len: 6, seq: makeSeq(6), idx: 2, attempts: 12, timer: 0.9, line: S.runners.slice(0, 12), leaving: [] }; S.mode = 'finale';
}
requestAnimationFrame(frame);
</script>
